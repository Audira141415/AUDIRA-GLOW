<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cities · iso-glow demo</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&display=swap">
<style>
  :root {
    color-scheme: dark;
    --bg:#0c0d0e; --panel:#141516; --edge:#222426;
    --line:#3d4144; --detail:#2b2e30; --body:#17181a; --deck:#1b1d1f;
    --ink:#868b8f; --ink-hi:#e6e8e9; --live:#f4f5f5;
    --glass:#0f1011; --glass-on:#1a1410; --recess:#0e0f10;
    --accent:#ff9a2e; --accent-hi:#ffc77a; --accent-dim:rgba(255,154,46,.10);
    --mono:"DM Mono",ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  }
  @media (prefers-color-scheme: light) { :root:not([data-theme="dark"]) {
    color-scheme: light;
    --bg:#e9eaea; --panel:#f6f6f5; --edge:#d6d8d8;
    --line:#8e9397; --detail:#c3c6c8; --body:#ececeb; --deck:#f3f3f2;
    --ink:#6a6f73; --ink-hi:#16181a; --live:#0c0d0e;
    --glass:#dcdede; --glass-on:#f3e6da; --recess:#e2e4e4;
    --accent:#ff9a2e; --accent-hi:#ffc77a; --accent-dim:rgba(255,154,46,.10);
  } }
  :root[data-theme="light"] {
    color-scheme: light;
    --bg:#e9eaea; --panel:#f6f6f5; --edge:#d6d8d8;
    --line:#8e9397; --detail:#c3c6c8; --body:#ececeb; --deck:#f3f3f2;
    --ink:#6a6f73; --ink-hi:#16181a; --live:#0c0d0e;
    --glass:#dcdede; --glass-on:#f3e6da; --recess:#e2e4e4;
    --accent:#ff9a2e; --accent-hi:#ffc77a; --accent-dim:rgba(255,154,46,.10);
  }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font-family:var(--mono); font-size:13px; padding:20px 16px 32px; }
  .wrap { max-width:1180px; margin-inline:auto; display:grid; gap:14px; }
  .top { display:flex; flex-wrap:wrap; align-items:center; justify-content:space-between; gap:8px 18px; text-transform:uppercase; letter-spacing:.14em; padding:0 4px; }
  .top .hi { color:var(--ink-hi); }
  .top .dot { display:inline-block; width:6px; height:6px; border-radius:50%; background:var(--accent); box-shadow:0 0 8px var(--accent); margin-right:10px; vertical-align:1px; }
  .arrows { display:flex; gap:6px; }
  .arrows button, nav button { font:inherit; color:inherit; background:none; border:1px solid var(--edge); border-radius:10px; cursor:pointer; }
  .arrows button { padding:6px 12px; letter-spacing:.14em; text-transform:uppercase; }
  .arrows button:hover { color:var(--ink-hi); border-color:var(--line); }
  .top .hi { margin-right:auto; }
  .swatches { display:flex; align-items:center; gap:4px; padding:4px; border:1px solid var(--edge); border-radius:999px; }
  .swatches button { width:26px; height:26px; border-radius:50%; border:1px solid transparent; background:none; cursor:pointer; display:grid; place-items:center; padding:0; }
  .swatches button i { width:12px; height:12px; border-radius:50%; background:var(--sw); border:1px solid var(--line); box-shadow:0 0 0 0 var(--sw); transition:box-shadow .2s, transform .2s; }
  .swatches button:hover i { transform:scale(1.15); }
  .swatches button[aria-checked="true"] { border-color:var(--line); }
  .swatches button[aria-checked="true"] i { box-shadow:0 0 10px 1px var(--sw); }
  .swatches button:focus-visible { outline:2px solid var(--accent); outline-offset:1px; }
  .layout { display:grid; grid-template-columns:230px minmax(0,1fr); grid-template-rows:auto 1fr; grid-template-areas:"nav fig" "credit fig"; gap:14px; align-items:start; }
  .layout > nav { grid-area:nav; } .layout > figure { grid-area:fig; } .layout > .credit { grid-area:credit; }
  .made-with { display:flex; justify-content:flex-end; padding:2px 6px 0; font-size:11px; letter-spacing:.12em; text-transform:uppercase; }
  .made-with a { color:var(--line); text-decoration:none; transition:color .2s; }
  .made-with a:hover { color:var(--ink); }
  .credit { align-self:end; display:grid; gap:3px; padding:0 16px 22px; font-size:12px; line-height:1.5; letter-spacing:.04em; }
  .credit a { color:var(--ink); text-decoration:none; width:fit-content; transition:color .2s; }
  .credit a:hover { color:var(--ink-hi); }
  .credit a:hover .ar { color:var(--accent); }
  .credit .ar { color:var(--line); transition:color .2s; }
  .credit .by { color:var(--line); }
  .credit .nm { color:var(--ink); }
  .credit .cr { color:var(--line); margin-top:8px; font-size:11px; display:grid; gap:1px; }
  .credit .cr .hs { white-space:nowrap; }
  .credit .cr a { color:var(--line); }
  .credit .cr a:hover { color:var(--ink-hi); }
  .credit .soc { display:flex; gap:12px; margin-top:4px; }
  .credit .soc a { display:grid; place-items:center; width:16px; height:16px; }
  .credit .soc svg { width:14px; height:14px; fill:currentColor; transition:fill .2s; }
  .credit .soc a:hover svg { fill:var(--accent); }
  .credit a:focus-visible { outline:1px solid var(--accent); outline-offset:2px; border-radius:3px; }
  nav { display:grid; gap:4px; background:var(--panel); border:1px solid var(--edge); border-radius:22px; padding:14px; }
  nav button { display:flex; gap:12px; align-items:center; text-align:left; padding:9px 12px; border-color:transparent; letter-spacing:.06em; }
  nav button .n { color:var(--line); font-size:12px; transition:color .2s; }
  nav button:hover { color:var(--ink-hi); }
  nav button[aria-current="true"] { color:var(--ink-hi); border-color:var(--edge); background:var(--bg); }
  nav button[aria-current="true"] .n { color:var(--accent); text-shadow:0 0 8px var(--accent); }
  figure { margin:0; background:var(--panel); border:1px solid var(--edge); border-radius:22px; padding:22px 26px; display:grid; gap:6px; min-width:0; }
  .cap { display:flex; flex-wrap:wrap; justify-content:space-between; gap:4px 18px; text-transform:uppercase; letter-spacing:.14em; }
  .cap .hi { color:var(--ink-hi); text-transform:none; letter-spacing:.05em; }
  #stageHolder { aspect-ratio:4/3; border-radius:14px; transition:background .5s; background:radial-gradient(ellipse 50% 45% at 50% 52%, transparent, transparent); }
  #stageHolder.glow { background:radial-gradient(ellipse 50% 45% at 50% 52%, var(--accent-dim), transparent 72%); }
  #stage { width:100%; height:100%; display:block; touch-action:manipulation; user-select:none; -webkit-user-select:none; }
  #stage:focus { outline:none; }
  #stage:focus-visible { outline:1px dashed var(--line); outline-offset:4px; border-radius:8px; }
  .fx { position:absolute; width:0; height:0; overflow:hidden; }
  @media (max-width: 820px) {
    .layout { grid-template-columns:1fr; grid-template-rows:auto; grid-template-areas:"nav" "fig" "credit"; }
    .credit { padding:4px 8px 0; display:flex; flex-wrap:wrap; align-items:center; gap:4px 14px; }
    .credit .soc { margin-top:0; }
    .credit .cr { margin-top:0; flex-basis:100%; }
    nav { position:relative; top:0; display:flex; overflow-x:auto; border-radius:16px; padding:8px; scrollbar-width:none; }
    nav button { flex:none; padding:8px 10px; }
    figure { padding:16px; }
  }

  /* ---------- shared figure vocabulary ---------- */
  #stage text { font-family:var(--mono); }
  .face { fill:var(--body); stroke:var(--line); stroke-width:1; vector-effect:non-scaling-stroke; stroke-linejoin:round; }
  .face.top { fill:var(--deck); }
  .face.recess { fill:var(--recess); }
  .detail { fill:none; stroke:var(--detail); stroke-width:1; vector-effect:non-scaling-stroke; }
  .label { fill:var(--ink); font-family:var(--mono); }
  .glass { fill:var(--glass); transition:fill .3s, stroke .3s; }
  .glass.hot { fill:var(--glass-on); stroke:var(--accent); }
  .halo { fill:var(--accent); opacity:0; transition:opacity .4s; }
  .halo.hot { opacity:.22; }
  .scr { fill:var(--accent-hi); font-family:var(--mono); }
  .scr-accent { fill:var(--accent); }
  .led { fill:var(--detail); transition:fill .2s; }
  .led.hot { fill:var(--accent); }
  .wire { fill:none; stroke:var(--line); stroke-width:1; vector-effect:non-scaling-stroke; stroke-linecap:round; stroke-linejoin:round; transition:stroke .4s; }
  .wire.hot { stroke:var(--accent); }
  .wire-under { fill:none; stroke:var(--panel); stroke-width:3.5; stroke-linecap:round; stroke-linejoin:round; }
  .pulse { fill:none; stroke:var(--accent-hi); stroke-width:2.2; stroke-linecap:round; vector-effect:non-scaling-stroke;
           stroke-dasharray:70 1200; stroke-dashoffset:70; opacity:0; }
  .pulse.go { animation:flow .55s linear; }
  @keyframes flow { 0% { stroke-dashoffset:70; opacity:1; } 90% { opacity:1; } 100% { stroke-dashoffset:-1000; opacity:0; } }
  .press { cursor:pointer; transition:transform 60ms ease-out; }
  .press.down { transform:translateY(3px); }
  .press .face { transition:fill .6s ease-out, stroke .6s ease-out; }
  .press.lit .face, .press.latched .face { fill:var(--accent); stroke:var(--accent-hi); transition:none; }
  .press.lit .face.top, .press.latched .face.top { fill:var(--accent-hi); }
  .press.lit { filter:url(#glow); }
  .press.latched { filter:url(#soft); }
  .press:hover .face.top { stroke:var(--ink); }
  .blink { animation:blink 1s steps(1) infinite; }
  @keyframes blink { 50% { opacity:0; } }
  @media (prefers-reduced-motion:reduce) {
    .press, .glass, .halo, .press .face, .wire { transition:none; } .blink { animation:none; } .pulse.go { animation:none; }
  }
</style>
<style>
  :root { --dh-w: 1280px; }
  body { padding-top: 74px !important; }
  .dh { position:fixed; z-index:20; top:0; left:0; right:0; padding:12px 16px 10px; font:12px/1.45 "DM Mono", monospace; background:linear-gradient(var(--bg) 60%, rgba(12,13,14,0)); }
  .dh-in { max-width:var(--dh-w, 1280px); margin:0 auto; display:flex; align-items:center; justify-content:space-between; gap:10px 18px; }
  .dh-brand { flex:none; display:flex; align-items:center; gap:8px; color:var(--ink-hi); text-decoration:none; font-weight:500; font-size:12px; letter-spacing:.14em; text-transform:uppercase; }
  .dh-brand .dot { display:inline-block; width:7px; height:7px; border-radius:50%; background:var(--accent); box-shadow:0 0 8px var(--accent); }
  .dh-seg { display:flex; min-width:0; overflow-x:auto; scrollbar-width:none; padding:3px; gap:4px; border:1px solid var(--edge); border-radius:999px; background:var(--panel); }
  .dh-seg a { flex:none; display:flex; align-items:center; gap:6px; white-space:nowrap; padding:5px 13px; border-radius:999px; color:var(--ink); text-decoration:none; font-size:11px; letter-spacing:.06em; transition:all .2s; }
  .dh-seg a:hover { color:var(--ink-hi); }
  .dh-seg a.active { color:var(--ink-hi); background:var(--bg); box-shadow:0 0 0 1px var(--accent) inset; }
  .dh-seg .n { opacity:.6; font-size:10px; }
</style>
</head>
<body>

<header class="dh">
  <div class="dh-in">
    <a class="dh-brand" href="index.html"><span class="dot"></span><span>AUDIRA GLOW</span></a>
    <nav class="dh-seg" aria-label="Collections"><a href="audira-studio.html" class="">AUDIRA STUDIO <span class="n">5</span></a><a href="datacenter.html" class="">DATA CENTER <span class="n">12</span></a><a href="cyberlab.html" class="">CYBER LAB <span class="n">5</span></a><a href="objects.html" class="">OBJECTS <span class="n">10</span></a><a href="cities.html" class=" active">CITIES <span class="n">10</span></a><a href="lumen.html" class="">LUMEN <span class="n">12</span></a><a href="computer-demo.html" class="">DESK COMPUTER <span class="n">1</span></a><a href="assets/gallery-3d.html" class="">3D DEMO <span class="n">12</span></a></nav>
  </div>
</header>

<svg class="fx" aria-hidden="true">
  <defs>
    <filter id="glow" filterUnits="userSpaceOnUse" x="-2000" y="-2000" width="6000" height="6000"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="soft" filterUnits="userSpaceOnUse" x="-2000" y="-2000" width="6000" height="6000"><feGaussianBlur stdDeviation="2.2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="bloom" filterUnits="userSpaceOnUse" x="-2000" y="-2000" width="6000" height="6000"><feGaussianBlur stdDeviation="9"/></filter>
  </defs>
</svg>
<div class="wrap">
  <div class="top">
    <span class="hi"><span class="dot"></span>Cities</span>
    <div class="swatches" id="swatches" role="radiogroup" aria-label="Glow colour"></div>
    <div class="arrows"><button id="prev" aria-label="Previous figure">← Prev</button><button id="next" aria-label="Next figure">Next →</button></div>
  </div>
  <div class="layout">
    <nav id="nav" aria-label="Figures"></nav>
    <!-- optional: <aside class="credit">Made by … <a href="…">…</a></aside> (styles below) -->
    <figure>
      <div class="cap"><span class="hi" id="fignum">Fig 1</span><span id="figname"></span></div>
      <div id="stageHolder"></div>
      <div class="cap"><span id="hint"></span><span class="hi" id="readout"></span></div>
    </figure>
  </div>
  <!-- Made-with credit: keep by default; delete this footer if you don't want it. -->
  <footer class="made-with"><a href="https://iso-glow.vercel.app" target="_blank" rel="noopener">Made with ISO-GLOW ↗</a></footer>
</div>
<script>
  // Gallery settings: palette 'ember' | 'city' | your own [[name, darkAccent, darkHi, lightAccent, lightHi], ...]
  window.GALLERY = { palette: 'city', autoDemo: true, storageKey: 'iso-glow-accent' };
  const FIGS = [];
</script>
<!-- FIGURES: one script per figure, each calling FIGS.push({...}). Order here = Fig 1, 2, 3 ... -->
<script>
/* Fig 1 — Office tower: 24 floors you can switch on, a night-shift cascade, a blinking spire. */
FIGS.push({
  id: 'tower',
  name: 'Office tower',
  hint: 'Click a floor · ↑↓ + space · n night shift · o all off',
  aria: 'Isometric modernist office tower with 24 floors on a city block. Click a floor’s facade to toggle its lights. Arrow up and down move the floor cursor, space or enter toggles that floor, n lights the whole tower floor by floor, o switches it off from the top down.',
  css: `
    [data-fig="tower"] .fl { cursor:pointer; }
    [data-fig="tower"] .fl .band { transition:fill .3s; }
    [data-fig="tower"] .fl:hover .band { stroke:var(--ink); }
    [data-fig="tower"] .pn { fill:var(--recess); stroke:var(--detail); stroke-width:.6; vector-effect:non-scaling-stroke; transition:fill .25s, opacity .25s; }
    [data-fig="tower"] .fl.on .pn { fill:var(--accent); stroke:var(--accent-hi); }
    [data-fig="tower"] .fl.on .pn.hi { fill:var(--accent-hi); }
    [data-fig="tower"] .fl.on .pn.dim { opacity:.45; }
    [data-fig="tower"] .fl.on .pn.off { fill:var(--recess); stroke:var(--detail); }
    [data-fig="tower"] .fl.on .win { filter:url(#soft); }
    [data-fig="tower"] .fl.on .halo { opacity:.38; }
    [data-fig="tower"] .cur { fill:none; stroke:var(--accent-hi); stroke-width:1.6; vector-effect:non-scaling-stroke; opacity:0; pointer-events:none; }
    [data-fig="tower"] .fl.cursor .cur { opacity:1; filter:url(#soft); }
    [data-fig="tower"] .beacon { fill:var(--accent-hi); animation:tower-blink 1.4s steps(1) infinite; }
    [data-fig="tower"] .beacon-halo { fill:var(--accent); opacity:.5; animation:tower-blink 1.4s steps(1) infinite; }
    [data-fig="tower"] .mast { fill:none; stroke:var(--line); stroke-width:1.2; vector-effect:non-scaling-stroke; }
    [data-fig="tower"] .lobby-glass { fill:var(--glass); stroke:var(--line); stroke-width:1; vector-effect:non-scaling-stroke; transition:fill .4s, stroke .4s; }
    [data-fig="tower"].lit .lobby-glass { fill:var(--accent); stroke:var(--accent-hi); opacity:.85; }
    [data-fig="tower"].lit .lobby-door { fill:var(--accent-hi); }
    [data-fig="tower"].lit .lobby-fx { filter:url(#soft); }
    [data-fig="tower"] .lobby-door { fill:var(--recess); stroke:var(--line); stroke-width:1; vector-effect:non-scaling-stroke; transition:fill .4s; }
    @keyframes tower-blink { 0% { opacity:1; } 45% { opacity:.08; } }
    @media (prefers-reduced-motion:reduce) { [data-fig="tower"] .beacon, [data-fig="tower"] .beacon-halo { animation:none; } [data-fig="tower"] .pn { transition:none; } }
  `,
  mount(stage, api) {
    /*  boxes             x    y    z    w    d    h
        plate             0    0    0  210  180    7
        lobby (recessed) 54   38    7  102   72   18   -> front y=110
        shaft            50   34   25  110   80  180   -> floors 1–20, 9 high, front y=114, side x=160
        setback crown    58   42  205   94   64   36   -> floors 21–24, front y=106, side x=152
        mech floor       64   48  241   82   52   14   -> louvers, roof z=255
        spire           100   68  255    8    8   10 + mast to z=335                            */
    const K = api.iso.frame([[0,180,0],[210,0,7],[210,180,0],[0,0,7],[104,72,340],[50,114,205],[160,34,205]], 0.06);
    const { P, TOP, FRONT, SIDE, box } = K, slits = api.iso.slits;
    const PZ = 7, FH = 9, NF = 24;
    const SH = { x: 50, y: 34, w: 110, d: 80, z: 25 };
    const SB = { x: 58, y: 42, w: 94, d: 64, z: 205 };
    const MC = { x: 64, y: 48, w: 82, d: 52, z: 241, h: 14 };
    const RZ = MC.z + MC.h;

    // deterministic "lived-in" pane variants
    let seed = 7;
    const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
    const variant = () => { const r = rnd(); return r < .1 ? ' off' : r < .27 ? ' dim' : r < .4 ? ' hi' : ''; };

    function panes(w, n) {
      const pitch = w / n, pw = pitch - 1.6;
      let s = '';
      for (let i = 0; i < n; i++) s += `<rect class="pn${variant()}" x="${(i * pitch + .8).toFixed(2)}" y="1.6" width="${pw.toFixed(2)}" height="${FH - 3.4}"/>`;
      return s;
    }
    function floor(i) {          // i: 1..24
      const B = i <= 20 ? SH : SB;
      const zTop = i <= 20 ? SH.z + i * FH : SB.z + (i - 20) * FH;
      const fy = B.y + B.d, sx = B.x + B.w;
      const nF = i <= 20 ? 14 : 12, nS = i <= 20 ? 10 : 8;
      const face = (t, w, n) => `<g transform="${t}">
        <rect class="face band" width="${w}" height="${FH}"/>
        <rect class="halo" x="-2" y="-1" width="${w + 4}" height="${FH + 2}" filter="url(#bloom)"/>
        <g class="win">${panes(w, n)}</g>
        <rect class="cur" x="-.6" y="-.6" width="${w + 1.2}" height="${FH + 1.2}"/>
      </g>`;
      return `<g class="fl" data-f="${i}">${face(SIDE(sx, fy, zTop), B.d, nS)}${face(FRONT(B.x, fy, zTop), B.w, nF)}</g>`;
    }

    let svg = '';
    // ---- plate: city block with sidewalk ----
    svg += box(0, 0, 0, 210, 180, PZ, 12);
    svg += `<g transform="${TOP(0, 0, PZ)}">
      <rect class="detail" x="7" y="7" width="196" height="166" rx="8"/>
      <rect class="detail" x="14" y="14" width="182" height="152" rx="4"/>
      ${slits(24, 186, 12, 128, 166)}
      ${slits(26, 118, 12, 168, 196, false)}
      ${[[20, 20], [190, 20], [20, 160], [190, 160]].map(([x, y]) => `<circle class="face recess" cx="${x}" cy="${y}" r="2.6"/><line class="detail" x1="${x - 1.6}" y1="${y}" x2="${x + 1.6}" y2="${y}"/>`).join('')}
    </g>`;
    svg += `<g transform="${FRONT(0, 180, PZ)}"><text class="label" x="16" y="5.2" font-size="4" letter-spacing=".6">240 MERIDIAN · BLOCK 24</text></g>`;
    svg += `<g transform="${SIDE(210, 180, PZ)}">${slits(120, 168, 3, 2, 5)}</g>`;

    // ---- recessed glass lobby ----
    svg += box(54, 38, PZ, 102, 72, 18, 0);
    const lobbyFace = (t, w) => {
      let s = `<g transform="${t}"><g class="lobby-fx"><rect class="lobby-glass" x="2" y="2" width="${w - 4}" height="16"/>`;
      s += `</g>${slits(2 + (w - 4) / 8, w - 2 - (w - 4) / 8 + .01, (w - 4) / 8, 2, 18)}<line class="detail" x1="2" y1="7" x2="${w - 2}" y2="7"/>`;
      return s;
    };
    svg += `<g class="halo lobby-halo" filter="url(#bloom)"><g transform="${FRONT(54, 110, 25)}"><rect width="102" height="18"/></g></g>`;
    svg += lobbyFace(SIDE(156, 110, 25), 72) + `</g>`;
    svg += lobbyFace(FRONT(54, 110, 25), 102) + `<rect class="lobby-door" x="41" y="8" width="20" height="10"/><line class="detail" x1="51" y1="8" x2="51" y2="18"/></g>`;
    // pilotis along the front edge
    [50, 77, 104, 131, 158].forEach(x => { svg += box(x, 112, PZ, 2, 2, 18, 0); });
    [126, 99, 72, 45].forEach(y => { svg += box(158, y, PZ, 2, 2, 18, 0); });

    // ---- shaft + crown ----
    svg += box(SH.x, SH.y, SH.z, SH.w, SH.d, 20 * FH, 2);
    svg += `<g transform="${TOP(SH.x, SH.y, SH.z + 20 * FH)}"><rect class="detail" x="3" y="3" width="${SH.w - 6}" height="${SH.d - 6}" rx="1"/></g>`;
    for (let i = 1; i <= 20; i++) svg += floor(i);
    svg += box(SB.x, SB.y, SB.z, SB.w, SB.d, 4 * FH, 1);
    for (let i = 21; i <= 24; i++) svg += floor(i);
    svg += `<g transform="${TOP(SB.x, SB.y, SB.z + 4 * FH)}"><rect class="detail" x="2.5" y="2.5" width="${SB.w - 5}" height="${SB.d - 5}"/></g>`;

    svg += `<g transform="${SIDE(246,188,43)}"><rect class="face win" filter="url(#soft)" x="10" y="7" width="12" height="10" rx="1"/><line class="mull" x1="16" y1="7" x2="16" y2="17"/></g>`;

    const q = s => stage.querySelector(s);

    const halo = q('#lighthouse-halo'), winHalo = q('#lighthouse-winhalo'), horn = q('#lighthouse-horn');
    const rings = [0,1,2].map(i => q('#lighthouse-ring' + i));
    const st = { on: false, rpm: 6, th: 1.0, horn: -1 };

      stage.classList.toggle('on', st.on);
      api.power(st.on);

    function drawBeam() {
      if (!st.on) { beamB.style.opacity = 0; beamF.style.opacity = 0; halo.style.opacity = ''; return; }

      const flash = Math.pow(Math.max(0, Math.cos(st.th - Math.PI / 4)), 6);

      (front ? beamF : beamB).setAttribute('points', ps);

      (front ? beamB : beamF).style.opacity = 0;
      halo.style.opacity = (0.3 + 0.5 * flash).toFixed(3);
    }

      if (st.horn < 0) return;
      const t = (ts - st.horn) / 1000;

        if (k < 0 || k > 1) { r.style.opacity = 0; return; }

      if (t > 4) st.horn = -1;

      const dt = last == null ? 0 : Math.min(0.1, (ts - last) / 1000); last = ts;
      if (st.on) { st.th = (st.th + dt * st.rpm * 2 * Math.PI / 60) % (2 * Math.PI); render(); }
      drawBeam(); drawRings(ts);
    });

    function toggle() { st.on = !st.on; render(); drawBeam(); }
    function speed(d) { st.rpm = Math.max(2, Math.min(12, st.rpm + d)); render(); }
    let voice = null;

      api.flash(horn, 1200);

      try {
        const { ctx, out } = api.audio(), t0 = ctx.currentTime;
        const g = ctx.createGain(), lp = ctx.createBiquadFilter();

          o.connect(lp); o.start(t0); o.stop(t0 + 1.3); return o; });
        lp.connect(g); g.connect(out); voice = { oscs, g };
      } catch (e) {}
    }

        if (e.key === 'ArrowRight') { speed(1); return true; }
        if (e.key === 'ArrowLeft') { speed(-1); return true; }
        if (e.key === 'h' || e.key === 'H') { if (!e.repeat) foghorn(); return true; }
        return false;
      },
      unmount() { if (voice) try { voice.oscs.forEach(o => o.stop()); voice.g.disconnect(); } catch (e) {} },
      demo() { api.after(0, toggle); api.after(150, () => speed(1)); api.after(300, () => speed(1)); },
    };
  },
});

    stage.setAttribute('viewBox', K.viewBox);

    const q = s => stage.querySelector(s);
    // correct paint order: back legs, stack, loadA (over quay), front legs

    /* ---------- ship ---------- */
    function hullSVG(name, placed) {
      let s = box(70, 112, PZ, 280, 60, DZ - PZ, 8);

      s += `<g transform="${TOP(70, 112, DZ)}">
        <rect class="detail" x="4" y="4" width="272" height="52" rx="6"/>
        ${BAYY.map(by => BAYX.map(bx => `<rect class="detail" x="${bx - 20 - 70 - 1}" y="${by - 112 - 1}" width="42" height="18" rx="1"/>`).join('')).join('')}
      </g>`;
      s += box(74, 116, DZ, 22, 52, 7, 3);
      s += `<g transform="${TOP(74, 116, DZ + 7)}"><circle class="detail" cx="10" cy="14" r="3"/><circle class="detail" cx="10" cy="38" r="3"/></g>`;
      // placed containers, back row first then increasing x
      placed.forEach((c, i) => { if (!c) return; s += cont(BAYX[i % 4] - 20, BAYY[Math.floor(i / 4)], DZ, c); });
      // mooring ropes from bollards to the deck edge
      s += BOLL.map((x, i) => `<path class="rope" d="${path([[x + 2.5, 91.5, QZ + 6.5], [x + (i < 2 ? 14 : -14), 112, DZ]])}"/>`).join('');

    const lit = (i, r, k) => ((i * 7 + r * 5 + k * 3) % 9) < 4;
    function bridgeSVG() {

      const wins = (w, rows, cols, k) => { let o = ''; for (let r = 0; r < rows; r++) for (let i = 0; i < cols; i++) {

      s += box(292, 122, DZ + 40, 40, 40, 14, 2);
      s += `<g transform="${FRONT(292, 162, DZ + 54)}"><g filter="url(#soft)">${wins(40, 1, 5, 3)}</g></g>`;
      s += `<g transform="${SIDE(332, 162, DZ + 54)}"><g filter="url(#soft)">${wins(40, 1, 5, 4)}</g></g>`;
      // wheelhouse with bridge wings: a fully lit window band
      s += box(284, 120, DZ + 54, 56, 46, 14, 2);
      s += `<g transform="${FRONT(284, 166, DZ + 68)}">
        <rect class="halo hot" x="2" y="2" width="52" height="8" filter="url(#bloom)"/>
        <g filter="url(#soft)"><rect class="band" x="4" y="3.5" width="48" height="6" rx="1"/>${slits(10, 46, 6, 3.5, 9.5, true, 'detail')}</g></g>`;
      s += `<g transform="${SIDE(340, 166, DZ + 68)}">
        <rect class="halo hot" x="2" y="2" width="42" height="8" filter="url(#bloom)"/>
        <g filter="url(#soft)"><rect class="band" x="4" y="3.5" width="38" height="6" rx="1"/>${slits(10, 38, 6, 3.5, 9.5, true, 'detail')}</g></g>`;
      s += box(306, 138, DZ + 68, 3, 3, 24, 0);
      s += box(300, 136, DZ + 92, 15, 2, 2, 0);
      s += `<circle class="band-hi" filter="url(#glow)" cx="${f(P(307.5, 139.5, DZ + 96)[0])}" cy="${f(P(307.5, 139.5, DZ + 96)[1])}" r="1.8"/>`;
      s += box(318, 128, DZ + 68, 14, 16, 16, 3);
      s += `<g transform="${FRONT(318, 144, DZ + 84)}"><rect class="face recess" x="0" y="0" width="14" height="4"/></g>`;
      s += `<g transform="${TOP(318, 128, DZ + 84)}"><rect class="face recess" x="3" y="3" width="8" height="10" rx="2"/></g>`;

    }

    /* ---------- crane ---------- */
    const leg = (x, y) => box(x - 2, y - 2, QZ, 10, 10, 6, 1.5) + box(x, y, QZ + 6, 6, 6, 110, 0) +
      `<g transform="${FRONT(x, y + 6, 142)}">${slits(10, 100, 9, 0.8, 5.2, false)}</g>`;
    const backSVG = cx => `<g class="crane">${leg(cx - 30, 2)}${leg(cx + 24, 2)}</g>`;
    const frontSVG = cx => `<g class="crane">${leg(cx - 30, 80)}${leg(cx + 24, 80)}</g>`;
    function girder(x) {
      return box(x, -6, 150, 6, 202, 8, 0) + `<g transform="${SIDE(x + 6, 196, 158)}">

    }
    function topSVG(cx, ty, busy) {
      let s = box(cx - 30, 2, 142, 60, 6, 8, 0) + box(cx - 30, 80, 142, 60, 6, 8, 0);
      s += girder(cx - 30) + girder(cx + 24);
      s += box(cx - 30, -8, 158, 60, 22, 16, 2);
      s += `<g transform="${FRONT(cx - 30, 14, 174)}">${slits(36, 56, 3, 3, 13)}<text class="label" x="4" y="10" font-size="5.5" letter-spacing="1">QC 3</text></g>`;

      s += box(cx - 26, ty - 9, 158, 52, 18, 7, 1.5);
      s += `<g transform="${FRONT(cx - 26, ty + 9, 165)}">${slits(4, 48, 4, 1.5, 5.5)}</g>`;
      return `<g class="crane">${s}</g>`;
    }
    function loadSVG(cx, ty, s, held, c) {
      let o = '';
      if (held && c) o += `<g class="held">${cont(cx - 20, ty - 8, s - 16, c)}</g>`;
      o += `<g class="crane">`;
      for (const [dx, dy] of [[-14, -6], [14, -6], [-14, 6], [14, 6]])
        o += `<path class="cable${held ? ' hot' : ''}" d="${path([[cx + dx, ty + dy, 158], [cx + dx, ty + dy, s + 3]])}"/>`;
      o += `<g class="spreader${held ? ' held' : ''}">${box(cx - 21, ty - 8, s, 42, 16, 3, 1)}</g></g>`;
      return o;
    }

    /* ---------- state ---------- */
    const st = { stack: freshStack(), placed: [], ship: 0, cx: HOME, ty: ROWY[1] + 8, s: SH,
      queue: 0, job: null, held: null, sail: null };

    const order = () => st.stack.slice().sort((a, b) => b.t - a.t || b.r - a.r);
    function renderStack() {
      gStack.innerHTML = st.stack.slice().sort((a, b) => a.t - b.t || a.r - b.r)
        .map(k => cont(HOME - 20, ROWY[k.r], TIERZ[k.t], k.c)).join('');
    }
    function renderShip() { gHull.innerHTML = hullSVG(NAMES[st.ship % NAMES.length], st.placed); }
    function renderCrane() {
      const busy = !!st.job;
      gBack.innerHTML = backSVG(st.cx);
      gFront.innerHTML = frontSVG(st.cx);
      gTop.innerHTML = topSVG(st.cx, st.ty, busy);
      const l = loadSVG(st.cx, st.ty, st.s, !!st.held, st.held);
      if (st.ty < 94) { gLoadA.innerHTML = l; gLoadB.innerHTML = ''; } else { gLoadB.innerHTML = l; gLoadA.innerHTML = ''; }
    }
    function status() {
      const n = st.placed.length;
      let t;
      if (st.sail) t = st.sail.phase === 'out' ? 'ship sailing · next ship inbound' : 'ship berthing · stack restocked';
      else if (n >= CAP && !st.job) t = 'ship full · press s to sail';
      else {
        t = `loading ${n}/${CAP} · crane ${st.job ? 'busy' : 'idle'}`;
        if (st.queue > 1) t += ` · ${st.queue - 1} queued`;
      }
      api.readout(t);
      api.power(!!st.job || !!st.sail);
    }

    const sm = t => t <= 0 ? 0 : t >= 1 ? 1 : t * t * (3 - 2 * t);
    const seg = (p, a, b) => sm((p - a) / (b - a));
    const lerp = (a, b, t) => a + (b - a) * t;

    function startJob(warp = 0) {
      const slot = order()[0];
      const bay = st.placed.length;
      st.job = { t0: null, slot, bay, cx0: st.cx, ty0: st.ty, s0: st.s, grabbed: false, released: false, warp,
        bx: BAYX[bay % 4], by: BAYY[Math.floor(bay / 4)] + 8, py: ROWY[slot.r] + 8, ps: TIERZ[slot.t] + 16 };
      status();
    }
    function step(ts) {
      const j = st.job; if (!j) return;
      if (j.t0 == null) j.t0 = ts - (j.warp || 0);
      const p = Math.min(1, (ts - j.t0) / DUR);
      if (p < .54) { const e = seg(p, 0, .22); st.cx = lerp(j.cx0, HOME, e); st.ty = lerp(j.ty0, j.py, e); }
      else { const e = seg(p, .54, .78); st.cx = lerp(HOME, j.bx, e); st.ty = lerp(j.py, j.by, e); }
      if (p < .22) st.s = lerp(j.s0, SH, seg(p, 0, .22));
      else if (p < .36) st.s = lerp(SH, j.ps, seg(p, .22, .36));
      else if (p < .42) st.s = j.ps;
      else if (p < .54) st.s = lerp(j.ps, SH, seg(p, .42, .54));
      else if (p < .78) st.s = SH;
      else if (p < .9) st.s = lerp(SH, DZ + 16, seg(p, .78, .9));
      else st.s = lerp(DZ + 16, SH, seg(p, .9, 1));
      if (p >= .36 && !j.grabbed) {
        j.grabbed = true; st.held = j.slot.c;
        st.stack = st.stack.filter(k => k !== j.slot); renderStack();
      }
      if (p >= .9 && !j.released) {
        j.released = true; st.held = null;
        st.placed[j.bay] = j.slot.c; renderShip();

      if (p >= 1) {
        st.job = null; st.queue--;
        if (st.queue > 0) startJob();
      }
      renderCrane(); status();
    }
    function sailStep(ts) {
      const s = st.sail; if (!s) return;
      if (s.t0 == null) s.t0 = ts;
      const p = Math.min(1, (ts - s.t0) / (s.phase === 'out' ? 1800 : 1400));
      let dx, op;
      if (s.phase === 'out') { const e = p * p; dx = -460 * e; op = 1 - sm((p - .35) / .65); }
      else { const e = 1 - (1 - p) * (1 - p); dx = 260 * (1 - e); op = sm(p / .6); }
      const d = D(dx, 0, 0), tr = `translate(${f(d[0])} ${f(d[1])})`;
      [gShip, gBridgeW].forEach(g => { g.setAttribute('transform', tr); g.style.opacity = op; });
      if (p >= 1) {
        if (s.phase === 'out') {
          st.ship++; st.placed = []; st.stack = freshStack(); renderShip(); renderStack();
          st.sail = { phase: 'in', t0: ts };
        } else {
          st.sail = null; gShip.classList.remove('sailing');
          [gShip, gBridgeW].forEach(g => { g.removeAttribute('transform'); g.style.opacity = ''; });
        }
        status();
      }
    }
    const tick = () => { const ts = performance.now(); step(ts); sailStep(ts); };
    api.loop(tick); api.every(40, () => { if (st.job || st.sail) tick(); });

    function load(warp = 0) {
      if (st.sail) return false;
      const unfinished = st.queue - (st.job && st.job.released ? 1 : 0);
      const room = Math.min(CAP - st.placed.length, st.stack.length + (st.held ? 1 : 0)) - unfinished;
      if (room <= 0) { status(); return false; }
      st.queue++;
      if (!st.job) startJob(warp); else status();
      return true;
    }
    function sail() {
      if (st.sail || st.job || st.placed.length < CAP) return false;
      st.sail = { phase: 'out', t0: null }; gShip.classList.add('sailing');
      status(); return true;
    }

    stage.addEventListener('click', e => {
      if (e.target.closest('.ship')) { if (st.placed.length >= CAP) sail(); else load(); return; }
      if (e.target.closest('.crane')) load();
    });

    gBridge.innerHTML = bridgeSVG();
    renderStack(); renderShip(); renderCrane(); status();

    return {
      key(e) {
        if (e.key === ' ' || e.key === 'Enter') { if (!e.repeat) load(); return true; }
        if (e.key === 's' || e.key === 'S') { sail(); return true; }
        return false;
      },
      demo() { load(200); api.after(120, () => load()); },
    };
  },
});

          : `<rect class="tl" x="1" y="1.4" width="2.6" height="1.4"/><rect class="tl" x="8.4" y="1.4" width="2.6" height="1.4"/>`) + `</g>`;
      }
      return s;
    }
    function beamMarkup(ax, dir) {
      const hx = ax === 'x' ? dir : 0, hy = ax === 'y' ? dir : 0;
      const pt = (a, b) => `${f2(a * hx - b * hy)} ${f2(a * hy + b * hx)}`;
      return `<g transform="${TOP(0, 0, PZ)}"><path class="beam" d="M${pt(11, -4)}L${pt(64, -17)}L${pt(64, 17)}L${pt(11, 4)}Z"/><path class="beam2" d="M${pt(11, -3)}L${pt(36, -8)}L${pt(36, 8)}L${pt(11, 3)}Z"/></g>`;
    }
    const MK = LANES.map(l => ({ car: carMarkup(l.ax, l.dir), beam: beamMarkup(l.ax, l.dir) }));

    const STOP = 146, EXIT = 230, END = 400, VMAX = 56, ACC = 38, DEC = 95, GAP = 6;
    const cars = [];
    function addCar(li, t, v = VMAX) {
      const g = document.createElementNS(NS, 'g'); g.setAttribute('class', 'car'); g.innerHTML = MK[li].car;
      const b = document.createElementNS(NS, 'g'); b.innerHTML = MK[li].beam;
      scene.appendChild(g); beams.appendChild(b);
      const c = { li, t, v, el: g, beam: b, counted: t - L / 2 > EXIT };
      cars.push(c); place(c); return c;
    }
    function xy(c) { const l = LANES[c.li], p = l.dir > 0 ? c.t : END - c.t; return l.ax === 'x' ? [p, l.c] : [l.c, p]; }
    function place(c) {
      const [x, y] = xy(c), [sx, sy] = D(x, y, 0);
      const tr = `translate(${f2(sx)} ${f2(sy)})`;
      c.el.setAttribute('transform', tr); c.beam.setAttribute('transform', tr);
      const o = Math.max(0, Math.min(1, (c.t - 4) / 18, (END + 2 - c.t) / 18));
      c.el.style.opacity = o; c.beam.style.opacity = o;
    }

    /* ---------- signals ---------- */
    const PH = [['y', 'g'], ['y', 'a'], ['x', 'g'], ['x', 'a']];
    const DUR = [4, 1.1, 4, 1.1];
    const st = { ph: 2, tph: 0, auto: true, through: 0 };
    const light = ax => { const [a, s] = PH[st.ph]; return a === ax ? s : 'r'; };
    const WORD = { g: 'green', a: 'amber', r: 'red' };
    const lampEls = [...stage.querySelectorAll('.lamp')];
    function render() {
      lampEls.forEach(l => l.classList.toggle('on', light(l.dataset.ax) === l.dataset.k));
      api.power(true);
      api.readout(`NS ${WORD[light('y')]} · EW ${WORD[light('x')]} · ${st.through} car${st.through === 1 ? '' : 's'} through` + (st.auto ? '' : ' · hold'));
    }
    function advance() { st.ph = (st.ph + 1) % 4; st.tph = 0; render(); }
    function switchPhase(el) {
      if (el) api.flash(el, 260); else stage.querySelectorAll('.sig .head').forEach(h => api.flash(h, 260));
      if (PH[st.ph][1] === 'g') { st.ph++; st.tph = 0; render(); } else advance();
      return true;
    }

    /* ---------- simulation ---------- */
    let lastTs = 0, spawnIn = LANES.map((_, i) => 0.6 + i * 0.5), order = [];
    function step(dt) {
      st.tph += dt;
      if (PH[st.ph][1] === 'a' ? st.tph > DUR[st.ph] : (st.auto && st.tph > DUR[st.ph])) advance();
      LANES.forEach((l, li) => {
        const lane = cars.filter(c => c.li === li).sort((a, b) => b.t - a.t);
        const lt = light(l.ax);
        lane.forEach((c, k) => {
          let limit = Infinity;
          if (k > 0) limit = lane[k - 1].t - L - GAP;
          const front = c.t + L / 2;
          if (lt !== 'g' && front <= STOP + 0.5) {
            const dist = STOP - front;
            if (lt === 'r' || dist > (c.v * c.v) / (2 * DEC) * 0.8) limit = Math.min(limit, STOP - L / 2);
          }
          const vt = Math.min(VMAX, Math.sqrt(2 * DEC * Math.max(0, limit - c.t - 0.3)));
          c.v = Math.max(0, Math.min(c.v + ACC * dt, vt));
          c.t += c.v * dt;
          if (!c.counted && c.t - L / 2 > EXIT) { c.counted = true; st.through++; render(); }
        });
        spawnIn[li] -= dt;
        const last = lane[lane.length - 1];
        if (spawnIn[li] <= 0 && lane.length < 6 && (!last || last.t > L + 14)) {
          addCar(li, L / 2, last ? Math.min(VMAX, last.v + 10) : VMAX);
          spawnIn[li] = 1.4 + hash(st.through * 3 + li + cars.length) * 2.6;
        }
      });
      for (let i = cars.length - 1; i >= 0; i--) {
        const c = cars[i];
        if (c.t - L / 2 > END) { c.el.remove(); c.beam.remove(); cars.splice(i, 1); } else place(c);
      }
      sortScene();
    }
    // topological painter's sort: A behind B if their screen spans overlap and A ends before B along x or y
    function sortScene() {
      const items = statics.concat(cars.map(c => { const [x, y] = xy(c), l = LANES[c.li];
        const hw = l.ax === 'x' ? L / 2 : W / 2, hd = l.ax === 'x' ? W / 2 : L / 2;
        return { el: c.el, x0: x - hw, x1: x + hw, y0: y - hd, y1: y + hd }; }));
      items.sort((a, b) => (a.x0 + a.x1 + a.y0 + a.y1) - (b.x0 + b.x1 + b.y0 + b.y1));
      const behind = (a, b) => (a.x0 - a.y1) < (b.x1 - b.y0) && (b.x0 - b.y1) < (a.x1 - a.y0) &&
        (a.x1 <= b.x0 + 0.01 || a.y1 <= b.y0 + 0.01);
      const out = [], mark = new Map();
      const visit = n => { if (mark.get(n)) return; mark.set(n, 1);
        items.forEach(m => { if (m !== n && behind(m, n)) visit(m); }); out.push(n.el); };
      items.forEach(visit);
      if (out.length !== order.length || out.some((e, i) => e !== order[i])) { out.forEach(e => scene.appendChild(e)); order = out; }
    }

    // seed: EW flowing, NS queued at the red
    [[0, 40], [0, 120], [0, 222], [1, 70], [1, 226], [1, 350]].forEach(([li, t]) => addCar(li, t));
    [[2, STOP - L / 2], [2, STOP - L / 2 - L - GAP], [2, STOP - L / 2 - 2 * (L + GAP)], [3, STOP - L / 2], [3, STOP - L / 2 - L - GAP]].forEach(([li, t]) => addCar(li, t, 0));
    sortScene();

    api.loop(ts => { const dt = lastTs ? Math.min(0.05, (ts - lastTs) / 1000) : 0; lastTs = ts; if (dt > 0) step(dt); });

    stage.addEventListener('click', e => { const s = e.target.closest('.sig'); if (s) switchPhase(s.querySelector('.head')); });
    render();
    return {
      key(e) {
        if (e.key === ' ') { if (!e.repeat) switchPhase(); return true; }
        if (e.key === 'a' || e.key === 'A') { st.auto = !st.auto; st.tph = 0; render(); return true; }
        return false;
      },
      demo() { api.after(120, () => switchPhase(q("#intersection-sig3 .head"))); api.after(650, () => switchPhase(q("#intersection-sig0 .head"))); },
    };
  },
});

      stars += g + `</g>`; CL.push({ x: cx, name: `CL-${String(k * 3 + 4).padStart(2, '0')}` });
    }
    q('#observatory-stars').innerHTML = stars;
    q('#observatory-u1').setAttribute('x', -SKY); q('#observatory-u2').setAttribute('x', SKY);

    const st = { open: false, amt: 0, th: 69, frames: 0, drift: 0, last: null, cl: -1 };
    const az = () => Math.round(((177 - st.th) % 360 + 360) % 360);
    const W = 8;
    function drawDome() {
      const A = rad(st.th);
      // rotating ribs
      let ribs = '';
      for (let k = 0; k < 8; k++) { const th = A + rad(22.5 + k * 45), pts = [], ok = [];
        for (let p = 0; p <= 84; p += 4) { pts.push(sph(th, rad(p))); ok.push(vis(th, rad(p))); }
        runs(pts, ok).forEach(r => { ribs += `<path class="detail" d="${pd(r)}"/>`; }); }
      q('#observatory-ribs').innerHTML = ribs;
      // slit band: visible run along meridian A from equator to past the zenith
      const phs = []; for (let p = 0; p <= 105; p += 3) if (vis(A, rad(p))) phs.push(rad(p));
      const band = w => phs.length < 2 ? '' : pd([...phs.map(p => sph(A, p, -w)), ...phs.slice().reverse().map(p => sph(A, p, w))]) + 'Z';
      q('#observatory-shut').setAttribute('d', band(W));
      q('#observatory-ticks').setAttribute('d', phs.length < 2 ? '' : phs.filter((_, i) => i % 3 === 1).map(p => pd([sph(A, p, -W), sph(A, p, W)])).join('') + pd(phs.map(p => sph(A, p, 0))));
      const ow = st.amt > .02 ? band(W * st.amt) : '';
      ['#observatory-open', '#observatory-halo', '#observatory-clipd'].forEach(s => q(s).setAttribute('d', ow));
      const piv = [CX, CY, ZE - 22], end = sph(A, rad(58)).map((v, i) => piv[i] + (v - piv[i]) * 1.1);
      const td = pd([piv, end]);
      q('#observatory-tube').setAttribute('d', ow ? td : ''); q('#observatory-tubehi').setAttribute('d', ow ? td : '');
    }
    function nearest(cx) {
      let best = 0, bd = 1e9;
      CL.forEach((c, i) => { let d = Math.abs(((c.x - cx) % SKY + SKY * 1.5) % SKY - SKY / 2); if (d < bd) { bd = d; best = i; } });

    function sky() {

      api.readout(`slit ${st.open ? 'open' : 'closed'} · az ${az()}° · ${st.frames} frame${st.frames === 1 ? '' : 's'}`);
    }
    const toggle = () => { st.open = !st.open; render();
      for (let i = 1; i <= 10; i++) api.after(i * 32, () => { st.amt = st.open ? Math.max(st.amt, i / 10) : Math.min(st.amt, 1 - i / 10); drawDome(); }); };

      q(`#observatory-cl${st.cl}`).classList.add('hl');
      render();
    }
    let prev = 0;
    api.loop(ts => {
      const dt = prev ? Math.min(.1, (ts - prev) / 1000) : 0; prev = ts;
      st.drift += dt * 0.25;
      sky();
    });
    stage.addEventListener('click', e => { if (e.target.closest('#observatory-dome')) toggle(); });
    render();
    return {
      key(e) {
        if (e.key === 'o' || e.key === 'O') { if (!e.repeat) toggle(); return true; }
        if (e.key === 'ArrowLeft') { rotate(-3); return true; }
        if (e.key === 'ArrowRight') { rotate(3); return true; }
        if (e.key === ' ') { if (!e.repeat) capture(); return true; }
        return false;
      },
      demo() {
        toggle();
        for (let i = 0; i < 8; i++) api.after(120 + i * 60, () => rotate(3));
        api.after(640, capture);
      },
    };
  },
});

    function readout() {
      const parts = [st.neon ? 'open' : 'closed'];
      if (st.last) { const p = st.pumps[st.last]; parts.push(`pump ${st.last}`, p.L.toFixed(1) + ' L', money(p.L)); if (!p.run) parts.push('stopped'); }
      else parts.push('pumps idle');
      api.readout(parts.join(' · '));
    }
    function render() {
      stage.classList.toggle('neon', st.neon);
      ['#diner-whalo', '#diner-shalo', '#diner-shalo2'].forEach(s => q(s).classList.toggle('hot', st.neon));
      const any = st.pumps[1].run || st.pumps[2].run;
      stage.querySelectorAll('.strip').forEach(s => s.classList.toggle('hot', st.neon || any));
      [1, 2].forEach(n => { const run = st.pumps[n].run;
        q(`.pump[data-pump="${n}"]`).classList.toggle('run', run);
        q(`#diner-pg${n}`).classList.toggle('hot', run); q(`#diner-ph${n}`).classList.toggle('hot', run);
        q(`#diner-led${n}`).classList.toggle('hot', run); q(`#diner-hose${n}`).classList.toggle('hot', run);
        drawPump(n); });
      api.power(st.neon || any);
      readout();
    }
    function toggleNeon() { st.neon = !st.neon; if (!st.neon) tubes.forEach(t => t.classList.remove('flk')); render(); }
    function togglePump(n) { const p = st.pumps[n]; p.run = !p.run; st.last = n; render(); }
    function stopAll() { let any = false; [1, 2].forEach(n => { if (st.pumps[n].run) { st.pumps[n].run = false; any = true; } }); render(); return any; }

    // fuel metering in real time
    let prev = null;
    api.loop(ts => {
      const dt = prev == null ? 0 : Math.min(0.25, (ts - prev) / 1000); prev = ts;
      let ch = false;
      [1, 2].forEach(n => { const p = st.pumps[n]; if (p.run) { p.L += RATE * dt; drawPump(n); ch = true; } });
      if (ch) readout();
    });
    // occasional realistic flicker of one tube
    api.every(450, () => {
      if (!st.neon || Math.random() > 0.18) return;
      const t = tubes[Math.floor(Math.random() * tubes.length)];
      const blips = 1 + Math.floor(Math.random() * 3); let at = 0;
      for (let i = 0; i < blips; i++) {
        const off = 40 + Math.random() * 90, on = 30 + Math.random() * 70;
        api.after(at, () => st.neon && t.classList.add('flk'));
        api.after(at + off, () => t.classList.remove('flk'));
        at += off + on;
      }
    });

    stage.addEventListener('click', e => {
      const p = e.target.closest('.pump'); if (p) { togglePump(+p.dataset.pump); return; }
      if (e.target.closest('.sign')) toggleNeon();
    });
    render();
    return {
      key: e => {
        const k = e.key.toLowerCase();
        if (k === 'n') { toggleNeon(); return true; }
        if (k === '1' || k === '2') { togglePump(+k); return true; }
        if (k === 's') { stopAll(); return true; }
        return false;
      },
      demo: () => { api.after(60, () => { if (!st.neon) toggleNeon(); }); api.after(260, () => { if (!st.pumps[1].run) togglePump(1); }); },
    };
  },
});
</script>
<!-- CORE: kernel, api, navigation, palette picker. Keep after the figures. -->
<script>
/* ============================================================
   iso gallery core: kernel, shared api, navigation.
   Figures register with FIGS.push({...}) — see CONTRACT below.
   ============================================================ */
// FIGS is declared inline in the page before the figure scripts

const ISO = (() => {
  const C = Math.cos(Math.PI / 6), S = Math.sin(Math.PI / 6);
  function kernel(OX, OY) {
    const P = (x,y,z) => [(x-y)*C + OX, (x+y)*S - z + OY];
    const D = (x,y,z) => [(x-y)*C, (x+y)*S - z];
    const plane = (O,U,V) => { const o=P(...O), u=D(...U), v=D(...V);
      return `matrix(${u[0]} ${u[1]} ${v[0]} ${v[1]} ${o[0]} ${o[1]})`; };
    const TOP   = (x,y,z) => plane([x,y,z],[1,0,0],[0,1,0]);
    const FRONT = (x,y,z) => plane([x,y,z],[1,0,0],[0,0,-1]);
    const SIDE  = (x,y,z) => plane([x,y,z],[0,-1,0],[0,0,-1]);
    const rect = (t,w,h,r=0,cls='face') => `<g transform="${t}"><rect class="${cls}" width="${w}" height="${h}" rx="${r}"/></g>`;
    // Rounded box: one rounded top plus one continuous side wall along the visible part of the
    // outline, so the corners meet cleanly. r = 0 keeps the classic three flat faces.
    const rounded = (x,y,z,w,d,h,r,cls) => {
      r = Math.min(r, w/2, d/2);
      const n = 10, z1 = z + h, q = Math.PI/4, H = Math.PI/2, c = cls ? ' ' + cls : '';
      const arc = (cx,cy,a0,a1) => { const o = []; for (let i = 0; i <= n; i++) { const a = a0 + (a1-a0)*i/n; o.push([cx + r*Math.cos(a), cy + r*Math.sin(a)]); } return o; };
      const ring = [...arc(x+w-r,y+r,-H,0), ...arc(x+w-r,y+d-r,0,H), ...arc(x+r,y+d-r,H,2*H), ...arc(x+r,y+r,2*H,3*H)];
      const vis  = [...arc(x+w-r,y+r,-q,0), ...arc(x+w-r,y+d-r,0,H), ...arc(x+r,y+d-r,H,3*q)];
      const d3 = pts => 'M' + pts.map(p => P(...p).map(v => v.toFixed(2)).join(' ')).join('L') + 'Z';
      const wall = [...vis.map(([a,b]) => [a,b,z]), ...vis.slice().reverse().map(([a,b]) => [a,b,z1])];
      return `<path class="face${c}" d="${d3(wall)}"/><path class="face top${c}" d="${d3(ring.map(([a,b]) => [a,b,z1]))}"/>`;
    };
    const box = (x,y,z,w,d,h,r=0) => r > 0 ? rounded(x,y,z,w,d,h,r,'') :
      rect(SIDE(x+w,y+d,z+h), d,h) + rect(FRONT(x,y+d,z+h), w,h) + rect(TOP(x,y,z+h), w,d,0,'face top');
    const boxc = (x,y,z,w,d,h,r,cls) => r > 0 ? rounded(x,y,z,w,d,h,r,cls) :
      rect(SIDE(x+w,y+d,z+h), d,h,0,'face '+cls) + rect(FRONT(x,y+d,z+h), w,h,0,'face '+cls) + rect(TOP(x,y,z+h), w,d,0,'face top '+cls);
    // 3D polyline -> SVG path "d"
    const path = pts => 'M' + pts.map(p => P(...p).map(n => n.toFixed(2)).join(' ')).join('L');
    return { C, S, P, D, plane, TOP, FRONT, SIDE, rect, box, boxc, path };
  }
  // Frame a scene: pass its extreme 3D corners. Returns kernel + viewBox padded to ~4:3.
  function frame(points, margin = 0.09, aspect = 4 / 3) {
    const d = points.map(([x,y,z]) => [(x-y)*C, (x+y)*S - z]);
    let x0 = Math.min(...d.map(p => p[0])), x1 = Math.max(...d.map(p => p[0]));
    let y0 = Math.min(...d.map(p => p[1])), y1 = Math.max(...d.map(p => p[1]));
    const m = margin * Math.max(x1 - x0, y1 - y0);
    let w = x1 - x0 + 2*m, h = y1 - y0 + 2*m;
    let ox = m - x0, oy = m - y0;
    if (w / h < aspect) { const nw = h * aspect; ox += (nw - w) / 2; w = nw; }
    else { const nh = w / aspect; oy += (nh - h) / 2; h = nh; }
    return { ...kernel(ox, oy), viewBox: `0 0 ${w.toFixed(1)} ${h.toFixed(1)}`, W: w, H: h };
  }
  // repeated detail lines in a face-local group
  const slits = (a0, a1, step, b0, b1, vertical = true, cls = 'detail') => {
    let s = ''; for (let a = a0; a <= a1 + 1e-6; a += step)
      s += vertical ? `<line class="${cls}" x1="${a}" y1="${b0}" x2="${a}" y2="${b1}"/>` : `<line class="${cls}" x1="${b0}" y1="${a}" x2="${b1}" y2="${a}"/>`;
    return s;
  };
  const esc = s => String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  return { kernel, frame, slits, esc };
})();

/* ---------- shared audio (created on first user gesture) ---------- */
const AUDIO = (() => {
  let ctx = null, out = null, analyser = null;
  return () => {
    if (!ctx) {
      ctx = new (window.AudioContext || window.webkitAudioContext)();
      out = ctx.createGain(); out.gain.value = 0.5;
      analyser = ctx.createAnalyser(); analyser.fftSize = 1024;
      out.connect(analyser); analyser.connect(ctx.destination);
    }
    if (ctx.state === 'suspended') ctx.resume();
    return { ctx, out, analyser };
  };
})();

/* ---------- app ---------- */
(function app() {
  const $ = id => document.getElementById(id);
  const CFG = window.GALLERY || {};
  const holder = $('stageHolder'), readoutEl = $('readout'), hintEl = $('hint'), numEl = $('fignum'), nameEl = $('figname');
  const nav = $('nav');
  let active = null, handle = null, timers = [], frames = [], idx = 0;

  const api = {
    iso: ISO,
    readout: s => { readoutEl.textContent = s; },
    hint: s => { hintEl.textContent = s; },
    audio: AUDIO,
    after: (ms, fn) => { const t = setTimeout(fn, ms); timers.push(t); return t; },
    every: (ms, fn) => { const t = setInterval(fn, ms); timers.push(t); return t; },
    loop: fn => { let alive = true; const f = ts => { if (!alive) return; fn(ts); requestAnimationFrame(f); };
      requestAnimationFrame(f); const stop = () => { alive = false; }; frames.push(stop); return stop; },
    // light a pressable briefly (orange flash + glow, then fade)
    flash: (el, ms = 160) => { if (!el) return; el.classList.add('down', 'lit'); clearTimeout(el._f1); clearTimeout(el._f2);
      el._f1 = setTimeout(() => el.classList.remove('down'), 110); el._f2 = setTimeout(() => el.classList.remove('lit'), ms); },
    // restart a one-shot CSS animation class (e.g. '.pulse' -> 'go')
    replay: (el, cls = 'go') => { if (!el) return; el.classList.remove(cls); void el.getBoundingClientRect(); el.classList.add(cls); },
    power: on => { holder.classList.toggle('glow', !!on); },
  };

  function mount(i) {
    if (handle && handle.unmount) handle.unmount();
    timers.forEach(t => { clearTimeout(t); clearInterval(t); }); timers = [];
    frames.forEach(stop => stop()); frames = [];
    idx = (i + FIGS.length) % FIGS.length; active = FIGS[idx];
    holder.classList.remove('glow');
    const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
    svg.setAttribute('id', 'stage'); svg.setAttribute('role', 'img'); svg.setAttribute('tabindex', '0');
    svg.setAttribute('aria-label', active.aria || active.name);
    svg.dataset.fig = active.id;
    holder.replaceChildren(svg);
    numEl.textContent = `Fig ${idx + 1}`; nameEl.textContent = active.name;
    hintEl.textContent = active.hint || ''; readoutEl.textContent = '';
    document.title = `Fig ${idx + 1} · ${active.name}`;
    [...nav.querySelectorAll('button[data-i]')].forEach(b => b.setAttribute('aria-current', +b.dataset.i === idx ? 'true' : 'false'));
    const cur = nav.querySelector(`button[data-i="${idx}"]`);
    if (cur && nav.scrollWidth > nav.clientWidth) nav.scrollTo({ left: cur.offsetLeft - nav.clientWidth / 2 + cur.offsetWidth / 2, behavior: 'smooth' });
    if (location.hash.slice(1) !== active.id) history.replaceState(null, '', '#' + active.id);
    handle = active.mount(svg, api) || {};
    // demo(): runs on arrival unless ?still is in the URL
    const runDemo = !/still/.test(location.search);
    if (runDemo && handle.demo) setTimeout(() => handle.demo(), 120);
  }

  // ---------- glow colour choice ----------
  const PALETTES = {
    // [name, dark accent, dark hi, light accent, light hi]
    ember: [['Ember','#ff7a1a','#ffb070','#ff7a1a','#ffb070'], ['Cyan','#22d3ee','#9beefa','#22d3ee','#9beefa'], ['Lime','#a3e635','#d6f79f','#a3e635','#d6f79f'],
            ['Violet','#a78bfa','#d6caff','#a78bfa','#d6caff'], ['Rose','#fb7185','#fdb8c2','#fb7185','#fdb8c2'], ['Ice','#dfe9ef','#ffffff','#1f2937','#3b4656']],
    city:  [['Sodium','#ff9a2e','#ffc77a','#ff9a2e','#ffc77a'], ['Tungsten','#ffd166','#ffe7a8','#ffd166','#ffe7a8'], ['Neon','#ff4fa3','#ff9fcb','#ff4fa3','#ff9fcb'],
            ['Signal','#3ee8a0','#a3f5cf','#3ee8a0','#a3f5cf'], ['Dusk','#6f9dff','#b5ccff','#6f9dff','#b5ccff'], ['Moon','#dfe7f5','#ffffff','#273246','#3d4a61']],
  };
  const ACCENTS = Array.isArray(CFG.palette) ? CFG.palette : (PALETTES[CFG.palette] || PALETTES.ember);
  const vars = (a, hi, dark) => `--accent:${a}; --accent-hi:${hi}; --accent-dim:color-mix(in srgb, ${a} 10%, transparent);` +
    ` --glass-on:color-mix(in srgb, ${a} ${dark ? 9 : 12}%, ${dark ? '#101112' : '#eef0f0'});`;
  const accentCss = ACCENTS.map(([n, da, dh, la, lh]) => { const k = n.toLowerCase();
    return `:root[data-accent="${k}"] { ${vars(da, dh, true)} }
@media (prefers-color-scheme: light) { :root[data-accent="${k}"]:not([data-theme="dark"]) { ${vars(la, lh, false)} } }
:root[data-accent="${k}"][data-theme="light"] { ${vars(la, lh, false)} }`; }).join('\n');
  const accentStyle = document.createElement('style'); accentStyle.textContent = accentCss; document.head.appendChild(accentStyle);
  const sw = $('swatches');
  sw.innerHTML = ACCENTS.map(([n, da]) => `<button role="radio" data-accent="${n.toLowerCase()}" aria-label="${n}" title="${n}" style="--sw:${da}"><i></i></button>`).join('');
  function setAccent(k) {
    if (!ACCENTS.some(a => a[0].toLowerCase() === k)) k = ACCENTS[0][0].toLowerCase();
    document.documentElement.dataset.accent = k;
    sw.querySelectorAll('button').forEach(b => b.setAttribute('aria-checked', b.dataset.accent === k ? 'true' : 'false'));
    try { localStorage.setItem((CFG.storageKey || 'iso-glow-accent'), k); } catch (e) {}
  }
  let saved = null; try { saved = localStorage.getItem((CFG.storageKey || 'iso-glow-accent')); } catch (e) {}
  setAccent(saved || ACCENTS[0][0].toLowerCase());
  sw.addEventListener('click', e => { const b = e.target.closest('button[data-accent]'); if (b) { setAccent(b.dataset.accent); const s = $('stage'); if (s) s.focus({ preventScroll: true }); } });

  // per-figure css
  FIGS.forEach(f => { if (f.css) { const st = document.createElement('style'); st.textContent = f.css; document.head.appendChild(st); } });

  // navigation markup
  nav.innerHTML = FIGS.map((f, i) =>
    `<button data-i="${i}"><span class="n">${String(i + 1).padStart(2, '0')}</span><span class="t">${f.name}</span></button>`).join('');
  // after a nav click, hand keyboard focus to the figure so space/enter go to it, not the button
  const focusStage = () => { const s = $('stage'); if (s) s.focus({ preventScroll: true }); };
  nav.addEventListener('click', e => { const b = e.target.closest('button[data-i]'); if (b) { mount(+b.dataset.i); focusStage(); } });
  $('prev').addEventListener('click', () => { mount(idx - 1); focusStage(); });
  $('next').addEventListener('click', () => { mount(idx + 1); focusStage(); });
  window.addEventListener('hashchange', () => { const i = FIGS.findIndex(f => f.id === location.hash.slice(1)); if (i >= 0 && i !== idx) mount(i); });

  window.addEventListener('keydown', e => {
    if (e.metaKey || e.ctrlKey || e.altKey) return;
    if (e.target.closest && e.target.closest('button') && (e.key === 'Enter' || e.key === ' ')) return;
    if (handle && handle.key && handle.key(e)) { e.preventDefault(); return; }
    if (e.key === 'PageDown') mount(idx + 1);
    if (e.key === 'PageUp') mount(idx - 1);
  });
  window.addEventListener('keyup', e => { if (handle && handle.keyup) handle.keyup(e); });
  window.addEventListener('blur', () => { if (handle && handle.blur) handle.blur(); });

  if (!FIGS.length) {   // nothing registered yet (figures still being built)
    holder.innerHTML = '<p style="display:grid;place-items:center;height:100%;margin:0;letter-spacing:.14em;text-transform:uppercase">No figures yet</p>';
    numEl.textContent = 'Fig —'; return;
  }
  const start = FIGS.findIndex(f => f.id === location.hash.slice(1));
  mount(start >= 0 ? start : 0);
})();

</script>
<style>/* light theme: the same accent as the dark theme, but no ambient glow (halos, bloom, light pools, soft blur) */
  :root[data-theme="light"] .halo, :root[data-theme="light"] #lamp-pool, :root[data-theme="light"] #lamp-bookpool, :root[data-theme="light"] #lamp-cone { display:none !important; }
  :root[data-theme="light"] .top .dot { box-shadow:none; }
  :root[data-theme="light"] .swatches button[aria-checked="true"] i { box-shadow:0 0 0 2px var(--panel), 0 0 0 3px var(--sw); }
  @media (prefers-color-scheme: light) {
    :root:not([data-theme="dark"]) .halo, :root:not([data-theme="dark"]) #lamp-pool, :root:not([data-theme="dark"]) #lamp-bookpool, :root:not([data-theme="dark"]) #lamp-cone { display:none !important; }
    :root:not([data-theme="dark"]) .top .dot { box-shadow:none; }
    :root:not([data-theme="dark"]) .swatches button[aria-checked="true"] i { box-shadow:0 0 0 2px var(--panel), 0 0 0 3px var(--sw); }
  }
</style>
<script>/* light theme: the glow filters pass the drawing through unblurred, bloom draws nothing */
(function () {
  var root = document.documentElement, mq = matchMedia('(prefers-color-scheme: light)'), orig = {};
  function apply() {
    var t = root.dataset.theme, light = t === 'light' || (t !== 'dark' && mq.matches);
    ['glow', 'soft', 'bloom'].forEach(function (id) {
      var f = document.getElementById(id); if (!f) return;
      if (!(id in orig)) orig[id] = f.innerHTML;
      f.innerHTML = !light ? orig[id] : id === 'bloom' ? '<feFlood flood-opacity="0"/>' : '<feMerge><feMergeNode in="SourceGraphic"/></feMerge>';
    });
  }
  new MutationObserver(apply).observe(root, { attributes: true, attributeFilter: ['data-theme'] });
  if (mq.addEventListener) mq.addEventListener('change', apply);
  apply();
})();
</script>
