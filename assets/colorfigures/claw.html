<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Claw machine</title>
<style>.mcap{display:none!important}@media (max-width:560px){.stat .v{font-size:20px!important}.stats{align-items:flex-end}}@media (min-width:561px){.vset{top:4px!important}#stats{top:var(--vset-h,44px)!important}}</style><style>@media (max-width:560px){body > header{display:none}}</style><script>window.FIG_A = () => innerWidth <= 560 ? 1.1 : .75;</script><script>window.LBL_U = () => { if (innerWidth > 560) return 0; const s = document.getElementById("fig"); return s && s.clientWidth && s.viewBox.baseVal.width ? s.viewBox.baseVal.width / s.clientWidth : 0; };</script></head>
<body>
<script>
/* ============================================================
   Colorfigures core: projection, shapes, shading, ink, labels, page shell.
   A figure page includes this file (scripts/build.py inlines it), then calls mountFigure({...}).
   See SKILL.md for the drawing contract and conventions.
   One fixed view (front-left-top) and one fixed light (from above, behind the viewer's right shoulder: the front is lit,
   the left side is in shade, and cast shadows fall toward the lower left of the screen).
   ============================================================ */

/* ---------- palettes ---------- */
const PALS = {
  mustard: { l:'#f4b829', m:'#d49c1f', d:'#4e4a18' },
  tomato:  { l:'#ef6a4c', m:'#cf5038', d:'#4a2219' },
  mint:    { l:'#93d3b0', m:'#71b693', d:'#1f4034' },
  cobalt:  { l:'#76a0e2', m:'#5a82c6', d:'#1c2948' },
  blush:   { l:'#f3a6bb', m:'#d8869c', d:'#4b2430' },
};
const METAL   = { l:'#eef0f0', m:'#c6ccce', d:'#8f989b' };
const CLEAR   = { l:'#e4f2f4', m:'#c4dfe4', d:'#97b9c0' };
const CERAMIC = { l:'#fbfaf3', m:'#e3e0d2', d:'#bdb8a6' };
const DARK    = { l:'#55504a', m:'#3d3935', d:'#272421' };
const INK = '#231e16';
const SHADOW = '#41538f';

/* ---------- projection (x = depth toward viewer-right, y = toward viewer-left, z = up) ---------- */
const C = Math.cos(Math.PI/6), S = Math.sin(Math.PI/6);
let OX = 0, OY = 0;
/* Free orthographic camera (internal names start with CAM_ / cam so they never clash with a figure's own names). YAW turns the viewer around the vertical axis (45° = the classic front-left view),
   PITCH is how far it looks down (35.26° = true isometric). At the defaults P() is exactly the old isometric
   projection, so every figure drawn for it still lines up. Drag the figure to orbit; double-click to reset.
   rotV(n) maps a world direction into the default view's frame, so vis / tone / any "sum of rotV > 0" test keep
   working at every angle: the viewer is always (1,1,1) and the light stays put relative to the viewer. */
let VIEW = 0, RC = [0, 0], RCZ = 0;
const VIEW_NAMES = ['front', 'left side', 'back', 'right side'];
const TURNS = [0, 2];
const YAW0 = 45, PITCH0 = Math.atan(1/Math.SQRT2) * 180/Math.PI, CAM_K = Math.sqrt(1.5);
let YAW = YAW0, PITCH = PITCH0, CAM_R, CAM_U, CAM_V, CAM_D;                       // right, up, toward viewer, screen-down
const camBasis = (yaw, pitch) => { const t = yaw*Math.PI/180, p = pitch*Math.PI/180, ct = Math.cos(t), st = Math.sin(t), cp = Math.cos(p), sp2 = Math.sin(p);
  return { R:[st,-ct,0], U:[-sp2*ct,-sp2*st,cp], V:[cp*ct,cp*st,sp2] }; };
const CAM_B0 = camBasis(YAW0, PITCH0);
// CAM_LIM: how far (deg) the camera may turn either side of the front view; null = all the way round (set per figure)
let CAM_LIM = null;
function setCam(yaw, pitch){ YAW = CAM_LIM == null ? yaw : Math.max(YAW0 - CAM_LIM, Math.min(YAW0 + CAM_LIM, yaw));
  PITCH = CAM_LIM == null ? Math.max(6, Math.min(78, pitch)) : Math.max(15, Math.min(62, pitch)); const b = camBasis(YAW, PITCH); CAM_R = b.R; CAM_U = b.U; CAM_V = b.V; CAM_D = CAM_U.map(v => -v); }
setCam(YAW0, PITCH0);
const camDot = (a,b) => a[0]*b[0]+a[1]*b[1]+a[2]*b[2];
const rotV = n => { const r = camDot(n,CAM_R), u = camDot(n,CAM_U), v = camDot(n,CAM_V); return [0,1,2].map(i => CAM_B0.R[i]*r + CAM_B0.U[i]*u + CAM_B0.V[i]*v); };
// the light's ground direction turns with the viewer's yaw only (shadows always fall toward the lower left of the screen)
const yawTurn = ([x,y]) => { const t = (YAW - YAW0)*Math.PI/180, c = Math.cos(t), s = Math.sin(t); return [x*c - y*s, x*s + y*c]; };
const rotXY = (x,y) => [x, y];                                                // kept for old callers
const P0 = (x,y,z) => [(x-y)*C + OX, (x+y)*S - z + OY];                       // raw iso
const P  = (x,y,z) => { const q = [x-RC[0], y-RC[1], z-RCZ];
  return [CAM_K*camDot(q,CAM_R) + (RC[0]-RC[1])*C + OX, CAM_K*camDot(q,CAM_D) + (RC[0]+RC[1])*S - RCZ + OY]; };
const Dv = (x,y,z) => [CAM_K*camDot([x,y,z],CAM_R), CAM_K*camDot([x,y,z],CAM_D)];
// distance toward the viewer: draw parts with smaller depth first
const depthOf = p => camDot(p, CAM_V);
// sort [{at:[x,y,z], svg}] back-to-front for the current camera. A part may also give box:[[x0,y0,z0],[x1,y1,z1]]:
// when two boxes are separated along x, y or z, the one on the viewer's side goes last (a centre point alone gets long
// or wrapping parts wrong: a pole beside a row of keys, a spout reaching past a cup).
const boxMid = b => [0,1,2].map(k => (b[0][k] + b[1][k]) / 2);
const sepOrder = (p, q) => { if (!p.box || !q.box) return 0;
  for (let k = 0; k < 3; k++){ if (p.box[1][k] <= q.box[0][k] + 1e-6) return CAM_V[k] >= 0 ? -1 : 1; if (q.box[1][k] <= p.box[0][k] + 1e-6) return CAM_V[k] >= 0 ? 1 : -1; }
  return 0; };
const byDepth = parts => parts.filter(Boolean).sort((p,q) => sepOrder(p,q) || (depthOf(p.at || boxMid(p.box)) - depthOf(q.at || boxMid(q.box)))).map(p => p.svg).join('');
// the half of a vertical ring that faces the viewer / is turned away, as [from, to] angles in degrees (0 = +x, 90 = +y)
const nearHalf = () => [YAW - 90, YAW + 90], farHalf = () => [YAW + 90, YAW + 270];
// an open container (cup, bin, cone, drum) between two rings: far inner wall, then its contents, then the near outer wall
const openShell = (A, B, colour, contents = '') => loft(A, B, colour, true) + contents + loft(A, B, colour);
const f  = v => v.toFixed(1);
const pd = (pts, close=true) => 'M' + pts.map(p => { const q = P(p[0],p[1],p[2]); return f(q[0])+' '+f(q[1]); }).join('L') + (close ? 'Z' : '');
const sp = pts => 'M' + pts.map(q => f(q[0])+' '+f(q[1])).join('L') + 'Z';

/* ---------- 2D shapes in a plane's (u,v) coords (v up), mapped to 3D by a plane ---------- */
const arcUV  = (cu,cv,r,a0,a1,n=7) => { const o=[]; for (let i=0;i<=n;i++){ const a=(a0+(a1-a0)*i/n)*Math.PI/180; o.push([cu+r*Math.cos(a), cv+r*Math.sin(a)]); } return o; };
const rrUV   = (u0,v0,u1,v1,r,n=7) => r <= 0 ? rectUV(u0,v0,u1,v1) : [...arcUV(u1-r,v0+r,r,-90,0,n), ...arcUV(u1-r,v1-r,r,0,90,n), ...arcUV(u0+r,v1-r,r,90,180,n), ...arcUV(u0+r,v0+r,r,180,270,n)];
const rectUV = (u0,v0,u1,v1) => [[u0,v0],[u1,v0],[u1,v1],[u0,v1]];
const ellUV  = (cu,cv,ru,rv,n=24) => Array.from({length:n}, (_,i) => { const a=i/n*2*Math.PI; return [cu+ru*Math.cos(a), cv+rv*Math.sin(a)]; });
const PX = x => ([u,v]) => [x,u,v];      // front-facing plane x = const   (u = y, v = z)
const PY = y => ([u,v]) => [u,y,v];      // side plane y = const           (u = x, v = z)
const PZ = z => ([u,v]) => [u,v,z];      // horizontal plane z = const     (u = x, v = y)
const on = (plane, uv) => uv.map(plane);

/* ---------- vectors + shading ---------- */
const sub=(a,b)=>[a[0]-b[0],a[1]-b[1],a[2]-b[2]], dot=(a,b)=>a[0]*b[0]+a[1]*b[1]+a[2]*b[2];
const cross=(a,b)=>[a[1]*b[2]-a[2]*b[1], a[2]*b[0]-a[0]*b[2], a[0]*b[1]-a[1]*b[0]];
const norm=a=>{ const l=Math.hypot(...a)||1; return a.map(v=>v/l); };
const avg=ps=>ps.reduce((s,p)=>[s[0]+p[0]/ps.length,s[1]+p[1]/ps.length,s[2]+p[2]/ps.length],[0,0,0]);
const vis = n => { const r = rotV(n); return r[0]+r[1]+r[2] > 1e-6; };   // viewer looks from (+1,+1,+1) after the turn
const facing = vis;                                                       // readable alias: is this face toward the viewer?
const SHADOW_K = 0.85, AZ_MIN = 20, AZ_MAX = 160;
// cast shadows are drawn shorter than the shading light implies (0.45 × height instead of 0.85 ×): long shadows of tall
// parts on thin supports (a lamp shade, a fan head) land far from the object and read as separate blobs
const SHADOW_LEN = 0.45;
let L = [0,0,1], SH = [0,0];
function setLight(deg){ const a=deg*Math.PI/180; SH=[SHADOW_K*Math.cos(a), SHADOW_K*Math.sin(a)]; L=norm([-SH[0],-SH[1],1]); }
const LIN = norm([.6,.2,1]);                       // fixed light for interiors / small props
// Three flat tones, but blended across a narrow band at each step, so a face that turns past a threshold while the
// figure rotates fades between tones instead of snapping (at rest almost every face still sits on a pure tone).
const SOFT = .18;
const step3 = (d, hi, lo, m) => { const ss = (a, b, x) => { const k = Math.min(1, Math.max(0, (x - a)/(b - a))); return k*k*(3 - 2*k); };
  const a = ss(hi - SOFT, hi + SOFT, d), b = ss(lo - SOFT, lo + SOFT, d);
  return a >= 1 ? m.l : b <= 0 ? m.d : a > 0 ? mix(m.m, m.l, a) : b < 1 ? mix(m.d, m.m, b) : m.m; };
const tone  = (n,m) => step3(dot(rotV(n),L),   -.15, -.45, m);   // exterior, follows the sun
const toneI = (n,m) => step3(dot(rotV(n),LIN),  .6,   .05, m);   // interior / props
const mix = (a,b,t) => '#' + [1,3,5].map(i => Math.round(parseInt(a.substr(i,2),16)*(1-t) + parseInt(b.substr(i,2),16)*t).toString(16).padStart(2,'0')).join('');
const matOf = hex => ({ l:hex, m:mix(hex,'#000000',.16), d:mix(hex,'#000000',.42) });
const ease = t => t<.5 ? 2*t*t : 1-Math.pow(-2*t+2,2)/2;

/* ---------- drawing primitives (all return SVG strings) ---------- */
const ink   = (d,w=1.0) => `<path d="${d}" fill="none" stroke="${INK}" stroke-width="${w}" stroke-linejoin="round" stroke-linecap="round"/>`;
const fill  = (d,c,extra='') => `<path d="${d}" fill="${c}" ${extra}/>`;
const face  = (d,c) => `<path d="${d}" fill="${c}" stroke="${c}" stroke-width=".7" stroke-linejoin="round"/>`;
const shape = (pts,c,w=.9) => fill(pd(pts),c) + (w ? ink(pd(pts),w) : '');
const line  = (pts,w=.9) => ink(pd(pts,false),w);
// Loft between two rings of equal length (closed). colour(n) picks each strip's fill; flip = seen from inside.
function loft(A, B, colour, flip=false){
  const n=A.length, cen=avg(A.concat(B)); let s='';
  for (let i=0;i<n;i++){
    const a0=A[i], a1=A[(i+1)%n], b1=B[(i+1)%n], b0=B[i];
    let nr = norm(cross(sub(a1,a0), sub(b0,a0)));
    if (!isFinite(nr[0])) continue;
    if (dot(nr, sub(avg([a0,a1,b1,b0]), cen)) < 0) nr = nr.map(v=>-v);
    if (flip) nr = nr.map(v=>-v);
    if (vis(nr)) s += face(pd([a0,a1,b1,b0]), colour(nr));
  }
  return s;
}
function hull(pts){
  pts = pts.slice().sort((a,b)=>a[0]-b[0]||a[1]-b[1]);
  const cr=(o,a,b)=>(a[0]-o[0])*(b[1]-o[1])-(a[1]-o[1])*(b[0]-o[0]); const lo=[], up=[];
  for (const p of pts){ while(lo.length>=2 && cr(lo[lo.length-2],lo[lo.length-1],p)<=0) lo.pop(); lo.push(p); }
  for (const p of pts.reverse()){ while(up.length>=2 && cr(up[up.length-2],up[up.length-1],p)<=0) up.pop(); up.push(p); }
  lo.pop(); up.pop(); return lo.concat(up);
}
// Silhouette ink, weighted by how thick the part is on screen (like a hand inker): the w you pass is the most it gets.
// Thickness = 2 × area / perimeter of the outline (a rod's diameter, about half a box's width), as a share of the
// frame width. A long thin rod, a handle or a knob stays light (~1–1.5); a grinder, kettle or machine body gets the
// heavy ~2.4–2.8. Thin parts stay thin and parts keep air between them.
const hullInk = (pts3, w=1.4) => { const h = hull(pts3.map(p=>P(...p))); let a = 0, per = 0;
  for (let i = 0; i < h.length; i++){ const p = h[i], q = h[(i+1) % h.length]; a += p[0]*q[1] - q[0]*p[1]; per += Math.hypot(q[0]-p[0], q[1]-p[1]); }
  const thick = per ? Math.abs(a) / per / (INK_K * INK_REF_VB) : 0;
  return ink(sp(h), Math.min(w, .9 + 20*thick)); };
// Axis-aligned box: three visible faces, shaded, each outlined. shade = tone (sunlit) or toneI (interior).
function box(x0,y0,z0,x1,y1,z1,m,shade=toneI,w=.9){
  // all six faces, drawn only when they face the viewer (sides first, then top) — correct in every VIEW
  const F = [
    [[0,1,0],  [[x0,y1,z0],[x1,y1,z0],[x1,y1,z1],[x0,y1,z1]]],
    [[1,0,0],  [[x1,y0,z0],[x1,y1,z0],[x1,y1,z1],[x1,y0,z1]]],
    [[0,-1,0], [[x0,y0,z0],[x1,y0,z0],[x1,y0,z1],[x0,y0,z1]]],
    [[-1,0,0], [[x0,y0,z0],[x0,y1,z0],[x0,y1,z1],[x0,y0,z1]]],
    [[0,0,1],  [[x0,y0,z1],[x1,y0,z1],[x1,y1,z1],[x0,y1,z1]]] ];
  return F.filter(([n]) => vis(n)).map(([n,q]) => shape(q, shade(n,m), w)).join('');
}
// Rounded-profile extrusion: profile (u=y, v=z) swept along x from x0 to x1. Body of most machines.
function extrude(profileUV, x0, x1, m, shade=tone){ return loft(on(PX(x0),profileUV), on(PX(x1),profileUV), n=>shade(n,m)); }
// Vertical cylinder (axis z) centred (x,y), radius r from z0 to z1, with top cap.
function cyl(x,y,z0,z1,r,m,shade=toneI,w=1.2,n=24){
  const A=on(PZ(z0),ellUV(x,y,r,r,n)), B=on(PZ(z1),ellUV(x,y,r,r,n));
  return loft(A,B,nr=>shade(nr,m)) + fill(pd(B),shade([0,0,1],m)) + hullInk([...A,...B],w) + ink(pd(B),w*.8);
}
// Cylinder lying along x (e.g. a knob or dial sticking out of a front face): centred (y,z), from x0 to x1.
function cylX(x0,x1,y,z,r,m,shade=toneI,w=1.1,n=20){
  const A=on(PX(x0),ellUV(y,z,r,r,n)), B=on(PX(x1),ellUV(y,z,r,r,n));
  // cap on whichever end faces the viewer (the +x end in VIEW 0)
  const capB = vis([1,0,0]), cap = capB ? B : A, cn = capB ? [1,0,0] : [-1,0,0];
  return loft(A,B,nr=>shade(nr,m)) + (vis(cn) ? fill(pd(cap),shade(cn,m)) : '') + hullInk([...A,...B],w) + (vis(cn) ? ink(pd(cap),w*.8) : '');
}
// Cylinder between any two 3D points a and b (a lamp arm, a rod, a pipe at an angle, a handle bar), radius r.
// The end facing the viewer gets a cap. For a tapered part (a cone, a lamp shade) pass r1 for the radius at b.
function rod(a, b, r, m, shade=toneI, w=1, r1=r, n=16){
  const d = norm(sub(b, a)), u = norm(cross(d, Math.abs(d[2]) < .9 ? [0,0,1] : [1,0,0])), v = cross(d, u);
  const ring = (p, rr) => Array.from({length:n}, (_,i) => { const t = i/n*2*Math.PI, c = Math.cos(t)*rr, s2 = Math.sin(t)*rr;
    return [p[0] + u[0]*c + v[0]*s2, p[1] + u[1]*c + v[1]*s2, p[2] + u[2]*c + v[2]*s2]; });
  const A = ring(a, r), B = ring(b, r1), capB = vis(d), cap = capB ? B : A, cn = capB ? d : d.map(x => -x);
  return loft(A, B, nr => shade(nr, m)) + (Math.max(r, r1) > 0 ? fill(pd(cap), shade(cn, m)) + ink(pd(cap), w*.8) : '') + hullInk([...A, ...B], w);
}
// Text lying flat on a front plane x = const, centred at (y,z) baseline; reads left-to-right on screen.
// text sits on a face: if its reading direction comes out mirrored (or edge-on), that face is turned away, so the text is hidden
const txM = (o, U, V) => (U[0]*V[1] - U[1]*V[0]) <= .02 * Math.hypot(...U) * Math.hypot(...V) ? `matrix(0 0 0 0 ${f(o[0])} ${f(o[1])})` : `matrix(${U[0].toFixed(4)} ${U[1].toFixed(4)} ${V[0].toFixed(4)} ${V[1].toFixed(4)} ${f(o[0])} ${f(o[1])})`;
const tx = (x,y,z,str,size,col=INK,weight=700) => { const o=P(x,y,z);
  return `<text transform="${txM(o, Dv(0,-1,0), Dv(0,0,-1))}" font-size="${size}" fill="${col}" text-anchor="middle" font-family="ui-monospace,Menlo,monospace" font-weight="${weight}" letter-spacing=".04em">${str}</text>`; };
// Text on a side plane y = const, centred at (x,z).
const txY = (x,y,z,str,size,col=INK,weight=700) => { const o=P(x,y,z);
  return `<text transform="${txM(o, Dv(1,0,0), Dv(0,0,-1))}" font-size="${size}" fill="${col}" text-anchor="middle" font-family="ui-monospace,Menlo,monospace" font-weight="${weight}" letter-spacing=".04em">${str}</text>`; };
// Cast shadow of a set of 3D points (any outline of the object), pushed along the light onto z = 0.
// the light stays put relative to the viewer, so the shadow is cast in turned coordinates
// z0: the surface it falls on (a board, a counter); clip it to that surface with clipTo(...) if it could spill off.
// clip: the 3D outline of the surface it falls on (e.g. boardTop(...)), so it can't spill over the edge.
const castShadow = (pts3, z0=0, clip=null) => { const k = SHADOW_LEN / SHADOW_K, [sx, sy] = yawTurn(SH);
  const s = fill(sp(hull(pts3.map(([x,y,z]) => P(x+(z-z0)*sx*k, y+(z-z0)*sy*k, z0)))), SHADOW);
  return clip ? clipTo(clip, s) : s; };
// A board for the object to stand on (a tray, a desk top, a counter): a rounded slab from (x0,y0) to (x1,y1), h thick.
// Draw it first; then castShadow(points, h, boardTop(x0,y0,x1,y1,h,r)) so shadows lie on it and stop at its edge.
const BOARD = { l:'#e6e1d4', m:'#cfc8b8', d:'#aaa293' }, WOOD = { l:'#d9a86c', m:'#bf8a4f', d:'#8e6236' };
const boardTop = (x0,y0,x1,y1,h=3,r=5) => on(PZ(h), rrUV(x0,y0,x1,y1,r));
function board(x0,y0,x1,y1,h=3,r=5,m=BOARD){
  const A = on(PZ(0), rrUV(x0,y0,x1,y1,r)), B = boardTop(x0,y0,x1,y1,h,r);
  return loft(A, B, n => toneI(n, m)) + fill(pd(B), m.l) + ink(pd(B), 1) + hullInk([...A, ...B], 1.8);
}
// Group helpers: clickable target, clip to an opening.
const act  = (name, inner, data='') => `<g data-act="${name}" ${data}>${inner}</g>`;
let _clipN = 0;
// Part label (for "how does it work" figures): a cream pill with a leader line to a 3D point on the part.
// dx, dy = where the pill sits, in screen units at the reference zoom (they scale with the figure like stroke widths).
// on = that part is working right now (the pill turns the accent colour). Labels can be hidden with the Labels switch.
function tag(p3, dx, dy, text, on=false){
  // on a phone (LBL_U = drawing units per screen px) the pill is a numbered badge and the names go in a legend under the figure
  const u = window.LBL_U ? LBL_U() : 0, n = ((window.__ln || (window.__ln = {}))[text] || (__ln[text] = Object.keys(__ln).length + 1));
  const k = INK_K, [X,Y] = P(...p3), fs = u ? 10*u : 8.6*k, h = u ? 17*u : fs*1.8, w = u ? h*(n > 9 ? 1.3 : 1) : text.length*fs*.62 + fs*1.5, cx = X + dx*k, cy = Y + dy*k;
  return `<g class="tag${on ? ' on' : ''}" data-n="${n}" data-t="${text}"><path d="M${f(X)} ${f(Y)}L${f(cx)} ${f(cy)}" fill="none" stroke="${INK}" stroke-width="1"/>`
    + `<circle cx="${f(X)}" cy="${f(Y)}" r="${f(1.3*k)}" fill="${INK}"/>`
    + `<rect x="${f(cx-w/2)}" y="${f(cy-h/2)}" width="${f(w)}" height="${f(h)}" rx="${f(h/2)}" fill="${on ? 'var(--accent,#f4b829)' : '#fff4d6'}" stroke="${INK}" stroke-width="1.2"/>`
    + `<text x="${f(cx)}" y="${f(cy+fs*.36)}" font-size="${f(fs)}" text-anchor="middle" font-family="ui-monospace,Menlo,monospace" font-weight="800" letter-spacing=".04em" fill="${INK}">${u ? n : text}</text></g>`;
}
const clipTo = (pts3, inner) => { const id = 'k' + (++_clipN); return `<clipPath id="${id}"><path d="${pd(pts3)}"/></clipPath><g clip-path="url(#${id})">${inner}</g>`; };

/* ---------- constant on-screen line weight ----------
   Stroke widths are written in model units, and each figure is zoomed to fill the frame, so a small
   object would get fat lines. INK_K rescales every stroke-width (and the wobble/grain filter) so all
   figures match the reference zoom of the booth / vending machine (viewBox ≈ 585 units wide). */

let INK_K = 1;
const inkScale = svg => INK_K === 1 ? svg : svg.replace(/stroke-width="([\d.]+)"/g, (_, w) => `stroke-width="${(+w * INK_K).toFixed(2)}"`);

const filterFor = k => `<filter id="hand" x="-3%" y="-3%" width="106%" height="106%" color-interpolation-filters="sRGB">
  <feTurbulence type="fractalNoise" baseFrequency="${(0.045/k).toFixed(4)}" numOctaves="2" seed="4" result="warp"/>
  <feDisplacementMap id="wob" in="SourceGraphic" in2="warp" scale="${(2.4*k).toFixed(2)}" xChannelSelector="R" yChannelSelector="G" result="wob"/>
  <feTurbulence type="fractalNoise" baseFrequency="${(0.9/k).toFixed(4)}" numOctaves="3" seed="11" result="n1"/>
  <feColorMatrix in="n1" type="matrix" values=".3 0 0 0 .84  .3 0 0 0 .84  .3 0 0 0 .84  0 0 0 0 1" result="grain"/>
  <feTurbulence type="fractalNoise" baseFrequency="${(0.012/k).toFixed(4)}" numOctaves="2" seed="7" result="n2"/>
  <feColorMatrix in="n2" type="matrix" values=".3 0 0 0 .85  .3 0 0 0 .85  .3 0 0 0 .85  0 0 0 0 1" result="blot"/>
  <feBlend in="wob" in2="grain" mode="multiply" result="g1"/><feBlend in="g1" in2="blot" mode="multiply" result="g2"/>
  <feComposite in="g2" in2="wob" operator="in"/></filter>`;

/* The hand-drawn filter's noise never changes, but browsers recompute every feTurbulence each time the drawing changes
   (on phones SVG filters run on the CPU, so this is most of the cost of a frame). bakeNoise renders each noise layer once
   into an image and swaps it in: coarse layers as one small image over the whole view (they are smooth, so scaling up
   is invisible), fine grain as a seamless tile. If anything fails (an old browser), the live filter simply stays. */
function bakeNoise(svg){
  const fl = document.getElementById('hand'); if (!fl || typeof Image === 'undefined') return;
  const NS = 'http://www.w3.org/2000/svg', vb = svg.viewBox.baseVal;
  const x0 = vb.x - vb.width*.35, y0 = vb.y - vb.height*.35, w0 = vb.width*1.7, h0 = vb.height*1.7;
  for (const t of [...fl.querySelectorAll('feTurbulence')]){
    const fq = parseFloat(t.getAttribute('baseFrequency')), oct = +(t.getAttribute('numOctaves') || 1);
    if (!(fq > 0)) continue;
    const fine = fq * Math.max(w0, h0) > 80;
    if (fine) continue;   // fine grain stays live: a repeated tile leaves faint seams on some GPUs
    const rx = fine ? 0 : x0, ry = fine ? 0 : y0, rw = fine ? 48 / fq : w0, rh = fine ? 48 / fq : h0;
    const ppu = fq * (fine ? 7 : 5) * Math.pow(2, Math.max(0, oct - 1) * .5), PW = Math.ceil(rw * ppu), PH = Math.ceil(rh * ppu);
    if (PW * PH > 1200 * 1200) continue;
    const tb = t.cloneNode(); tb.removeAttribute('result'); if (fine) tb.setAttribute('stitchTiles', 'stitch');
    const src = `<svg xmlns="${NS}" width="${PW}" height="${PH}" viewBox="${rx} ${ry} ${rw} ${rh}"><filter id="n" filterUnits="userSpaceOnUse" x="${rx}" y="${ry}" width="${rw}" height="${rh}" color-interpolation-filters="sRGB">${tb.outerHTML}</filter><rect x="${rx}" y="${ry}" width="${rw}" height="${rh}" filter="url(#n)"/></svg>`;
    const img = new Image();
    img.onload = () => { try {
      const c = document.createElement('canvas'); c.width = PW; c.height = PH; const g = c.getContext('2d'); g.drawImage(img, 0, 0);
      // store the noise's colour values fully opaque: the filter reads its colour channels, and an image with
      // see-through pixels would be read premultiplied (darker) by some browsers
      const px = g.getImageData(0, 0, PW, PH); for (let i = 3; i < px.data.length; i += 4) px.data[i] = 255; g.putImageData(px, 0, 0);
      const url = c.toDataURL('image/png'), res = t.getAttribute('result');
      const im = document.createElementNS(NS, 'feImage');
      // a tile must sit inside the filter's region (the drawing's box) or it gets clipped: anchor it at the drawing's
      // centre, snapped to whole tiles so the grain keeps the same phase as the live noise would
      let ox = rx, oy = ry;
      if (fine){ const bb = svg.getElementById ? document.getElementById('art').getBBox() : { x: 0, y: 0, width: 0, height: 0 };
        ox = Math.floor((bb.x + bb.width/2) / rw) * rw; oy = Math.floor((bb.y + bb.height/2) / rh) * rh; }
      for (const [k, v] of [['x', ox], ['y', oy], ['width', rw], ['height', rh], ['preserveAspectRatio', 'none']]) im.setAttribute(k, v);
      im.setAttribute('href', url); im.setAttributeNS('http://www.w3.org/1999/xlink', 'xlink:href', url);
      if (!t.isConnected) return;
      if (fine){ im.setAttribute('result', res + '_tile'); const tl = document.createElementNS(NS, 'feTile'); tl.setAttribute('in', res + '_tile'); tl.setAttribute('result', res); t.replaceWith(im, tl); }
      else { im.setAttribute('result', res); t.replaceWith(im); }
    } catch (e) {} };
    img.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(src);
  }
}

  function closeChips(){ document.querySelectorAll('.stepwrap.open').forEach(w => w.classList.remove('open')); }
  document.addEventListener('click', closeChips);

  document.getElementById('wb').oninput = e => document.getElementById('wob').setAttribute('scale', (e.target.value * INK_K).toFixed(2));
  const pals = document.getElementById('pals');
  for (const [k,p] of Object.entries(PALS)){
    const b = document.createElement('button'); b.className='sw'; b.title=k; b.style.background=p.l; b.setAttribute('aria-pressed', k===st.pal);
    b.onclick = () => { st.pal=k; [...pals.children].forEach(c=>c.setAttribute('aria-pressed', c===b)); ui.render(); };
    pals.appendChild(b);

  const lblctl = document.getElementById('lblctl'), lbl = document.getElementById('lbl');
  const setLabels = on => { document.documentElement.classList.toggle('nolabels', !on); lbl.textContent = on ? 'On' : 'Off'; lbl.setAttribute('aria-pressed', on); };
  lbl.onclick = () => setLabels(document.documentElement.classList.contains('nolabels'));
  if (q.get('labels') === '0') setLabels(false);
  // testing: ?press=Label@ms,Label@ms clicks the buttons whose text starts with Label at those times after load
  // (any order, repeats allowed); Label>Choice picks a choice from a picker button (?press=Speed>3@300).
  // Script errors and unknown labels are recorded on <html data-errors="…">
  window.__st = st;
  const noteErr = m => { document.documentElement.dataset.errors = (document.documentElement.dataset.errors || '') + ' ' + m + ';'; };
  const starts = (el, t) => el.textContent.trim().toLowerCase().startsWith(t.trim().toLowerCase());
  if (q.has('press')) q.get('press').split(',').forEach(item => { const [what, ms] = item.split('@'), [label, choice] = what.split('>');
    setTimeout(() => { const b = [...document.querySelectorAll('.act')].find(b => starts(b, label));
      if (!b) return noteErr(`no button "${label}"`);
      b.click(); if (choice == null) return;
      const c = [...b.parentElement.querySelectorAll('.chip')].find(c => starts(c, choice));
      if (c && !c.disabled) c.click(); else noteErr(`no choice "${choice}" in "${label}"`); }, +ms || 0); });
  setLight(st.az); ui.render();
  if (art.querySelector('.tag')) lblctl.hidden = false;
  return ui;
}

<script>
/* Real process (each step is where every token / prize is afterwards):
   1. Insert coin: the top token leaves the stack on the control ledge and drops into the coin slot -> the coin box;
      the display shows CREDIT 1.
   2. The game starts: credit -> 0, TIME 20 counts down on the display.
   3. Steer: the joystick tilts; the bridge runs along the two rails (forward/back), the carriage along the bridge (left/right).
   4. Drop (or time runs out): the claw lowers on its cable and opens, stops on a prize or the floor, closes,
      lifts and carries back to its home above the prize chute, then opens. A centred grip holds; an off-centre
      grip slips and the prize falls back onto the pile on the way.
   5. A held prize falls down the chute, through the base, into the pickup bay behind the clear flap.
   6. Take the prize: the flap tips open and the prize comes out. */

/* ---------- geometry (x = depth toward viewer-right, y = width toward viewer-left, z = up) ---------- */
const W = 80, D = 86;                         // cabinet depth, width
const HB = 80, HG = 150, HR = 155, HC = 184;  // base top (prize floor), glass top, roof top, marquee top
const LX = 14, LZ0 = 70, LZ1 = 80;            // control ledge: sticks out LX, from LZ0 to LZ1
const CHX = W - 26, CHY = 26, CHT = HB + 24;  // prize chute: x CHX..W, y 0..CHY, acrylic walls up to CHT
const HOME = [W - 13, 13];                    // claw rests above the chute
const ZTOP = 122;                             // claw hub height when up
const BAY = [4, 10, 34, 34];                  // pickup bay on the base front: y0,z0,y1,z1
const BAY_X = W - 16;                         // back of the bay
const DISP = [42, 36, 78, 52];                // display on the base front
const JOY = [W + 7, 66], BTN = [W + 7, 42], SLOT = [W + 7, 22], STACK = [W + 7, 9];
const BASE = rrUV(0, 0, D, HB, 4);
const CREST = rrUV(3, HR, D - 3, HC, 7);
const STEP = 6, SPEED = 28, GAME_T = 20;
const COINM = { l:'#f0d27a', m:'#d2ad4a', d:'#9a7a2a' };
const REDM = matOf('#e2483d');
const STEELM = { l:'#b4bcbf', m:'#848d91', d:'#555d61' };   // the claw: darker than the pale plushies it grips
const ACRYL = '#cfe9f0';
const DROP_PH = ['lower', 'close', 'lift', 'carry', 'release', 'back'];

/* ---------- prizes ---------- */
const PCOLS = ['#e2473a','#3e86d9','#f2c230','#38a565','#8c4bd1','#f08a2b','#5cc0e8','#d94f86'];
const BEARC = ['#c98a52','#f3efe4','#f3a6bb','#9a7a5a'];
function layout(){
  let seed = 11; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
  const out = [], xs = [9, 24.5, 40, 55.5, 71], ys = [9, 26, 43, 60, 77];
  const kinds = PLUSH_KINDS;
  let i = 0;
  for (const x of xs) for (const y of ys){
    if (x > W - 34 && y < 34) continue;                 // keep clear of the chute
    const kind = kinds[i % kinds.length];
    const col = PLUSH[kind][i % PLUSH[kind].length];
    out.push({ id:i, kind, col, r:7, x: x + (rnd() - .5) * 2.4, y: y + (rnd() - .5) * 2.4, z: HB + 7, layer:0 });
    i++;
  }
  // a second layer resting in the gaps
  for (const [x, y] of [[16.75,17.5],[32.25,51.5],[16.75,68.5],[47.75,68.5],[63.25,51.5],[32.25,34.5]]){
    const kind = kinds[(i + 2) % kinds.length];
    const col = PLUSH[kind][(i + 1) % PLUSH[kind].length];
    out.push({ id:i, kind, col, r:6.5, x, y, z: HB + 6.5 + 8, layer:1 }); i++;
  }
  return out;
}

/* ---------- small drawing helpers ---------- */
const circ = (X, Y, r, c, extra = '') => `<circle cx="${f(X)}" cy="${f(Y)}" r="${f(r)}" fill="${c}" ${extra}/>`;
const circInk = (X, Y, r, w) => `<circle cx="${f(X)}" cy="${f(Y)}" r="${f(r)}" fill="none" stroke="${INK}" stroke-width="${w}"/>`;
// a round plush prize ("mochi" style: the sphere is the toy), drawn facing the viewer: matte fabric, a sewn seam,
// and its own ears and face per kind
const PLUSH = {
  bear:    ['#c98a52', '#9a7a5a', '#f3efe4', '#e8b07a'],
  bunny:   ['#f6f1e8', '#f3c6d3', '#e9e4f5'],
  cat:     ['#f0a35a', '#b9b3ac', '#f3efe4', '#3a3632'],
  duck:    ['#f6d04a'],
  frog:    ['#7cc46a', '#a6d36a'],
  penguin: ['#3d4a6b'],
  pig:     ['#f4a6b4'],
};
const PLUSH_KINDS = ['bear', 'bunny', 'cat', 'duck', 'frog', 'penguin', 'pig', 'bear', 'bunny', 'cat'];
const plushTop = { bunny: 1.75, cat: 1.3, bear: 1.2, pig: 1.15, frog: 1.25 };
function orb(p, spot){
  const [X, Y] = P(p.x, p.y, p.z), R = p.r * 1.2247, m = matOf(p.col), k = p.kind;
  const lt = mix(p.col, '#ffffff', .4), dk = mix(p.col, '#000000', .3), BLUSH = '#f2849a';
  const eye = (x, y, r = R * .085) => circ(x, y, r, INK) + circ(x + r * .35, y - r * .35, r * .32, '#ffffff');
  const blush = () => `<ellipse cx="${f(X - R * .5)}" cy="${f(Y + R * .14)}" rx="${f(R * .14)}" ry="${f(R * .08)}" fill="${BLUSH}" opacity=".55"/>`
    + `<ellipse cx="${f(X + R * .56)}" cy="${f(Y + R * .14)}" rx="${f(R * .14)}" ry="${f(R * .08)}" fill="${BLUSH}" opacity=".55"/>`;
  const path = (d, fill, w = .9) => `<path d="${d}" fill="${fill}" stroke="${INK}" stroke-width="${w}" stroke-linejoin="round"/>`;
  let s = '';
  // ---- ears and other bits behind the head
  if (k === 'bear' || k === 'pig'){ for (const sg of [-1, 1]){ const ex = X + sg * R * .62, ey = Y - R * .66, er = R * (k === 'pig' ? .26 : .3);
      s += k === 'pig' ? path(`M${f(ex - er)} ${f(ey + er * .6)}L${f(ex + sg * er * .2)} ${f(ey - er)}L${f(ex + er)} ${f(ey + er * .6)}Z`, dk)
        : circ(ex, ey, er, m.m) + circ(ex + er * .08, ey + er * .05, er * .55, lt) + circInk(ex, ey, er, .9); } }
  if (k === 'cat'){ for (const sg of [-1, 1]){ const bx = X + sg * R * .55, by = Y - R * .62;
      s += path(`M${f(bx - R * .26)} ${f(by + R * .12)}L${f(bx + sg * R * .08)} ${f(by - R * .42)}L${f(bx + R * .26)} ${f(by + R * .12)}Z`, m.m)
        + `<path d="M${f(bx - R * .12)} ${f(by + R * .04)}L${f(bx + sg * R * .05)} ${f(by - R * .24)}L${f(bx + R * .12)} ${f(by + R * .04)}Z" fill="${BLUSH}" opacity=".7"/>`; } }
  if (k === 'bunny'){ for (const sg of [-1, 1]){ const ex = X + sg * R * .32, ey = Y - R * 1.15, tilt = sg * 10;
      s += `<g transform="rotate(${tilt} ${f(ex)} ${f(ey + R * .45)})"><ellipse cx="${f(ex)}" cy="${f(ey)}" rx="${f(R * .2)}" ry="${f(R * .55)}" fill="${m.m}" stroke="${INK}" stroke-width=".9"/>`
        + `<ellipse cx="${f(ex)}" cy="${f(ey + R * .04)}" rx="${f(R * .09)}" ry="${f(R * .38)}" fill="${BLUSH}" opacity=".6"/></g>`; } }
  if (k === 'frog'){ for (const sg of [-1, 1]){ const ex = X + sg * R * .42, ey = Y - R * .78, er = R * .28;
      s += circ(ex, ey, er, m.m) + circInk(ex, ey, er, .9) + circ(ex, ey + er * .05, er * .62, '#ffffff') + eye(ex, ey + er * .1, er * .3); } }
  if (k === 'duck') s += `<path d="M${f(X - R * .05)} ${f(Y - R * .95)}q${f(R * .12)} ${f(-R * .28)} ${f(R * .26)} ${f(-R * .1)}M${f(X + R * .06)} ${f(Y - R * .97)}q${f(R * .2)} ${f(-R * .2)} ${f(R * .3)} ${f(.02 * R)}" fill="none" stroke="${INK}" stroke-width=".9" stroke-linecap="round"/>`;
  // ---- the head: matte fabric (no gloss), a soft lit side, a sewn seam over the crown
  s += circ(X, Y, R, m.m) + circ(X + .1 * R, Y - .12 * R, .84 * R, p.col);
  if (k === 'penguin') s += `<ellipse cx="${f(X + R * .05)}" cy="${f(Y + R * .14)}" rx="${f(R * .66)}" ry="${f(R * .6)}" fill="#fbf7ea"/>`;
  s += `<path d="M${f(X - R * .02)} ${f(Y - R * .98)}Q${f(X + R * .3)} ${f(Y - R * .3)} ${f(X + R * .06)} ${f(Y - R * .62)}" fill="none" stroke="${dk}" stroke-width=".5" stroke-dasharray="1.2 1.1" opacity=".7"/>`;
  // ---- faces
  const ey = Y - R * .06, exL = X - R * .3, exR = X + R * .36;
  if (k === 'bear'){
    s += `<ellipse cx="${f(X + R * .04)}" cy="${f(Y + R * .3)}" rx="${f(R * .34)}" ry="${f(R * .24)}" fill="${lt}" stroke="${INK}" stroke-width=".6"/>`;
    s += circ(X + R * .04, Y + R * .22, R * .1, INK) + eye(exL, ey) + eye(exR, ey);
  } else if (k === 'bunny' || k === 'cat'){
    s += eye(exL, ey) + eye(exR, ey) + blush();
    s += `<path d="M${f(X + R * .0)} ${f(Y + R * .14)}l${f(R * .05)} ${f(R * .06)}l${f(R * .05)} ${f(-R * .06)}Z" fill="${BLUSH}" stroke="${INK}" stroke-width=".4"/>`;
    s += `<path d="M${f(X - R * .04)} ${f(Y + R * .26)}q${f(R * .09)} ${f(R * .08)} ${f(R * .09)} 0q0 ${f(R * .08)} ${f(R * .09)} 0" fill="none" stroke="${INK}" stroke-width=".6" stroke-linecap="round"/>`;
    if (k === 'cat') for (const sg of [-1, 1]) for (const dy of [-.03, .07])
      s += `<path d="M${f(X + sg * R * .3 + R * .05)} ${f(Y + R * (.2 + dy))}l${f(sg * R * .34)} ${f(R * dy * 1.5)}" stroke="${INK}" stroke-width=".45" stroke-linecap="round"/>`;
  } else if (k === 'duck'){
    s += eye(exL, ey) + eye(exR, ey) + blush();
    s += `<ellipse cx="${f(X + R * .04)}" cy="${f(Y + R * .24)}" rx="${f(R * .3)}" ry="${f(R * .13)}" fill="#f08a2b" stroke="${INK}" stroke-width=".7"/>`
      + `<path d="M${f(X - R * .2)} ${f(Y + R * .24)}H${f(X + R * .28)}" stroke="${INK}" stroke-width=".45"/>`;
  } else if (k === 'frog'){
    s += blush() + `<path d="M${f(X - R * .38)} ${f(Y + R * .14)}Q${f(X + R * .04)} ${f(Y + R * .5)} ${f(X + R * .46)} ${f(Y + R * .14)}" fill="none" stroke="${INK}" stroke-width=".8" stroke-linecap="round"/>`;
  } else if (k === 'penguin'){
    s += eye(exL, ey, R * .08) + eye(exR, ey, R * .08) + blush();
    s += path(`M${f(X - R * .08)} ${f(Y + R * .1)}L${f(X + R * .2)} ${f(Y + R * .1)}L${f(X + R * .06)} ${f(Y + R * .3)}Z`, '#f08a2b', .6);
  } else if (k === 'pig'){
    s += eye(exL, ey - R * .04) + eye(exR, ey - R * .04) + blush();
    s += `<ellipse cx="${f(X + R * .04)}" cy="${f(Y + R * .24)}" rx="${f(R * .24)}" ry="${f(R * .16)}" fill="${lt}" stroke="${INK}" stroke-width=".7"/>`
      + circ(X - R * .05, Y + R * .24, R * .045, dk) + circ(X + R * .13, Y + R * .24, R * .045, dk);
  }
  if (spot) s += spot;
  s += `<ellipse cx="${f(X + R * .36)}" cy="${f(Y - R * .44)}" rx="${f(R * .26)}" ry="${f(R * .16)}" fill="#ffffff" opacity=".18"/>`;   // soft, not glossy
  s += circInk(X, Y, R, 1.1);
  return s;
}
// a prize's bounds (ears stick out above the head)
const ballB = p => { const r = p.r, t = plushTop[p.kind] || 1; return [[p.x - r * 1.05, p.y - r * 1.05, p.z - p.r], [p.x + r * 1.05, p.y + r * 1.05, p.z + r * t]]; };

/* ---------- the claw ---------- */
const FING = [45, 165, 285].map(a => a * Math.PI / 180);       // one finger points toward the viewer
function clawParts(cl){
  const parts = [], { x, y, z, o } = cl;
  const tipR = 1.5 + 8.5 * o, elR = 6.5 + 4.5 * o, tz = z - 13 + 2 * o;
  for (const a of FING){
    const u = [Math.cos(a), Math.sin(a)];
    const K = [x + 3 * u[0], y + 3 * u[1], z + .5], E = [x + elR * u[0], y + elR * u[1], z - 6], T = [x + tipR * u[0], y + tipR * u[1], tz];
    const svg = rod(K, E, 1.35, STEELM, toneI, 1.1) + rod(E, T, 1.2, STEELM, toneI, 1.1);
    const fp = [K, E, T], lo = k => Math.min(...fp.map(p => p[k])) - 1.4, hi = k => Math.max(...fp.map(p => p[k])) + 1.4;
    parts.push({ at:[x + 6 * u[0], y + 6 * u[1], z - 13], box:[[lo(0), lo(1), lo(2)], [hi(0), hi(1), hi(2)]], svg });
  }
  // cable from the carriage + the hub
  const cab = pd([[x, y, z + 5], [x, y, 136]], false);
  let hub = `<path d="${cab}" fill="none" stroke="${INK}" stroke-width="1.7" stroke-linecap="round"/><path d="${cab}" fill="none" stroke="${METAL.m}" stroke-width=".6"/>`;
  hub += cyl(x, y, z, z + 5, 3.6, STEELM, toneI, 1.1, 18);
  hub += cyl(x, y, z + 5, z + 6.2, 1.6, DARK, toneI, .8, 12);
  parts.push({ at:[x, y, z + 3], box:[[x - 3.6, y - 3.6, z], [x + 3.6, y + 3.6, 136]], svg: hub });
  return parts;
}

/* ---------- state ---------- */
function fresh(){
  return { tokens:10, credit:0, won:0, phase:'idle', pt:0, time:0,
    claw:{ x:HOME[0], y:HOME[1], z:ZTOP, o:0 }, drop:null, held:null,
    prizes:layout(), falls:[], bayIn:[], bay:[], flap:0, flapT:0, take:null, coin:null,
    tilt:[0, 0], tiltDir:[0, 0], tiltHold:0, step:null, btn:0, msg:null, msgT:0, t:0 };
}
const st = Object.assign({ pal:'blush' }, fresh());
const keys = {};

/* ---------- scene ---------- */
const ellZ = (x, y, z, r, n = 18) => on(PZ(z), ellUV(x, y, r, r, n));
// screen-space convex clip of a set of 3D points (follows the camera)
const clipHull = (pts3, inner) => { const id = 'k' + (++_clipN); return `<clipPath id="${id}"><path d="${sp(hull(pts3.map(p => P(...p))))}"/></clipPath><g clip-path="url(#${id})">${inner}</g>`; };
// the four walls of the glass section: x = 0 and y = 0 are printed panels, x = W and y = D are glass
const WALLS = [
  { n:[-1,0,0], glass:false, pts:[[0,0,HB],[0,D,HB],[0,D,HG],[0,0,HG]] },
  { n:[0,-1,0], glass:false, pts:[[0,0,HB],[W,0,HB],[W,0,HG],[0,0,HG]] },
  { n:[1,0,0],  glass:true,  pts:[[W,0,HB],[W,D,HB],[W,D,HG],[W,0,HG]] },
  { n:[0,1,0],  glass:true,  pts:[[0,D,HB],[W,D,HB],[W,D,HG],[0,D,HG]] },
];
function glassTintWall(n, k){
  let s = '';
  if (n[0] === 1){
    s += fill(pd(on(PX(W), rectUV(0, HB, D, HG))), ACRYL, `opacity="${.14 * k}"`);
    s += fill(pd(on(PX(W), [[30,HB+4],[37,HB+4],[60,HG-4],[53,HG-4]])), '#ffffff', `opacity="${.3 * k}"`);
    s += fill(pd(on(PX(W), [[41,HB+4],[44,HB+4],[67,HG-4],[64,HG-4]])), '#ffffff', `opacity="${.3 * k}"`);
  } else {
    s += fill(pd(on(PY(D), rectUV(0, HB, W, HG))), ACRYL, `opacity="${.2 * k}"`);
    s += fill(pd(on(PY(D), [[22,HB+4],[29,HB+4],[47,HG-4],[40,HG-4]])), '#ffffff', `opacity="${.28 * k}"`);
  }
  return s;
}
function glassBox(m){
  const cl = st.claw;
  let s = '';
  // far walls: the printed panels show their inside, far glass only a faint tint
  const backC = mix(m.l, '#ffffff', .55), rightC = mix(m.m, '#ffffff', .45);
  for (const w of WALLS) if (!vis(w.n)){
    if (w.glass) s += glassTintWall(w.n, .5);
    else {
      s += fill(pd(w.pts), w.n[0] ? backC : rightC);
      // a light strip under the roof on the back wall: the light inside the cabinet
      if (w.n[0]) s += shape([[.2, 8, HG - 9],[.2, D - 8, HG - 9],[.2, D - 8, HG - 5],[.2, 8, HG - 5]], '#fffbea', .8);
    }
  }
  if (!vis([-1,0,0]) && !vis([0,-1,0])) s += line([[0,0,HB],[0,0,HG]], .8);
  s += fill(pd([[0,0,HB],[W,0,HB],[W,D,HB],[0,D,HB]]), mix(m.d, '#ffffff', .62));
  // claw's shadow straight down from the lamp, on the floor
  s += fill(pd(ellZ(cl.x, cl.y, HB + .1, 5)), '#1c2948', 'opacity=".16"');

  const parts = [];
  // chute: hole + far acrylic walls + whatever is falling inside it, then the near acrylic walls as their own parts
  let ch = shape([[CHX,0,HB+.1],[W,0,HB+.1],[W,CHY,HB+.1],[CHX,CHY,HB+.1]], '#2b2522', 1);
  if (vis([1,0,0])) ch += fill(pd([[CHX,0,HB+.1],[CHX,CHY,HB+.1],[CHX+3,CHY,HB-3],[CHX+3,0,HB-3]]), '#4a403a');
  if (vis([0,-1,0])) ch += fill(pd([[CHX,CHY,HB+.1],[W,CHY,HB+.1],[W,CHY-3,HB-3],[CHX,CHY-3,HB-3]]), '#4a403a');
  const wx = [[CHX,CHY,CHT],[CHX,0,CHT],[CHX,0,HB],[CHX,CHY,HB]], wy = [[CHX,CHY,HB],[W,CHY,HB],[W,CHY,CHT],[CHX,CHY,CHT]];
  const wallX = () => fill(pd(wx), ACRYL, 'opacity=".42"') + ink(pd([[CHX,0,CHT],[CHX,CHY,CHT],[CHX,CHY,HB]], false), 1);
  const wallY = () => fill(pd(wy), ACRYL, 'opacity=".38"') + fill(pd([[CHX+5,CHY,HB+3],[CHX+9,CHY,HB+3],[CHX+16,CHY,CHT-3],[CHX+12,CHY,CHT-3]]), '#ffffff', 'opacity=".4"')
    + ink(pd(wy), 1.1) + line([[CHX,CHY,CHT],[W,CHY,CHT]], 1.4);
  const nearX = vis([-1,0,0]), nearY = vis([0,1,0]);
  if (!nearX) ch += wallX();
  if (!nearY) ch += wallY();
  const col = [[CHX,0,HB],[W,0,HB],[W,CHY,HB],[CHX,CHY,HB],[CHX,CHY,HG],[CHX,0,HG],[W,0,HG],[W,CHY,HG]];
  const colHull = hull(col.map(p => P(...p)));
  let inChute = '';
  for (const fl of st.falls) if (fl.mode === 'chute' && fl.delay <= 0) inChute += orb({ ...fl.p, x:fl.x, y:fl.y, z:fl.z });
  if (inChute) ch += `<clipPath id="cChute"><path d="${sp(colHull)}"/></clipPath><g clip-path="url(#cChute)">${inChute}</g>`;
  // the chute is one block in the corner: hole + far walls + what falls inside, then its near walls
  const chuteSvg = ch + (nearX ? wallX() : '') + (nearY ? wallY() : '');
  const CHB = [[CHX, 0, HB - 3], [W, CHY, CHT]];

  // the pile
  const aim = st.phase === 'play' || st.phase === 'ready';
  for (const p of st.prizes){
    let spot = '';
    const d = Math.hypot(p.x - cl.x, p.y - cl.y);
    if (d < p.r * .92){
      const zs = p.z + Math.sqrt(p.r * p.r - d * d);
      const [X, Y] = P(p.x, p.y, p.z);
      spot = `<clipPath id="sp${p.id}"><circle cx="${f(X)}" cy="${f(Y)}" r="${f(p.r * 1.2247)}"/></clipPath>` +
             `<g clip-path="url(#sp${p.id})">${fill(pd(ellZ(cl.x, cl.y, zs, 2.6, 14)), '#1c2948', `opacity="${aim ? .28 : .16}"`)}</g>`;
    }
    parts.push({ at:[p.x, p.y, p.z], sb: ballB(p), svg: orb(p, spot) });
  }
  for (const fl of st.falls) if (fl.mode === 'floor' && fl.delay <= 0){ const q = { ...fl.p, x:fl.x, y:fl.y, z:fl.z }; parts.push({ at:[fl.x, fl.y, fl.z], sb: ballB(q), svg: orb(q) }); }
  if (st.held){ const p = st.held.p; parts.push({ at:[p.x, p.y, p.z], sb: ballB(p), svg: orb(p) }); }
  for (const c of clawParts(cl)) parts.push({ ...c, sb: c.box });
  // prizes and claw sort among themselves by centre (touching spheres); the chute block then goes in right after the
  // last part that lies wholly behind it (every prize is wholly on one side of it, so this is exact)
  const order = parts.filter(Boolean).sort((p, q) => sepOrder(p, q) || depthOf(p.at || boxMid(p.box)) - depthOf(q.at || boxMid(q.box)));
  const behind = q => { const b = q.sb; if (!b) return depthOf(q.at) < depthOf(boxMid(CHB));
    for (let k = 0; k < 3; k++){ if (b[1][k] <= CHB[0][k] + 1e-6) return CAM_V[k] >= 0; if (CHB[1][k] <= b[0][k] + 1e-6) return CAM_V[k] < 0; }
    return depthOf(q.at || boxMid(b)) < depthOf(boxMid(CHB)); };
  let cut = -1; order.forEach((q, i) => { if (behind(q)) cut = i; });
  s += order.slice(0, cut + 1).map(q => q.svg).join('') + chuteSvg + order.slice(cut + 1).map(q => q.svg).join('');

  // gantry (above everything else inside): two rails run front to back between the end walls, each hung from the
  // roof frame by a bracket at either end; the bridge rides on them, the carriage hangs under the bridge
  const gp = [];
  for (const [y0, y1] of [[3, 6], [D - 6, D - 3]]){
    gp.push({ box:[[0, y0, 141], [W, y1, 144]], svg: box(0, y0, 141, W, y1, 144, DARK, toneI, .9) });
    for (const [x0, x1] of [[0, 4], [W - 4, W]])
      gp.push({ box:[[x0, y0, 144], [x1, y1, HG]], svg: box(x0, y0, 144, x1, y1, HG, DARK, toneI, .8) });
  }
  gp.push({ box:[[cl.x - 5, cl.y - 4, 136], [cl.x + 5, cl.y + 4, 144]], svg: box(cl.x - 5, cl.y - 4, 136, cl.x + 5, cl.y + 4, 144, METAL, toneI, 1) });   // y ±4: clears the rails at the edge
  gp.push({ box:[[cl.x - 3, 2, 144], [cl.x + 3, D - 2, 147.5]], svg: box(cl.x - 3, 2, 144, cl.x + 3, D - 2, 147.5, matOf('#7d8689'), toneI, 1) });
  s += byDepth(gp);

  // near walls: the printed panels show their outside and hide what is behind them
  let near = '';
  for (const w of WALLS) if (vis(w.n) && !w.glass) near += shape(w.pts, tone(w.n, m), 1.1);
  if (vis([-1,0,0]) && vis([0,-1,0])) near += line([[0,0,HB],[0,0,HG]], 1.1);
  s += near;
  const out = clipHull([[0,0,HB],[W,0,HB],[W,D,HB],[0,D,HB],[0,0,HG],[W,0,HG],[W,D,HG],[0,D,HG]], s);
  // near glass, then the corner posts that frame it (far posts first, behind the glass)
  let tint = '';
  for (const w of WALLS) if (vis(w.n) && w.glass) tint += glassTintWall(w.n, 1);
  const posts = [[0, D - 3, 0, D], [W - 3, 0, W, 3], [W - 3, D - 3, W, D]].map(([x0, y0, x1, y1]) =>
    ({ at:[(x0 + x1) / 2, (y0 + y1) / 2, (HB + HG) / 2], svg: box(x0, y0, HB, x1, y1, HG, m, tone, x0 && y0 ? 1.1 : 1) }));
  const mid = depthOf([W / 2, D / 2, (HB + HG) / 2]);
  const farP = posts.filter(q => depthOf(q.at) < mid - 1), nearP = posts.filter(q => depthOf(q.at) >= mid - 1);
  return byDepth(farP) + out + `<g pointer-events="none">${tint}</g>` + byDepth(nearP);
}

function roofTop(m){

  const x0 = 12, x1 = W - 5, y0 = 5, y1 = D - 5;

function roof(m){

  for (const [n, q] of [[[1,0,0], on(PX(W), rectUV(0, HG, D, HR))], [[0,1,0], on(PY(D), rectUV(0, HG, W, HR))],

function marquee(m){
  let s = extrude(CREST, 0, 10, m);
  if (!vis([1,0,0])){                                    // from behind: the plain back of the sign
    s += shape(on(PX(0), CREST), tone([-1,0,0], m), 1.6);
    s += hullInk([...on(PX(0), CREST), ...on(PX(10), CREST)], 2.4);
    return s;
  }
  s += shape(on(PX(10), CREST), tone([1,0,0], m), 1.6);
  s += shape(on(PX(10.3), rrUV(9, HR + 4.5, D - 9, HC - 4.5, 4)), '#fff4d6', 1.3);
  s += tx(10.4, D / 2, HR + 10.2, 'LUCKY CLAW', 10, '#e2483d', 800);
  // bulbs round the sign: chase while a game runs, all lit when idle
  const bulbs = [];
  for (let i = 0; i < 8; i++) bulbs.push([12 + i * (D - 24) / 7, HC - 2.4]);
  bulbs.push([6, (HR + HC) / 2]);
  for (let i = 7; i >= 0; i--) bulbs.push([12 + i * (D - 24) / 7, HR + 2.3]);
  bulbs.push([D - 6, (HR + HC) / 2]);
  const chase = st.phase !== 'idle', k = Math.floor(st.t * 8);
  bulbs.forEach(([y, z], i) => {
    const lit = chase ? (i + k) % 3 === 0 : true;
    s += shape(on(PX(10.4), ellUV(y, z, 1.6, 1.6, 12)), lit ? '#ffe066' : '#e3d6b4', .8);
    if (lit) s += fill(pd(on(PX(10.5), ellUV(y + .5, z + .5, .6, .6, 8))), '#ffffff');
  });
  s += hullInk([...on(PX(0), CREST), ...on(PX(10), CREST)], 2.4);
  return s;
}

function displayLines(){
  if (st.msgT > 0 && st.msg) return st.msg;
  if (st.phase === 'ready') return ['CREDIT', String(st.credit)];
  if (st.phase === 'play') return [st.credit ? `TIME  CR${st.credit}` : 'TIME', String(Math.ceil(st.time)).padStart(2, '0')];
  if (DROP_PH.includes(st.phase)) return ['GOOD', 'LUCK'];
  return st.credit ? ['CREDIT', String(st.credit)] : ['INSERT', 'COIN'];
}

const DOOR_MAT = { l:'#55504a', m:'#3d3935', d:'#272421' };
function flapSvg(){
  const th = ease(st.flap) * 78 * Math.PI / 180;
  const y0 = BAY[0] + 1, y1 = BAY[2] - 1, len = BAY[3] - BAY[1] - 1.5, t = 1.6, hx = W - .4, hz = BAY[1];
  const up = [Math.sin(th), 0, Math.cos(th)], out = [Math.cos(th), 0, -Math.sin(th)];
  const Q = (a, w, y) => [hx + a * up[0] - w * out[0], y, hz + a * up[2] - w * out[2]];
  const faces = [
    { n: out, p: [Q(0,0,y0),Q(0,0,y1),Q(len,0,y1),Q(len,0,y0)], clear:true },
    { n: up,  p: [Q(len,0,y0),Q(len,0,y1),Q(len,t,y1),Q(len,t,y0)] },
    { n: [0,1,0], p: [Q(0,0,y1),Q(len,0,y1),Q(len,t,y1),Q(0,t,y1)] },
    { n: [0,-1,0], p: [Q(0,0,y0),Q(len,0,y0),Q(len,t,y0),Q(0,t,y0)] },
    { n: out.map(v => -v), p: [Q(0,t,y0),Q(0,t,y1),Q(len,t,y1),Q(len,t,y0)], clear:true },   // inner face: shows when the flap tips open
  ];
  let s = '';
  for (const fc of faces) if (vis(fc.n))
    s += fc.clear ? fill(pd(fc.p), DOOR_MAT.m, 'fill-opacity=".3"') + ink(pd(fc.p), 1.1) : shape(fc.p, tone(fc.n, DOOR_MAT), 1);
  s += fill(pd([Q(len*.2,-.1,y0+5),Q(len*.2,-.1,y0+10),Q(len*.85,-.1,y0+21),Q(len*.85,-.1,y0+16)]), '#ffffff', 'opacity=".3"');
  const yc = (y0 + y1) / 2;
  s += shape([Q(len-3,-.1,yc-8),Q(len-3,-.1,yc+8),Q(len-1.3,-.1,yc+8),Q(len-1.3,-.1,yc-8)], DOOR_MAT.d, .8);
  s += ink(pd([[hx, y0 - .5, hz], [hx, y1 + .5, hz]], false), 1.6);
  return s;
}
const BAY_SLOTS = [[W - 8, 19], [W - 9.5, 10.5], [W - 9.5, 27.5]];
const baySpot = i => { const [x, y] = BAY_SLOTS[i % 3]; return [x, y, BAY[1] + 7 + Math.floor(i / 3) * 6]; };

function base(m){
  let s = '';
  const bayR = rectUV(BAY[0], BAY[1], BAY[2], BAY[3]);
  const sm = tone([0,1,0], m), tc = sm === m.l ? m.m : mix(sm, '#000000', .25);
  if (!vis([1,0,0])){                                    // seen from behind: plain back panel, no front details
    s += extrude(BASE, 0, W, m);
    s += shape(on(PX(0), BASE), tone([-1,0,0], m), 0);
    if (vis([-1,0,0])){                                  // the back: a locked service door and vent louvres
      const bk = tone([-1,0,0], m), B = PX(-.2);
      s += shape(on(B, rrUV(16, 8, D - 16, 56, 3)), mix(bk, '#000000', .07), 1.1);
      s += shape(on(PX(-.3), ellUV(D - 22, 32, 1.6, 1.6, 12)), METAL.l, .8) + line([[-.4, D - 22, 31.2], [-.4, D - 22, 32.8]], .7);
      for (let i = 0; i < 4; i++) s += shape(on(B, rrUV(24, 61 + i * 4, D - 24, 63 + i * 4, .8)), mix(bk, '#000000', .45), .6);
    }
    if (vis([0,1,0])){
      s += shape(on(PY(D + .2), rrUV(12, 16, W - 12, 60, 6)), mix(sm, '#ffffff', .16), 1.2);
      s += txY(W / 2, D + .3, 33, 'PRIZES', 11, tc, 800);
    }
    s += ink(pd(on(PX(0), BASE)), 2);
    return s;
  }
  // pickup bay cavity and what is in it
  let cav = shape(on(PX(BAY_X), bayR), m.d, 0);
  const sideY = vis([0,1,0]) ? BAY[0] : BAY[2];          // the cavity's side wall that faces the viewer
  cav += face(pd([[BAY_X,sideY,BAY[1]],[W,sideY,BAY[1]],[W,sideY,BAY[3]],[BAY_X,sideY,BAY[3]]]), mix(m.d, '#000000', .25));
  cav += face(pd([[BAY_X,BAY[0],BAY[1]],[W,BAY[0],BAY[1]],[W,BAY[2],BAY[1]],[BAY_X,BAY[2],BAY[1]]]), mix(m.d, '#ffffff', .14));
  const inBay = [];
  st.bay.forEach((p, i) => { if (st.take) return; const [x, y, z] = baySpot(i); inBay.push({ at:[x, y, z], svg: orb({ ...p, x, y, z }) }); });
  for (const b of st.bayIn) if (b.t >= 0) inBay.push({ at:[b.x, b.y, b.z], svg: orb({ ...b.p, x:b.x, y:b.y, z:b.z }) });
  cav += byDepth(inBay);
  s += act('take', clipTo(on(PX(W), bayR), fill(pd(on(PX(W), bayR)), 'transparent') + cav));
  // front face with the bay hole
  s += `<path d="${pd(on(PX(W), BASE))}${pd(on(PX(W), bayR))}" fill="${tone([1,0,0], m)}" fill-rule="evenodd"/>`;
  s += ink(pd(on(PX(W), bayR)), 1.6);
  // (the flap is drawn by scene(), after the cabinet's silhouette ink: open, it sticks out past the outline)
  // display
  const F = PX(W + .3);
  s += shape(on(F, rrUV(DISP[0], DISP[1], DISP[2], DISP[3], 2.5)), '#1d2a26', 1.3);
  const [l1, l2] = displayLines(), cy = (DISP[0] + DISP[2]) / 2;
  s += tx(W + .4, cy, DISP[1] + 10.4, l1, 3.9, '#8af0ae', 700);
  s += tx(W + .4, cy, DISP[1] + 2.6, l2, 6.2, '#8af0ae', 800);
  // coin box door (where the tokens end up) with its lock
  s += shape(on(F, rrUV(46, 12, 74, 30, 2)), mix(tone([1,0,0], m), '#000000', .07), 1.1);
  s += shape(on(PX(W + .4), ellUV(69, 21, 1.6, 1.6, 12)), METAL.l, .8) + line([[W + .5, 69, 20.2], [W + .5, 69, 21.8]], .7);
  // body + side decal
  s += extrude(BASE, 0, W, m);
  if (vis([0,1,0])){
    s += shape(on(PY(D + .2), rrUV(12, 16, W - 12, 60, 6)), mix(sm, '#ffffff', .16), 1.2);
    s += txY(W / 2, D + .3, 33, 'PRIZES', 11, tc, 800);
  }
  s += ink(pd(on(PX(W), BASE)), 2);
  return s;
}

function coinDisc(x, y, z, r = 3){
  const A = ellZ(x, y, z, r, 18), B = ellZ(x, y, z + 1, r, 18);
  return loft(A, B, n => toneI(n, COINM)) + fill(pd(B), COINM.l) + ink(sp(hull([...A, ...B].map(p => P(...p)))), .7);
}
function coinStanding(x, y, z){
  const A = on(PY(y - .6), ellUV(x, z, 2.8, 2.8, 16)), B = on(PY(y + .6), ellUV(x, z, 2.8, 2.8, 16));
  const yc = vis([0,1,0]) ? y + .6 : y - .6, cap = vis([0,1,0]) ? B : A;
  return loft(A, B, n => toneI(n, COINM)) + fill(pd(cap), COINM.l) + ink(pd(cap), .8) + ink(pd(on(PY(yc + Math.sign(yc - y) * .05), ellUV(x, z, 1.7, 1.7, 12))), .5);
}

function ledge(m){
  let s = box(W, 1, LZ0, W + LX, D - 1, LZ1, m, tone, 1.1);
  s += shape(on(PZ(LZ1 + .05), rrUV(W + 1.6, 3.5, W + LX - 1.6, D - 3.5, 2)), '#fbf7ea', 1);
  if (vis([1,0,0])) s += shape(on(PX(W + LX + .1), rectUV(4, LZ0 + 3.6, D - 4, LZ0 + 6.4)), mix(m.l, '#ffffff', .3), .8);
  // the ledge's silhouette, under the things that stand on it (it used to cut across the token stack from behind)
  s += hullInk([...on(PX(W), rectUV(1, LZ0, D - 1, LZ1)), ...on(PX(W + LX), rectUV(1, LZ0, D - 1, LZ1))], 2.2);
  const Z = LZ1 + .1;
  const parts = [];
  // token stack
  let stack = '';
  for (let i = 0; i < st.tokens; i++) stack += coinDisc(STACK[0], STACK[1], Z + i * 1.15);
  if (!st.tokens) stack += fill(pd(ellZ(STACK[0], STACK[1], Z, 3)), '#e9e3d3') + ink(pd(ellZ(STACK[0], STACK[1], Z, 3)), .5);
  parts.push({ at:[STACK[0], STACK[1], Z], box:[[STACK[0] - 3, STACK[1] - 3, Z], [STACK[0] + 3, STACK[1] + 3, Z + 12]], svg: act('coin', stack) });
  // coin slot plate
  let slot = shape(on(PZ(Z), rrUV(SLOT[0] - 4.5, SLOT[1] - 4.5, SLOT[0] + 4.5, SLOT[1] + 4.5, 1.5)), METAL.l, 1);
  slot += shape(on(PZ(Z + .05), rectUV(SLOT[0] - 3.5, SLOT[1] - .6, SLOT[0] + 3.5, SLOT[1] + .6)), '#26231f', .5);
  parts.push({ at:[SLOT[0], SLOT[1], Z - 1], box:[[SLOT[0] - 4.5, SLOT[1] - 4.5, Z], [SLOT[0] + 4.5, SLOT[1] + 4.5, Z + .1]], svg: act('coin', slot) });
  // drop button: bezel + big red cap that sinks when pressed
  const down = st.btn > 0, bh = down ? 1.2 : 3.4;
  let b = fill(pd(ellZ(BTN[0], BTN[1], Z, 7.2, 28)), METAL.m) + ink(pd(ellZ(BTN[0], BTN[1], Z, 7.2, 28)), 1);
  b += cyl(BTN[0], BTN[1], Z, Z + bh, 5.6, REDM, toneI, 1.2, 28);
  b += fill(pd(ellZ(BTN[0] + 1.6, BTN[1] - 1.2, Z + bh + .05, 2, 12)), mix(REDM.l, '#ffffff', .35));
  parts.push({ at:[BTN[0], BTN[1], Z], box:[[BTN[0] - 7.2, BTN[1] - 7.2, Z], [BTN[0] + 7.2, BTN[1] + 7.2, Z + 3.5]], svg: act('drop', b) });
  // joystick: base, shaft, ball; tilts the way it is pushed
  const [jx, jy] = JOY, [tx0, ty0] = st.tilt;
  let j = '';
  for (const [dx, dy] of [[1,0],[-1,0],[0,1],[0,-1]]){
    const c = [jx + dx * 6.2, jy + dy * 6.2], q = [-dy, dx];
    j += fill(pd([[c[0] + dx * 1.6, c[1] + dy * 1.6, Z], [c[0] + q[0] * 1.3, c[1] + q[1] * 1.3, Z], [c[0] - q[0] * 1.3, c[1] - q[1] * 1.3, Z]]), '#b8b1a0');
  }
  j += cyl(jx, jy, Z, Z + 1.6, 4, DARK, toneI, 1, 20);
  const top = [jx + tx0 * 4.2, jy + ty0 * 4.2, Z + 12.5];
  j += rod([jx, jy, Z + 1.6], top, .85, METAL, toneI, .9);
  const [bx, by] = P(...top), br = 3.4 * 1.2247;
  j += circ(bx, by, br, DARK.m) + circ(bx + br * .14, by - br * .16, br * .78, DARK.l) + `<ellipse cx="${f(bx + br * .36)}" cy="${f(by - br * .42)}" rx="${f(br * .22)}" ry="${f(br * .14)}" fill="#ffffff" opacity=".55"/>` + circInk(bx, by, br, 1.1);
  // invisible push zones round the stick
  const zones = [[1,0],[0,1],[-1,0],[0,-1]].map(([dx, dy]) => {
    const a0 = Math.atan2(dy, dx) - Math.PI / 4, pts = [[jx, jy, Z + 6]];
    for (let i = 0; i <= 6; i++){ const a = a0 + i / 6 * Math.PI / 2; pts.push([jx + 10 * Math.cos(a), jy + 10 * Math.sin(a), Z + 6]); }
    return `<path d="${pd(pts)}" fill="transparent" data-act="stick" data-dx="${dx}" data-dy="${dy}"/>`;
  }).join('');
  parts.push({ at:[jx, jy, Z], box:[[jx - 7.8, jy - 7.8, Z], [jx + 7.8, jy + 7.8, Z + 16]], svg: j + zones });
  // a token on its way into the slot
  if (st.coin != null){
    const k = st.coin;
    let cx = SLOT[0], cy, cz;
    if (k < .6){ const q = ease(k / .6); cy = STACK[1] + (SLOT[1] - STACK[1]) * q; cz = Z + st.tokens * 1.15 + 4 + (Z + 8 - (Z + st.tokens * 1.15 + 4)) * q + 7 * Math.sin(Math.PI * q); }
    else { cy = SLOT[1]; cz = Z + 8 - 13 * ((k - .6) / .4) ** 1.6; }
    let c = coinStanding(cx, cy, cz);
    if (cz - 2.8 < Z) c = clipTo([[SLOT[0] - 3.5, SLOT[1], Z], [SLOT[0] + 3.5, SLOT[1], Z], [SLOT[0] + 3.5, SLOT[1], Z + 30], [SLOT[0] - 3.5, SLOT[1], Z + 30]], c);
    parts.push({ at:[cx, cy, Z + 9], svg: c });
  }
  s += byDepth(parts);
  return s;
}

function scene(st, m){
  let s = '';
  s += castShadow([...on(PX(0), BASE), ...on(PX(W + LX), rectUV(1, 0, D - 1, LZ1)),
    [0,0,HR],[W,0,HR],[W,D,HR],[0,D,HR], ...on(PX(0), CREST), ...on(PX(10), CREST)]);
  // everything on the front (ledge, prizes being taken out) lies beyond the plane x = W:
  // in front of the cabinet when the front faces the viewer, hidden behind it otherwise
  let front = '';

  if (st.take){

    st.take.ps.forEach((p, i) => { const [x, y, z] = baySpot(i);
      front += `<g opacity="${f(1 - Math.max(0, (st.take.t - .55) / .45))}">${orb({ ...p, x: x + 22 * k, y, z: z + 16 * k })}</g>`; });

  s += base(m);
  s += glassBox(m);
  s += roofTop(m);
  s += roof(m);

  s += hullInk([...on(PX(0), BASE), ...on(PX(W), BASE), [0,0,HR],[W,0,HR],[W,D,HR],[0,D,HR]], 2.8);

/* ---------- behaviour ---------- */
let ui, looping = false;
function kick(){
  if (looping) return; looping = true;
  ui.animate(dt => { update(dt); const more = active(); if (!more) looping = false; return more; });
}
const anyKey = () => keys.ArrowUp || keys.ArrowDown || keys.ArrowLeft || keys.ArrowRight;
const active = () => st.phase !== 'idle' || st.coin != null || st.falls.length || st.bayIn.length || st.take || st.flap !== st.flapT
  || st.btn > 0 || st.msgT > 0 || st.tiltHold > 0 || anyKey() || Math.abs(st.tilt[0]) + Math.abs(st.tilt[1]) > .01 || st.step || st.credit > 0 && st.phase === 'idle';
const say = (l1, l2, t = 2.4) => { st.msg = [l1, l2]; st.msgT = t; };
const clampX = x => Math.max(10, Math.min(W - 10, x)), clampY = y => Math.max(10, Math.min(D - 10, y));

function findSpot(x, y, r){
  const ok = (a, b) => a >= 2 + r && a <= W - 2 - r && b >= 2 + r && b <= D - 2 - r && !(a > W - 34 && b < 34)
    && st.prizes.every(q => Math.hypot(q.x - a, q.y - b) >= q.r + r - 1)
    && st.falls.every(fl => Math.hypot(fl.tx - a, fl.ty - b) >= fl.p.r + r - 1);
  for (let rad = 0; rad <= 40; rad += 2.5)
    for (let i = 0; i < 16; i++){ const a = x + rad * Math.cos(i / 16 * 2 * Math.PI), b = y + rad * Math.sin(i / 16 * 2 * Math.PI); if (ok(a, b)) return [a, b, HB + r, 0]; }
  return [clampX(Math.min(x, W - 36)), y, HB + r + 8, 1];
}
function removePrize(p){
  st.prizes = st.prizes.filter(q => q !== p);
  if (p.layer !== 0) return;
  // a prize resting on it rolls down into the gap
  const top = st.prizes.find(q => q.layer === 1 && Math.hypot(q.x - p.x, q.y - p.y) < 13);
  if (!top) return;
  st.prizes = st.prizes.filter(q => q !== top);
  st.falls.push({ p:{ ...top, layer:0 }, x:top.x, y:top.y, z:top.z, vz:0, tx:p.x, ty:p.y, tz:HB + top.r, mode:'floor', delay:.7 });
}
const overHole = (x, y) => x > CHX + 2 && y < CHY - 2;
function dropHeld(){
  const h = st.held; if (!h) return;
  const p = h.p; st.held = null;
  if (overHole(p.x, p.y)){ st.falls.push({ p, x:p.x, y:p.y, z:p.z, vz:0, tx:p.x, ty:p.y, tz:-99, mode:'chute', delay:0 }); say('YOU WIN', 'TAKE IT', 3.2); return true; }
  const [tx, ty, tz, layer] = findSpot(p.x, p.y, p.r);
  p.layer = layer;
  st.falls.push({ p, x:p.x, y:p.y, z:p.z, vz:0, tx, ty, tz, mode:'floor', delay:0 });
  return false;
}

function startDrop(){
  const cl = st.claw;
  st.phase = 'lower'; st.pt = 0; st.step = null;
  const near = st.prizes.map(p => ({ p, d: Math.hypot(p.x - cl.x, p.y - cl.y) }));
  const under = near.filter(o => o.d < 9).sort((a, b) => b.p.z - a.p.z)[0];
  const side = near.filter(o => o.d < 11.5).sort((a, b) => b.p.z - a.p.z)[0];
  let tips = HB + 2.5;
  if (cl.x > CHX - 6 && cl.y < CHY + 6) tips = CHT + 3;           // the claw stops at the chute's rim
  else if (under) tips = under.p.z - 2.5;
  else if (side) tips = side.p.z + 3.5;
  st.drop = { stop: Math.min(ZTOP, tips + 13 - 2), c: under && tips === under.p.z - 2.5 ? under.p : null, d: under ? under.d : 99 };
}

function update(dt){
  st.t += dt;
  if (st.btn > 0) st.btn -= dt;
  if (st.msgT > 0) st.msgT -= dt;

  if (st.coin != null){ st.coin += dt / .75; if (st.coin >= 1){ st.coin = null; st.credit++; } }

  // joystick: buttons push it for a moment, arrow keys hold it
  let dir = [0, 0];
  const kx = (keys.ArrowDown ? 1 : 0) - (keys.ArrowUp ? 1 : 0), ky = (keys.ArrowLeft ? 1 : 0) - (keys.ArrowRight ? 1 : 0);
  if (st.step) dir = st.step.dir; else if (kx || ky) dir = [kx, ky]; else if (st.tiltHold > 0) dir = st.tiltDir;
  const lk = Math.min(1, dt * 16);
  st.tilt = [st.tilt[0] + (dir[0] - st.tilt[0]) * lk, st.tilt[1] + (dir[1] - st.tilt[1]) * lk];
  if (!(dir[0] || dir[1]) && Math.abs(st.tilt[0]) + Math.abs(st.tilt[1]) < .01) st.tilt = [0, 0];

  st.pt += dt;
  switch (st.phase){
    case 'ready':
      if (st.pt >= .9){ st.credit--; st.phase = 'play'; st.pt = 0; st.time = GAME_T; }
      break;
    case 'play': {
      if (st.step){
        const mv = Math.min(st.step.rem, SPEED * dt);
        cl.x = clampX(cl.x + st.step.dir[0] * mv); cl.y = clampY(cl.y + st.step.dir[1] * mv);
        st.step.rem -= mv; if (st.step.rem <= 1e-6) st.step = null;
      } else if (kx || ky){
        const n = Math.hypot(kx, ky);
        cl.x = clampX(cl.x + kx / n * SPEED * dt); cl.y = clampY(cl.y + ky / n * SPEED * dt);
      }
      st.time -= dt;
      if (st.time <= 0){ st.time = 0; startDrop(); }
      break;
    }
    case 'lower':
      cl.o = Math.min(1, st.pt / .35);
      cl.z = Math.max(dr.stop, cl.z - 42 * dt);
      if (cl.z <= dr.stop && st.pt > .35){
        st.phase = 'close'; st.pt = 0;
        const p = dr.c;
        if (p && dr.d < 9){ dr.grip = dr.d < 4.5 ? 'hold' : 'slip'; dr.oEnd = Math.max(0, (p.r * (dr.grip === 'hold' ? .72 : .98) - 1.5) / 8.5); dr.px = p.x; dr.py = p.y; }
        else { dr.grip = 'miss'; dr.oEnd = 0; }

      if (dr.grip === 'hold'){ const p = dr.c; p.x = dr.px + (cl.x - dr.px) * .7 * ease(k); p.y = dr.py + (cl.y - dr.py) * .7 * ease(k); }
      if (k >= 1){

          dr.slipT = dr.grip === 'slip' ? .35 + 2.4 * (9 - dr.d) / 4.5 : 1e9;
        }
        st.phase = 'lift'; st.pt = 0; dr.z0 = cl.z;
      }
      break;
    }
    case 'lift': case 'carry': {

        const k = Math.min(1, st.pt / 1.1); cl.z = dr.z0 + (ZTOP - dr.z0) * ease(k);

      } else {
        const k = Math.min(1, st.pt / dr.dur), q = ease(k);

      }
      if (st.held){
        const h = st.held, wob = dr.grip === 'slip' ? Math.sin(st.t * 18) * .6 : 0;
        h.p.x = cl.x + h.ox + wob; h.p.y = cl.y + h.oy; h.p.z = cl.z + h.oz;
        dr.slipT -= dt;
        if (dr.slipT <= 0){ if (!dropHeld()) say('SO', 'CLOSE', 2.4); dr.slipped = true; }
      }
      break;
    }
    case 'release': {
      if (st.held && st.pt > .05) dropHeld();
      const k = Math.min(1, st.pt / .4); cl.o = dr.o0 + (1 - dr.o0) * ease(k);
      if (k >= 1){ st.phase = 'back'; st.pt = 0; }
      break;
    }
    case 'back': {
      const k = Math.min(1, st.pt / .45); cl.o = 1 - ease(k);
      if (k >= 1){
        cl.o = 0; st.phase = 'idle'; st.pt = 0;
        if (dr.grip === 'miss') say('TRY', 'AGAIN', 2);
        st.drop = null;
      }
      break;
    }
  }

  // falling prizes
  for (const fl of st.falls.slice()){
    if (fl.delay > 0){ fl.delay -= dt; continue; }
    fl.vz += 300 * dt; fl.z -= fl.vz * dt;
    const lk2 = Math.min(1, dt * 7); fl.x += (fl.tx - fl.x) * lk2; fl.y += (fl.ty - fl.y) * lk2;
    if (fl.mode === 'floor' && fl.z <= fl.tz){
      fl.z = fl.tz;
      if (fl.vz > 70){ fl.vz = -fl.vz * .3; continue; }
      st.falls.splice(st.falls.indexOf(fl), 1);
      st.prizes.push({ ...fl.p, x:fl.tx, y:fl.ty, z:fl.tz });
    }
    if (fl.mode === 'chute' && fl.z < HB - fl.p.r - 3){
      st.falls.splice(st.falls.indexOf(fl), 1);
      const i = st.bay.length + st.bayIn.length, [sx, sy, sz] = baySpot(i);
      st.bayIn.push({ p:fl.p, t:-.35, x:BAY_X + 2, y:sy, z:BAY[3] + fl.p.r + 2, sx, sy, sz, vz:0 });
    }
  }
  // prizes coming out of the chute into the bay
  for (const b of st.bayIn.slice()){
    b.t += dt; if (b.t < 0) continue;
    b.vz += 300 * dt; b.z -= b.vz * dt; b.x += (b.sx - b.x) * Math.min(1, dt * 5);
    if (b.z <= b.sz){ b.z = b.sz; if (b.vz > 60){ b.vz = -b.vz * .3; } else if (Math.abs(b.x - b.sx) < .3){ st.bayIn.splice(st.bayIn.indexOf(b), 1); st.bay.push(b.p); } }
  }
  // flap + taking
  if (st.flap !== st.flapT){ const g = Math.sign(st.flapT - st.flap); st.flap = Math.max(0, Math.min(1, st.flap + g * dt / .35)); }

  }
}

/* ---------- controls ---------- */
const busyNote = () => st.phase === 'ready' ? 'the game is starting'

function insertCoin(){

}
function move(dx, dy){

  const cl = st.claw, nx = clampX(cl.x + dx * STEP), ny = clampY(cl.y + dy * STEP);
  if (Math.abs(nx - cl.x) + Math.abs(ny - cl.y) < .01 && !st.step) return ui.flash('the claw is at the edge');

}
function drop(){

  ui.flash(busyNote());
}
function takePrize(){
  if (st.take) return;
  if (!st.bay.length){
    if (st.bayIn.length || st.falls.some(fl => fl.mode === 'chute') || (st.held && st.drop && st.drop.grip === 'hold'))
      return ui.flash('wait — it is still on its way down');

}
function startOver(){ Object.assign(st, fresh()); for (const k in keys) keys[k] = false; ui.flash('fresh machine, 10 tokens'); }

window.GAME_KEYS = true;   // the arrows and space play the game; they don't turn the camera here
const KEYDIR = { ArrowLeft:[0,1], ArrowRight:[0,-1], ArrowUp:[-1,0], ArrowDown:[1,0] };
addEventListener('keydown', e => {
  if (KEYDIR[e.key]){ e.preventDefault(); if (e.repeat) return;
    if (st.phase !== 'play'){ move(...KEYDIR[e.key]); return; }
    keys[e.key] = true; kick(); ui.render(); return; }
  // space always drops, even right after a button was clicked (that button keeps the focus); Enter still presses buttons
  if (e.key === ' ' || (e.key === 'Enter' && !(e.target && e.target.closest && e.target.closest('button')))){ e.preventDefault(); if (!e.repeat){ drop(); ui.render(); } }
});
addEventListener('keyup', e => { if (KEYDIR[e.key]) keys[e.key] = false; });
addEventListener('blur', () => { for (const k in keys) keys[k] = false; });


/* ---------- see-through + labels kit (shared; the figure supplies its own working parts) ----------

   xrGhost(body, mech, k, OUTp, x0, x1, m): far walls faintly, the working parts, then the case as a ghost over them.

function xrCallouts(items, B){
  const pts = []; for (const x of [B[0], B[1]]) for (const y of [B[2], B[3]]) for (const z of [B[4], B[5]]) pts.push(P(x, y, z));
  const xmin = Math.min(...pts.map(p => p[0])), xmax = Math.max(...pts.map(p => p[0])), cx = (xmin + xmax)/2;
  // on a phone (LBL_U = drawing units per screen px) each label is a numbered badge and the names go in a legend under the figure
  const k = INK_K, u = window.LBL_U ? LBL_U() : 0, fs = u ? 10*u : 8.6*k, hgt = u ? 17*u : fs*1.8, gap = hgt + (u ? 3*u : 3*k);
  const L = [], R = [];
  const svgEl = document.getElementById('fig'), vb = svgEl.viewBox.baseVal, btn = document.getElementById('btns');
  const wMax = u ? hgt*1.3 + 12*k : Math.max(...items.map(it => it.text.length))*fs*.62 + fs*1.5 + 12*k;
  const roomL = xmin - vb.x >= wMax, roomR = vb.x + vb.width - xmax >= wMax;
  for (const it of items){ const [X, Y] = P(...it.at); ((X < cx && roomL) || !roomR ? L : R).push({ ...it, X, Y }); }
  let s = '';
  let top = { [-1]: fs, [1]: fs + 30*k };
  if (btn && svgEl.getScreenCTM()){ const r = btn.getBoundingClientRect(), q = new DOMPoint(r.right, r.bottom + 50).matrixTransform(svgEl.getScreenCTM().inverse());

    const shift = col.length ? Math.max(0, col.reduce((a, c) => a + c.py - c.Y, 0) / col.length) : 0;
    const room = col.length ? col[0].py - top[side] : 0; for (const c of col) c.py -= Math.min(shift, room);

      c.n = ((window.__ln || (window.__ln = {}))[c.text] || (__ln[c.text] = Object.keys(__ln).length + 1)); const w = u ? hgt*(c.n > 9 ? 1.3 : 1) : c.text.length*fs*.62 + fs*1.5;
      let px = side < 0 ? xmin - 10*k - w/2 : xmax + 10*k + w/2; px = Math.max(vb.x + w/2 + 2*k, Math.min(vb.x + vb.width - w/2 - 2*k, px));
      const ex = px - side*w/2;
      s += `<g class="tag${c.on ? ' on' : ''}" data-n="${c.n}" data-t="${c.text}"><path d="M${f(c.X)} ${f(c.Y)}L${f(ex + side*-4*k)} ${f(c.py)}L${f(ex)} ${f(c.py)}" fill="none" stroke="${INK}" stroke-width="1"/>`
        + `<circle cx="${f(c.X)}" cy="${f(c.Y)}" r="${f(1.4*k)}" fill="${INK}"/>`
        + `<rect x="${f(px - w/2)}" y="${f(c.py - hgt/2)}" width="${f(w)}" height="${f(hgt)}" rx="${f(hgt/2)}" fill="${c.on ? 'var(--accent,#f4b829)' : '#fff4d6'}" stroke="${INK}" stroke-width="1.2"/>`
        + `<text x="${f(px)}" y="${f(c.py + fs*.36)}" font-size="${f(fs)}" text-anchor="middle" font-family="ui-monospace,Menlo,monospace" font-weight="800" letter-spacing=".04em" fill="${INK}">${u ? c.n : c.text}</text></g>`;
    }
  }
  return s;
}
function xrGhost(body, mech, k, OUTp, x0, x1, m){
  const fF = facing([1,0,0]), fB = facing([-1,0,0]);
  const far = `<g opacity="${f(.5*k)}">` + loft(on(PX(x0), OUTp), on(PX(x1), OUTp), n => mix(toneI(n.map(v => -v), m), '#f2efe7', .55), true)
    + (fF ? fill(pd(on(PX(x0), OUTp)), mix(m.d, '#f2efe7', .5)) : '') + (fB ? fill(pd(on(PX(x1), OUTp)), mix(m.d, '#f2efe7', .5)) : '') + `</g>`;

    + 'html.nolabels #fig .tag{display:none}.mcap{width:100%;max-width:760px;min-height:3em;margin:0 0 14px;font-size:12.5px;line-height:1.5;text-align:center;transition:opacity .3s}'

}
// same, for a body lofted between two horizontal rings A (bottom) and B (top)
function xrGhostRings(body, mech, k, A, B, m){

// generic see-through for any figure: the whole drawing fades back and the inside parts show over it.
//   opts: { mech(st, k) -> svg, inside(st) -> label items, surface(st) -> label items (optional), B: bounds, getSt() }

   GANTRY  two rails on brackets under the roof . end stop . bridge beam on two end trucks with hangers .
           X gearmotor at the back end of the right rail, its pulley, the toothed belt along the rail and the
           clamp that ties the belt to the bridge . a rack along the bridge . trolley under the bridge .
           Y gearmotor on the trolley with its pinion on the rack . winch drum with its cheek and coaxial gearmotor .
           the string down to the claw . the coiled cord that feeds the claw's coil

   PRIZES  chute shaft below the hole (back, side and front walls) . deflector into the pickup bay .
           infrared emitter and receiver on the shaft walls, and the beam between them
   COINS   coin acceptor under the slot . coin tube . cash box behind the coin door . coin meter
   POWER   main board on the back wall (chips, connectors, test button, standoff screws, status LED) .
           power supply on the floor (vents, fan) . speaker . LED strip under the roof
   CONTROL joystick plate with its shaft and four microswitches . drop-button microswitch

const bend = (pts, r = 2.5) => { if (pts.length < 3) return pts; const out = [pts[0]];

  return `<path d="${d}" fill="none" stroke="${INK}" stroke-width="${f(2*w + 1.1)}" stroke-linecap="round" stroke-linejoin="round"/>`
    + `<path d="${d}" fill="none" stroke="${col}" stroke-width="${f(2*w)}" stroke-linecap="round" stroke-linejoin="round"/>`
    + (ends ? [a, b].map(([X, Y]) => `<circle cx="${f(X)}" cy="${f(Y)}" r="1.3" fill="${INK}"/>`).join('') : ''); };
