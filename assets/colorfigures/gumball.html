<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>.mcap{display:none!important}@media (max-width:560px){.stat .v{font-size:20px!important}.stats{align-items:flex-end}}@media (min-width:561px){.vset{top:4px!important}#stats{top:var(--vset-h,44px)!important}}</style><style>@media (max-width:560px){body > header{display:none}}</style><script>window.FIG_A = () => innerWidth <= 560 ? 1.1 : .75;</script><script>window.LBL_U = () => { if (innerWidth > 560) return 0; const s = document.getElementById("fig"); return s && s.clientWidth && s.viewBox.baseVal.width ? s.viewBox.baseVal.width / s.clientWidth : 0; };</script></head><body>
<script>
/* ============================================================
   Colorfigures core: projection, shapes, shading, ink, labels, page shell.
   A figure page includes this file (scripts/build.py inlines it), then calls mountFigure({...}).
   See SKILL.md for the drawing contract and conventions.
   One fixed view (front-left-top) and one fixed light (from above, behind the viewer's right shoulder: the front is lit,
   the left side is in shade, and cast shadows fall toward the lower left of the screen).
   ============================================================ */

/* ---------- palettes ---------- */
const PALS = {
  mustard: { l:'#f4b829', m:'#d49c1f', d:'#4e4a18' },
  tomato:  { l:'#ef6a4c', m:'#cf5038', d:'#4a2219' },
  mint:    { l:'#93d3b0', m:'#71b693', d:'#1f4034' },
  cobalt:  { l:'#76a0e2', m:'#5a82c6', d:'#1c2948' },
  blush:   { l:'#f3a6bb', m:'#d8869c', d:'#4b2430' },
};
const METAL   = { l:'#eef0f0', m:'#c6ccce', d:'#8f989b' };
const CLEAR   = { l:'#e4f2f4', m:'#c4dfe4', d:'#97b9c0' };
const CERAMIC = { l:'#fbfaf3', m:'#e3e0d2', d:'#bdb8a6' };
const DARK    = { l:'#55504a', m:'#3d3935', d:'#272421' };
const INK = '#231e16';
const SHADOW = '#41538f';

/* ---------- projection (x = depth toward viewer-right, y = toward viewer-left, z = up) ---------- */
const C = Math.cos(Math.PI/6), S = Math.sin(Math.PI/6);
let OX = 0, OY = 0;
/* Free orthographic camera (internal names start with CAM_ / cam so they never clash with a figure's own names). YAW turns the viewer around the vertical axis (45° = the classic front-left view),
   PITCH is how far it looks down (35.26° = true isometric). At the defaults P() is exactly the old isometric
   projection, so every figure drawn for it still lines up. Drag the figure to orbit; double-click to reset.
   rotV(n) maps a world direction into the default view's frame, so vis / tone / any "sum of rotV > 0" test keep
   working at every angle: the viewer is always (1,1,1) and the light stays put relative to the viewer. */
let VIEW = 0, RC = [0, 0], RCZ = 0;
const VIEW_NAMES = ['front', 'left side', 'back', 'right side'];
const TURNS = [0, 2];
const YAW0 = 45, PITCH0 = Math.atan(1/Math.SQRT2) * 180/Math.PI, CAM_K = Math.sqrt(1.5);
let YAW = YAW0, PITCH = PITCH0, CAM_R, CAM_U, CAM_V, CAM_D;                       // right, up, toward viewer, screen-down
const camBasis = (yaw, pitch) => { const t = yaw*Math.PI/180, p = pitch*Math.PI/180, ct = Math.cos(t), st = Math.sin(t), cp = Math.cos(p), sp2 = Math.sin(p);
  return { R:[st,-ct,0], U:[-sp2*ct,-sp2*st,cp], V:[cp*ct,cp*st,sp2] }; };
const CAM_B0 = camBasis(YAW0, PITCH0);
// CAM_LIM: how far (deg) the camera may turn either side of the front view; null = all the way round (set per figure)
let CAM_LIM = null;
function setCam(yaw, pitch){ YAW = CAM_LIM == null ? yaw : Math.max(YAW0 - CAM_LIM, Math.min(YAW0 + CAM_LIM, yaw));
  PITCH = CAM_LIM == null ? Math.max(6, Math.min(78, pitch)) : Math.max(15, Math.min(62, pitch)); const b = camBasis(YAW, PITCH); CAM_R = b.R; CAM_U = b.U; CAM_V = b.V; CAM_D = CAM_U.map(v => -v); }
setCam(YAW0, PITCH0);
const camDot = (a,b) => a[0]*b[0]+a[1]*b[1]+a[2]*b[2];
const rotV = n => { const r = camDot(n,CAM_R), u = camDot(n,CAM_U), v = camDot(n,CAM_V); return [0,1,2].map(i => CAM_B0.R[i]*r + CAM_B0.U[i]*u + CAM_B0.V[i]*v); };
// the light's ground direction turns with the viewer's yaw only (shadows always fall toward the lower left of the screen)
const yawTurn = ([x,y]) => { const t = (YAW - YAW0)*Math.PI/180, c = Math.cos(t), s = Math.sin(t); return [x*c - y*s, x*s + y*c]; };
const rotXY = (x,y) => [x, y];                                                // kept for old callers
const P0 = (x,y,z) => [(x-y)*C + OX, (x+y)*S - z + OY];                       // raw iso
const P  = (x,y,z) => { const q = [x-RC[0], y-RC[1], z-RCZ];
  return [CAM_K*camDot(q,CAM_R) + (RC[0]-RC[1])*C + OX, CAM_K*camDot(q,CAM_D) + (RC[0]+RC[1])*S - RCZ + OY]; };
const Dv = (x,y,z) => [CAM_K*camDot([x,y,z],CAM_R), CAM_K*camDot([x,y,z],CAM_D)];
// distance toward the viewer: draw parts with smaller depth first
const depthOf = p => camDot(p, CAM_V);
// sort [{at:[x,y,z], svg}] back-to-front for the current camera. A part may also give box:[[x0,y0,z0],[x1,y1,z1]]:
// when two boxes are separated along x, y or z, the one on the viewer's side goes last (a centre point alone gets long
// or wrapping parts wrong: a pole beside a row of keys, a spout reaching past a cup).
const boxMid = b => [0,1,2].map(k => (b[0][k] + b[1][k]) / 2);
const sepOrder = (p, q) => { if (!p.box || !q.box) return 0;
  for (let k = 0; k < 3; k++){ if (p.box[1][k] <= q.box[0][k] + 1e-6) return CAM_V[k] >= 0 ? -1 : 1; if (q.box[1][k] <= p.box[0][k] + 1e-6) return CAM_V[k] >= 0 ? 1 : -1; }
  return 0; };
const byDepth = parts => parts.filter(Boolean).sort((p,q) => sepOrder(p,q) || (depthOf(p.at || boxMid(p.box)) - depthOf(q.at || boxMid(q.box)))).map(p => p.svg).join('');
// the half of a vertical ring that faces the viewer / is turned away, as [from, to] angles in degrees (0 = +x, 90 = +y)
const nearHalf = () => [YAW - 90, YAW + 90], farHalf = () => [YAW + 90, YAW + 270];
// an open container (cup, bin, cone, drum) between two rings: far inner wall, then its contents, then the near outer wall
const openShell = (A, B, colour, contents = '') => loft(A, B, colour, true) + contents + loft(A, B, colour);
const f  = v => v.toFixed(1);
const pd = (pts, close=true) => 'M' + pts.map(p => { const q = P(p[0],p[1],p[2]); return f(q[0])+' '+f(q[1]); }).join('L') + (close ? 'Z' : '');
const sp = pts => 'M' + pts.map(q => f(q[0])+' '+f(q[1])).join('L') + 'Z';

/* ---------- 2D shapes in a plane's (u,v) coords (v up), mapped to 3D by a plane ---------- */
const arcUV  = (cu,cv,r,a0,a1,n=7) => { const o=[]; for (let i=0;i<=n;i++){ const a=(a0+(a1-a0)*i/n)*Math.PI/180; o.push([cu+r*Math.cos(a), cv+r*Math.sin(a)]); } return o; };
const rrUV   = (u0,v0,u1,v1,r,n=7) => r <= 0 ? rectUV(u0,v0,u1,v1) : [...arcUV(u1-r,v0+r,r,-90,0,n), ...arcUV(u1-r,v1-r,r,0,90,n), ...arcUV(u0+r,v1-r,r,90,180,n), ...arcUV(u0+r,v0+r,r,180,270,n)];
const rectUV = (u0,v0,u1,v1) => [[u0,v0],[u1,v0],[u1,v1],[u0,v1]];
const ellUV  = (cu,cv,ru,rv,n=24) => Array.from({length:n}, (_,i) => { const a=i/n*2*Math.PI; return [cu+ru*Math.cos(a), cv+rv*Math.sin(a)]; });
const PX = x => ([u,v]) => [x,u,v];      // front-facing plane x = const   (u = y, v = z)
const PY = y => ([u,v]) => [u,y,v];      // side plane y = const           (u = x, v = z)
const PZ = z => ([u,v]) => [u,v,z];      // horizontal plane z = const     (u = x, v = y)
const on = (plane, uv) => uv.map(plane);

/* ---------- vectors + shading ---------- */
const sub=(a,b)=>[a[0]-b[0],a[1]-b[1],a[2]-b[2]], dot=(a,b)=>a[0]*b[0]+a[1]*b[1]+a[2]*b[2];
const cross=(a,b)=>[a[1]*b[2]-a[2]*b[1], a[2]*b[0]-a[0]*b[2], a[0]*b[1]-a[1]*b[0]];
const norm=a=>{ const l=Math.hypot(...a)||1; return a.map(v=>v/l); };
const avg=ps=>ps.reduce((s,p)=>[s[0]+p[0]/ps.length,s[1]+p[1]/ps.length,s[2]+p[2]/ps.length],[0,0,0]);
const vis = n => { const r = rotV(n); return r[0]+r[1]+r[2] > 1e-6; };   // viewer looks from (+1,+1,+1) after the turn
const facing = vis;                                                       // readable alias: is this face toward the viewer?
const SHADOW_K = 0.85, AZ_MIN = 20, AZ_MAX = 160;
// cast shadows are drawn shorter than the shading light implies (0.45 × height instead of 0.85 ×): long shadows of tall
// parts on thin supports (a lamp shade, a fan head) land far from the object and read as separate blobs
const SHADOW_LEN = 0.45;
let L = [0,0,1], SH = [0,0];
function setLight(deg){ const a=deg*Math.PI/180; SH=[SHADOW_K*Math.cos(a), SHADOW_K*Math.sin(a)]; L=norm([-SH[0],-SH[1],1]); }
const LIN = norm([.6,.2,1]);                       // fixed light for interiors / small props
// Three flat tones, but blended across a narrow band at each step, so a face that turns past a threshold while the
// figure rotates fades between tones instead of snapping (at rest almost every face still sits on a pure tone).
const SOFT = .18;
const step3 = (d, hi, lo, m) => { const ss = (a, b, x) => { const k = Math.min(1, Math.max(0, (x - a)/(b - a))); return k*k*(3 - 2*k); };
  const a = ss(hi - SOFT, hi + SOFT, d), b = ss(lo - SOFT, lo + SOFT, d);
  return a >= 1 ? m.l : b <= 0 ? m.d : a > 0 ? mix(m.m, m.l, a) : b < 1 ? mix(m.d, m.m, b) : m.m; };
const tone  = (n,m) => step3(dot(rotV(n),L),   -.15, -.45, m);   // exterior, follows the sun
const toneI = (n,m) => step3(dot(rotV(n),LIN),  .6,   .05, m);   // interior / props
const mix = (a,b,t) => '#' + [1,3,5].map(i => Math.round(parseInt(a.substr(i,2),16)*(1-t) + parseInt(b.substr(i,2),16)*t).toString(16).padStart(2,'0')).join('');
const matOf = hex => ({ l:hex, m:mix(hex,'#000000',.16), d:mix(hex,'#000000',.42) });
const ease = t => t<.5 ? 2*t*t : 1-Math.pow(-2*t+2,2)/2;

/* ---------- drawing primitives (all return SVG strings) ---------- */
const ink   = (d,w=1.0) => `<path d="${d}" fill="none" stroke="${INK}" stroke-width="${w}" stroke-linejoin="round" stroke-linecap="round"/>`;
const fill  = (d,c,extra='') => `<path d="${d}" fill="${c}" ${extra}/>`;
const face  = (d,c) => `<path d="${d}" fill="${c}" stroke="${c}" stroke-width=".7" stroke-linejoin="round"/>`;
const shape = (pts,c,w=.9) => fill(pd(pts),c) + (w ? ink(pd(pts),w) : '');
const line  = (pts,w=.9) => ink(pd(pts,false),w);
// Loft between two rings of equal length (closed). colour(n) picks each strip's fill; flip = seen from inside.
function loft(A, B, colour, flip=false){
  const n=A.length, cen=avg(A.concat(B)); let s='';
  for (let i=0;i<n;i++){
    const a0=A[i], a1=A[(i+1)%n], b1=B[(i+1)%n], b0=B[i];
    let nr = norm(cross(sub(a1,a0), sub(b0,a0)));
    if (!isFinite(nr[0])) continue;
    if (dot(nr, sub(avg([a0,a1,b1,b0]), cen)) < 0) nr = nr.map(v=>-v);
    if (flip) nr = nr.map(v=>-v);
    if (vis(nr)) s += face(pd([a0,a1,b1,b0]), colour(nr));
  }
  return s;
}
function hull(pts){
  pts = pts.slice().sort((a,b)=>a[0]-b[0]||a[1]-b[1]);
  const cr=(o,a,b)=>(a[0]-o[0])*(b[1]-o[1])-(a[1]-o[1])*(b[0]-o[0]); const lo=[], up=[];
  for (const p of pts){ while(lo.length>=2 && cr(lo[lo.length-2],lo[lo.length-1],p)<=0) lo.pop(); lo.push(p); }
  for (const p of pts.reverse()){ while(up.length>=2 && cr(up[up.length-2],up[up.length-1],p)<=0) up.pop(); up.push(p); }
  lo.pop(); up.pop(); return lo.concat(up);
}
// Silhouette ink, weighted by how thick the part is on screen (like a hand inker): the w you pass is the most it gets.
// Thickness = 2 × area / perimeter of the outline (a rod's diameter, about half a box's width), as a share of the
// frame width. A long thin rod, a handle or a knob stays light (~1–1.5); a grinder, kettle or machine body gets the
// heavy ~2.4–2.8. Thin parts stay thin and parts keep air between them.
const hullInk = (pts3, w=1.4) => { const h = hull(pts3.map(p=>P(...p))); let a = 0, per = 0;
  for (let i = 0; i < h.length; i++){ const p = h[i], q = h[(i+1) % h.length]; a += p[0]*q[1] - q[0]*p[1]; per += Math.hypot(q[0]-p[0], q[1]-p[1]); }
  const thick = per ? Math.abs(a) / per / (INK_K * INK_REF_VB) : 0;
  return ink(sp(h), Math.min(w, .9 + 20*thick)); };
// Axis-aligned box: three visible faces, shaded, each outlined. shade = tone (sunlit) or toneI (interior).
function box(x0,y0,z0,x1,y1,z1,m,shade=toneI,w=.9){
  // all six faces, drawn only when they face the viewer (sides first, then top) — correct in every VIEW
  const F = [
    [[0,1,0],  [[x0,y1,z0],[x1,y1,z0],[x1,y1,z1],[x0,y1,z1]]],
    [[1,0,0],  [[x1,y0,z0],[x1,y1,z0],[x1,y1,z1],[x1,y0,z1]]],
    [[0,-1,0], [[x0,y0,z0],[x1,y0,z0],[x1,y0,z1],[x0,y0,z1]]],
    [[-1,0,0], [[x0,y0,z0],[x0,y1,z0],[x0,y1,z1],[x0,y0,z1]]],
    [[0,0,1],  [[x0,y0,z1],[x1,y0,z1],[x1,y1,z1],[x0,y1,z1]]] ];
  return F.filter(([n]) => vis(n)).map(([n,q]) => shape(q, shade(n,m), w)).join('');
}
// Rounded-profile extrusion: profile (u=y, v=z) swept along x from x0 to x1. Body of most machines.
function extrude(profileUV, x0, x1, m, shade=tone){ return loft(on(PX(x0),profileUV), on(PX(x1),profileUV), n=>shade(n,m)); }
// Vertical cylinder (axis z) centred (x,y), radius r from z0 to z1, with top cap.
function cyl(x,y,z0,z1,r,m,shade=toneI,w=1.2,n=24){
  const A=on(PZ(z0),ellUV(x,y,r,r,n)), B=on(PZ(z1),ellUV(x,y,r,r,n));
  return loft(A,B,nr=>shade(nr,m)) + fill(pd(B),shade([0,0,1],m)) + hullInk([...A,...B],w) + ink(pd(B),w*.8);
}
// Cylinder lying along x (e.g. a knob or dial sticking out of a front face): centred (y,z), from x0 to x1.
function cylX(x0,x1,y,z,r,m,shade=toneI,w=1.1,n=20){
  const A=on(PX(x0),ellUV(y,z,r,r,n)), B=on(PX(x1),ellUV(y,z,r,r,n));
  // cap on whichever end faces the viewer (the +x end in VIEW 0)
  const capB = vis([1,0,0]), cap = capB ? B : A, cn = capB ? [1,0,0] : [-1,0,0];
  return loft(A,B,nr=>shade(nr,m)) + (vis(cn) ? fill(pd(cap),shade(cn,m)) : '') + hullInk([...A,...B],w) + (vis(cn) ? ink(pd(cap),w*.8) : '');
}
// Cylinder between any two 3D points a and b (a lamp arm, a rod, a pipe at an angle, a handle bar), radius r.
// The end facing the viewer gets a cap. For a tapered part (a cone, a lamp shade) pass r1 for the radius at b.
function rod(a, b, r, m, shade=toneI, w=1, r1=r, n=16){
  const d = norm(sub(b, a)), u = norm(cross(d, Math.abs(d[2]) < .9 ? [0,0,1] : [1,0,0])), v = cross(d, u);
  const ring = (p, rr) => Array.from({length:n}, (_,i) => { const t = i/n*2*Math.PI, c = Math.cos(t)*rr, s2 = Math.sin(t)*rr;
    return [p[0] + u[0]*c + v[0]*s2, p[1] + u[1]*c + v[1]*s2, p[2] + u[2]*c + v[2]*s2]; });
  const A = ring(a, r), B = ring(b, r1), capB = vis(d), cap = capB ? B : A, cn = capB ? d : d.map(x => -x);
  return loft(A, B, nr => shade(nr, m)) + (Math.max(r, r1) > 0 ? fill(pd(cap), shade(cn, m)) + ink(pd(cap), w*.8) : '') + hullInk([...A, ...B], w);
}
// Text lying flat on a front plane x = const, centred at (y,z) baseline; reads left-to-right on screen.
// text sits on a face: if its reading direction comes out mirrored (or edge-on), that face is turned away, so the text is hidden
const txM = (o, U, V) => (U[0]*V[1] - U[1]*V[0]) <= .02 * Math.hypot(...U) * Math.hypot(...V) ? `matrix(0 0 0 0 ${f(o[0])} ${f(o[1])})` : `matrix(${U[0].toFixed(4)} ${U[1].toFixed(4)} ${V[0].toFixed(4)} ${V[1].toFixed(4)} ${f(o[0])} ${f(o[1])})`;
const tx = (x,y,z,str,size,col=INK,weight=700) => { const o=P(x,y,z);
  return `<text transform="${txM(o, Dv(0,-1,0), Dv(0,0,-1))}" font-size="${size}" fill="${col}" text-anchor="middle" font-family="ui-monospace,Menlo,monospace" font-weight="${weight}" letter-spacing=".04em">${str}</text>`; };
// Text on a side plane y = const, centred at (x,z).
const txY = (x,y,z,str,size,col=INK,weight=700) => { const o=P(x,y,z);
  return `<text transform="${txM(o, Dv(1,0,0), Dv(0,0,-1))}" font-size="${size}" fill="${col}" text-anchor="middle" font-family="ui-monospace,Menlo,monospace" font-weight="${weight}" letter-spacing=".04em">${str}</text>`; };
// Cast shadow of a set of 3D points (any outline of the object), pushed along the light onto z = 0.
// the light stays put relative to the viewer, so the shadow is cast in turned coordinates
// z0: the surface it falls on (a board, a counter); clip it to that surface with clipTo(...) if it could spill off.
// clip: the 3D outline of the surface it falls on (e.g. boardTop(...)), so it can't spill over the edge.
const castShadow = (pts3, z0=0, clip=null) => { const k = SHADOW_LEN / SHADOW_K, [sx, sy] = yawTurn(SH);
  const s = fill(sp(hull(pts3.map(([x,y,z]) => P(x+(z-z0)*sx*k, y+(z-z0)*sy*k, z0)))), SHADOW);
  return clip ? clipTo(clip, s) : s; };
// A board for the object to stand on (a tray, a desk top, a counter): a rounded slab from (x0,y0) to (x1,y1), h thick.
// Draw it first; then castShadow(points, h, boardTop(x0,y0,x1,y1,h,r)) so shadows lie on it and stop at its edge.
const BOARD = { l:'#e6e1d4', m:'#cfc8b8', d:'#aaa293' }, WOOD = { l:'#d9a86c', m:'#bf8a4f', d:'#8e6236' };
const boardTop = (x0,y0,x1,y1,h=3,r=5) => on(PZ(h), rrUV(x0,y0,x1,y1,r));
function board(x0,y0,x1,y1,h=3,r=5,m=BOARD){
  const A = on(PZ(0), rrUV(x0,y0,x1,y1,r)), B = boardTop(x0,y0,x1,y1,h,r);
  return loft(A, B, n => toneI(n, m)) + fill(pd(B), m.l) + ink(pd(B), 1) + hullInk([...A, ...B], 1.8);
}
// Group helpers: clickable target, clip to an opening.
const act  = (name, inner, data='') => `<g data-act="${name}" ${data}>${inner}</g>`;
let _clipN = 0;
// Part label (for "how does it work" figures): a cream pill with a leader line to a 3D point on the part.
// dx, dy = where the pill sits, in screen units at the reference zoom (they scale with the figure like stroke widths).
// on = that part is working right now (the pill turns the accent colour). Labels can be hidden with the Labels switch.
function tag(p3, dx, dy, text, on=false){
  // on a phone (LBL_U = drawing units per screen px) the pill is a numbered badge and the names go in a legend under the figure
  const u = window.LBL_U ? LBL_U() : 0, n = ((window.__ln || (window.__ln = {}))[text] || (__ln[text] = Object.keys(__ln).length + 1));
  const k = INK_K, [X,Y] = P(...p3), fs = u ? 10*u : 8.6*k, h = u ? 17*u : fs*1.8, w = u ? h*(n > 9 ? 1.3 : 1) : text.length*fs*.62 + fs*1.5, cx = X + dx*k, cy = Y + dy*k;
  return `<g class="tag${on ? ' on' : ''}" data-n="${n}" data-t="${text}"><path d="M${f(X)} ${f(Y)}L${f(cx)} ${f(cy)}" fill="none" stroke="${INK}" stroke-width="1"/>`
    + `<circle cx="${f(X)}" cy="${f(Y)}" r="${f(1.3*k)}" fill="${INK}"/>`
    + `<rect x="${f(cx-w/2)}" y="${f(cy-h/2)}" width="${f(w)}" height="${f(h)}" rx="${f(h/2)}" fill="${on ? 'var(--accent,#f4b829)' : '#fff4d6'}" stroke="${INK}" stroke-width="1.2"/>`
    + `<text x="${f(cx)}" y="${f(cy+fs*.36)}" font-size="${f(fs)}" text-anchor="middle" font-family="ui-monospace,Menlo,monospace" font-weight="800" letter-spacing=".04em" fill="${INK}">${u ? n : text}</text></g>`;
}
const clipTo = (pts3, inner) => { const id = 'k' + (++_clipN); return `<clipPath id="${id}"><path d="${pd(pts3)}"/></clipPath><g clip-path="url(#${id})">${inner}</g>`; };

/* ---------- constant on-screen line weight ----------
   Stroke widths are written in model units, and each figure is zoomed to fill the frame, so a small
   object would get fat lines. INK_K rescales every stroke-width (and the wobble/grain filter) so all

  document.getElementById('wb').oninput = e => document.getElementById('wob').setAttribute('scale', (e.target.value * INK_K).toFixed(2));
  const pals = document.getElementById('pals');
  for (const [k,p] of Object.entries(PALS)){
    const b = document.createElement('button'); b.className='sw'; b.title=k; b.style.background=p.l; b.setAttribute('aria-pressed', k===st.pal);
    b.onclick = () => { st.pal=k; [...pals.children].forEach(c=>c.setAttribute('aria-pressed', c===b)); ui.render(); };
    pals.appendChild(b);
  }
  // labels: the switch appears when the figure draws any tag(); ?labels=0 starts with them hidden
  const lblctl = document.getElementById('lblctl'), lbl = document.getElementById('lbl');
  const setLabels = on => { document.documentElement.classList.toggle('nolabels', !on); lbl.textContent = on ? 'On' : 'Off'; lbl.setAttribute('aria-pressed', on); };
  lbl.onclick = () => setLabels(document.documentElement.classList.contains('nolabels'));
  if (q.get('labels') === '0') setLabels(false);
  // testing: ?press=Label@ms,Label@ms clicks the buttons whose text starts with Label at those times after load
  // (any order, repeats allowed); Label>Choice picks a choice from a picker button (?press=Speed>3@300).
  // Script errors and unknown labels are recorded on <html data-errors="…">
  window.__st = st;
  const noteErr = m => { document.documentElement.dataset.errors = (document.documentElement.dataset.errors || '') + ' ' + m + ';'; };
  const starts = (el, t) => el.textContent.trim().toLowerCase().startsWith(t.trim().toLowerCase());
  if (q.has('press')) q.get('press').split(',').forEach(item => { const [what, ms] = item.split('@'), [label, choice] = what.split('>');
    setTimeout(() => { const b = [...document.querySelectorAll('.act')].find(b => starts(b, label));
      if (!b) return noteErr(`no button "${label}"`);
      b.click(); if (choice == null) return;
      const c = [...b.parentElement.querySelectorAll('.chip')].find(c => starts(c, choice));
      if (c && !c.disabled) c.click(); else noteErr(`no choice "${choice}" in "${label}"`); }, +ms || 0); });
  setLight(st.az); ui.render();
  if (art.querySelector('.tag')) lblctl.hidden = false;
  return ui;
}

</script>
<script>
/* Gumball machine. Put a coin in, turn the crank, a gumball rolls out.
   Port of the Colorfigures 2.0 kids figure to the 1.0 engine with the free camera.
   Base: x = depth 70, y = width 84, z = 4..72 on a plate. The lit front (x = W) has a peek window onto the mechanism:
   the coin unlocks the gumball wheel, the crank turns the wheel a quarter turn, the pocket over the exit drops a gum. */
const W = 70, D = 84, H = 72, BR = 8;                        // body depth, width, top; corner radius
const GC = [35, 42, 106], GR = 34;                           // glass globe: centre and radius
const CRK = [24, 25], CRANK_R = 9;                           // crank centre (y, z) on the front
const SPH = Math.sqrt(1.5);                                  // a sphere of radius r draws as a circle of r * SPH
const WIN_D = 2.5;                                           // the mechanism window is set this deep into the front
const GUM = ['#e2473a','#f2c230','#3e86d9','#38a565','#ef6f9a','#f08a2b','#8c4bd1','#fbf7ea'];
const PLATE = { l:'#ddd8ca', m:'#cbc5b6', d:'#b9b3a4' }, PLATE_TOP = '#e6e2d6';
const STEELM = { l:'#d9dddd', m:'#bcc2c3', d:'#9ea6a9' }, KNOBM = { l:'#57514b', m:'#46413c', d:'#2a2724' };
const WINBG = '#e3eaec', HOLE = '#3a3431', COINC = '#e8b84a', LAMP = '#ff8a2a', LAMP_OFF = '#d6cfc4';
const gbF = v => v.toFixed(2);

/* ---------- small helpers ---------- */
// the front plane in the 2.0 figure's local coords: (u, v) -> y = D - u, z = H - v. Rect / rounded rect as (y,z) UV.
const fr = (u0, v0, u1, v1, r = 0) => r ? rrUV(D - u1, H - v1, D - u0, H - v0, r, 5) : rectUV(D - u1, H - v1, D - u0, H - v0);
const frP = (x, u0, v0, u1, v1, r = 0) => on(PX(x), fr(u0, v0, u1, v1, r));
const frC = (x, u, v, r, n = 20) => on(PX(x), ellUV(D - u, H - v, r, r, n));
// text on a plane: o = 3D anchor, U = reading direction, anchor start/middle
const gbText = (p, U, str, size, col, weight = 800, anchor = 'middle', ls = '.04em') =>
  `<text transform="${txM(P(...p), Dv(...U), Dv(0,0,-1))}" font-size="${size}" fill="${col}" text-anchor="${anchor}" font-family="ui-monospace,Menlo,monospace" font-weight="${weight}" letter-spacing="${ls}">${str}</text>`;
// a shiny ball (a gumball, the knob on the lid): flat colour, a shaded lower half, a highlight, its ink
function gbBall(c, r, col, w = .8){
  const [X, Y] = P(...c), R = r * SPH;
  return `<circle cx="${gbF(X)}" cy="${gbF(Y)}" r="${gbF(R)}" fill="${col}"/>`
    + `<path d="M${gbF(X-R)} ${gbF(Y)}A${gbF(R)} ${gbF(R)} 0 0 0 ${gbF(X+R)} ${gbF(Y)}A${gbF(R)} ${gbF(R*.55)} 0 0 1 ${gbF(X-R)} ${gbF(Y)}Z" fill="#000" opacity=".18"/>`
    + `<circle cx="${gbF(X-R*.35)}" cy="${gbF(Y-R*.38)}" r="${gbF(R*.26)}" fill="#fff" opacity=".7"/>`
    + `<circle cx="${gbF(X)}" cy="${gbF(Y)}" r="${gbF(R)}" fill="none" stroke="${INK}" stroke-width="${w}"/>`;
}
// a prism: a convex (y,z) outline swept along x from x0 to x1 (the crank's bar)
function gbPrism(uv, x0, x1, m, w = 1){
  const A = on(PX(x0), uv), B = on(PX(x1), uv), capB = facing([1,0,0]), cap = capB ? B : A;
  return loft(A, B, n => tone(n, m)) + fill(pd(cap), tone(capB ? [1,0,0] : [-1,0,0], m)) + ink(pd(cap), w * .8) + hullInk([...A, ...B], w);
}
// the half of an upright band (a collar) that faces the viewer, with its outline: drawn over what it wraps
function gbBand(cx, cy, z0, z1, r, m, w = 1.2){
  const ring = z => on(PZ(z), ellUV(cx, cy, r, r, 36));
  let s = loft(ring(z0), ring(z1), n => tone(n, m));
  const yaw = YAW * Math.PI / 180, arc = z => Array.from({length: 25}, (_, i) => { const a = yaw - Math.PI/2 + Math.PI * i / 24; return [cx + r*Math.cos(a), cy + r*Math.sin(a), z]; });
  return s + ink(pd([...arc(z1), ...arc(z0).reverse()]), w);
}
// clip a circle in the plane y = yc (centre xc, zc) to x >= xMin: the part of the coin outside the slot
function gbCoinPoly(xc, zc, r, xMin, yc){
  const pts = Array.from({length: 28}, (_, i) => { const t = i / 28 * 2 * Math.PI; return [xc + r*Math.cos(t), zc + r*Math.sin(t)]; });
  const out = [];
  for (let i = 0; i < pts.length; i++){
    const a = pts[i], b = pts[(i + 1) % pts.length], ia = a[0] >= xMin, ib = b[0] >= xMin;
    if (ia) out.push(a);
    if (ia !== ib){ const t = (xMin - a[0]) / (b[0] - a[0]); out.push([xMin, a[1] + (b[1] - a[1]) * t]); }
  }
  return out.map(([x, z]) => [x, yc, z]);
}

/* ---------- gumballs in the globe: a jittered lattice inside the sphere, filled up to a level ---------- */
let gbSeed = 7; const gbRnd = () => (gbSeed = (gbSeed * 16807) % 2147483647) / 2147483647;
function fillGlobe(){
  const out = [], r = 4.6, s = 8.6;
  for (let x = -GR; x <= GR; x += s) for (let y = -GR; y <= GR; y += s) for (let z = -GR; z <= 8; z += s * .86){
    const p = [x + (gbRnd()-.5)*2.2, y + (gbRnd()-.5)*2.2 + ((Math.round(z/(s*.86)) % 2) ? s/2 : 0), z];
    if (Math.hypot(...p) > GR - r - .6) continue;
    out.push({ at:[GC[0]+p[0], GC[1]+p[1], GC[2]+p[2]], r, col: GUM[Math.floor(gbRnd()*GUM.length)] });
  }
  return out;
}

/* ---------- state ----------
   phase: idle -> coin (coin sliding in) -> ready -> turn (crank going round) -> drop (gum falls) -> roll -> tray
   pockets are indexed around the wheel; pocket j sits at angle (j + k)*90 deg from the top, clockwise */
const st = { phase:'idle', el:0, globe: fillGlobe(), pockets:[GUM[1], GUM[2], null, null], k:0, wig:1e9,
             falling:null, tray:null, coins:0, nextCol:null };
st.nextCol = st.globe[0].col;
const gbEase = k => k < .5 ? 2*k*k : 1 - (-2*k + 2)**2/2;
const turnK = () => st.phase === 'turn' ? gbEase(Math.min(1, st.el / 1400)) : 0;
const wiggle = () => st.wig < 600 ? 14 * Math.sin(st.wig / 600 * Math.PI * 4) * (1 - st.wig / 600) : 0;

/* ---------- the mechanism, seen through the window (a flat plate set WIN_D into the front) ---------- */
function mech(){
  const XB = W - WIN_D, x = XB + .15, tk = turnK(), cx = 26, cy = 32, R = 9.5;
  let s = fill(pd(frP(XB, 2, 8, 52, 60)), WINBG);
  // feed tube from the globe, with the next gum waiting
  s += shape(frP(x, 22, 14, 30, 23), STEELM.l, .8);
  if (st.nextCol) s += shape(frC(x + .05, 26, 19.6, 2.8), st.nextCol, .7);
  // exit chute below the wheel
  s += shape(frP(x, 22, 40.5, 30, 52.5), STEELM.l, .8) + fill(pd(frP(x + .05, 23.5, 40.5, 28.5, 52.5)), HOLE);
  // wheel with four pockets
  s += shape(frC(x + .1, cx, cy, R, 32), STEELM.l, .9) + shape(frC(x + .15, cx, cy, 1.4, 12), HOLE, .6);
  st.pockets.forEach((c, j) => {
    const a = ((j + st.k) * 90 + tk * 90) * Math.PI / 180, px = cx + 6*Math.sin(a), py = cy - 6*Math.cos(a);
    s += shape(frC(x + .15, px, py, 3.3, 16), HOLE, .6);
    if (c) s += shape(frC(x + .2, px, py, 2.7, 16), c, .6);
  });
  // the gum falling down the exit chute
  if (st.falling) s += shape(frC(x + .2, 26, st.falling.v, 2.7, 16), st.falling.col, .6);
  // coin box with the coins collected so far
  s += fill(pd(frP(x, 34, 43.5, 43.5, 50.5)), '#4a4440') + ink(pd(frP(x, 34, 43.5, 43.5, 50.5)), .7);
  for (let i = 0; i < Math.min(st.coins, 5); i++) s += shape(frP(x + .1, 35.2, 49.2 - i*1.3 - 1.2, 42.2, 49.2 - i*1.3), COINC, .5);
  // the coin: slides down the ramp, rests against the wheel (that unlocks it), falls into the box when you turn
  s += line(on(PX(x), [[D - 44, H - 21], [D - 38.5, H - 26.6]]), .9);
  let coin = null;
  if (st.phase === 'coin'){ const k = Math.min(1, st.el / 700); if (k > .45){ const q = (k - .45) / .55; coin = [44 - 5.6*q, 21.5 + 7*q]; } }
  else if (st.phase === 'ready') coin = [38.4, 28.5];
  else if (st.phase === 'turn' && st.el < 420){ const q = st.el / 420; coin = [38.4, 28.5 + 19*q*q]; }
  if (coin) s += shape(frC(x + .25, coin[0], coin[1], 2.8, 18), COINC, .6) + `<path d="${pd(frC(x + .3, coin[0], coin[1], 1.6, 14))}" fill="none" stroke="#a87a1e" stroke-width=".5"/>`;
  return s;
}

/* ---------- parts that stick out of the front: crank, tray (with the gum on it), the coin going in ---------- */
function crank(m){
  const MID = midOf(m), rot = (st.k + turnK()) * 90, a = (rot * 4 + wiggle()) * Math.PI / 180;   // a quarter turn of the wheel = one full turn of the crank
  const [y0, z0] = CRK, du = Math.sin(a), dv = -Math.cos(a), L = 7.5, wd = 1.6;
  const pt = (t, n) => { const u = t*du + n*(-dv), v = t*dv + n*du; return [y0 - u, z0 - v]; };
  const e = pt(L, 0), toFront = facing([1,0,0]);
  const base = cylX(W, W + 3, y0, z0, CRANK_R, STEELM, tone, 1.2, 28);
  const bar = gbPrism([pt(-2, -wd), pt(L, -wd), pt(L, wd), pt(-2, wd)], W + 3, W + 4.2, MID, .9);
  const tips = byDepth([
    { at:[W + 4.6, y0, z0], svg: cylX(W + 4.2, W + 5, y0, z0, 2.4, STEELM, tone, .9, 16) },
    { at:[W + 7, e[0], e[1]], svg: cylX(W + 4.2, W + 10, e[0], e[1], 2.2, KNOBM, tone, .9, 16) } ]);
  return act('crank', toFront ? base + bar + tips : tips + bar + base);
}
function tray(){
  const floor = box(W - 1, 46, 4, W + 11, 68, 7.5, STEELM, tone, 1);
  const lip = box(W + 9, 46, 7.5, W + 11, 68, 10, STEELM, tone, .9);
  let gum = '';
  const g = gumOut();
  if (g && g.x >= W + 1) gum = act('gum', gbBall([g.x, 57, 12.1], 4.5, g.col, 1));
  return floor + (facing([1,0,0]) ? gum + lip : lip + gum);
}
function gumOut(){
  if (st.phase === 'roll') return { x: W - 6 + 11 * gbEase(Math.min(1, st.el / 500)), col: st.tray };
  if (st.phase === 'tray') return { x: W + 5, col: st.tray };
  return null;
}
function coinOut(){
  if (st.phase !== 'coin' || st.el >= 420) return null;
  const xc = W + 14 - 20 * gbEase(Math.min(1, st.el / 420)), zc = 48, r = 4.2;
  const outer = gbCoinPoly(xc, zc, r, W, CRK[0]), inner = gbCoinPoly(xc, zc, r * .62, W, CRK[0]);
  if (outer.length < 3) return null;
  return { at:[Math.max(xc, W + 1), CRK[0], zc], svg: shape(outer, COINC, .8) + (inner.length > 2 ? `<path d="${pd(inner, false)}" fill="none" stroke="#a87a1e" stroke-width=".8"/>` : '') };
}

/* ---------- scene ---------- */
const midOf = m => ({ l: m.m, m: mix(m.m, '#1a1612', .2), d: mix(m.m, '#1a1612', .44) });
const bodyRing = z => on(PZ(z), rrUV(0, 0, W, D, BR));
function scene(s0, m){
  const FRONT = facing([1,0,0]), LEFT = facing([0,1,0]), MID = midOf(m);
  const bTop = boardTop(-6, -6, W + 6, D + 6, 4, 8);
  // plate
  const A = on(PZ(0), rrUV(-6, -6, W + 6, D + 6, 8));
  let s = loft(A, bTop, n => tone(n, PLATE)) + fill(pd(bTop), PLATE_TOP) + ink(pd(bTop), 1) + hullInk([...A, ...bTop], 1.6);
  // cast shadow of the body and the globe, on the plate
  const globeRing = on(PZ(GC[2]), ellUV(GC[0], GC[1], GR, GR, 24));
  s += castShadow([...bodyRing(4), ...bodyRing(H), ...globeRing, [GC[0], GC[1], GC[2] + GR + 9]], 4, bTop);

  // ---- things sticking out of the front (sorted for the camera) ----
  const co = coinOut();
  const parts = byDepth([
    { at:[W + 4, CRK[0], CRK[1]], svg: crank(m) },
    { at:[W + 5, 57, 7], svg: tray() },
    co ]);

  // ---- body: rounded box ----
  let body = loft(bodyRing(4), bodyRing(H), n => tone(n, m)) + fill(pd(bodyRing(H)), mix(m.l, '#ffffff', .22)) + ink(pd(bodyRing(H)), 1.2);
  if (FRONT){
    const F = W + .15, F2 = W + .3;
    // name strip
    body += shape(frP(F, 10, 5, 74, 13.5, 2.5), '#fff4d6', 1) + gbText([F2, 42, H - 11.6], [0,-1,0], 'GUMBALLS', 6, INK, 900, 'middle', '1');
    // coin slot plate and the price
    body += act('slot', shape(frP(F, 51, 16, 69, 31, 3), STEELM.l, 1.1) + shape(frP(F2, 58.5, 19, 61.5, 28, 1), HOLE, .8));
    body += gbText([F2, 24, H - 35.5], [0,-1,0], '25 CENTS', 3.6, INK, 800);
    // chute opening, with the gum while it is still inside
    const ch = frP(F, 16, 55, 38, 67, 3);
    body += fill(pd(ch), '#2b2622');
    const g = gumOut();
    if (g && g.x < W + 1) body += clipTo(ch, gbBall([g.x, 57, 12.1], 4.5, g.col, 1));
    body += ink(pd(ch), 1.2);
  }
  if (LEFT){
    // the three steps, each with a lamp that lights when it is your turn
    const Y = D + .2, dec = mix(m.d, '#ffffff', .22), tc = mix(m.d, '#000000', .45);
    body += shape(on(PY(Y), rrUV(8, H - 56, 62, H - 12, 6)), dec, 1);
    const step = st.phase === 'idle' ? 0 : (st.phase === 'tray' ? 2 : 1);
    const blink = st.phase === 'idle' && st.wig < 900 ? Math.floor(st.wig / 150) % 2 === 0 : true;
    ['INSERT COIN', 'TURN CRANK', 'TAKE GUM'].forEach((t, i) => {
      const z = H - 22 - i*12;
      body += shape(on(PY(Y + .1), ellUV(15, z, 2.6, 2.6, 16)), i === step && blink ? LAMP : LAMP_OFF, .7);
      body += gbText([21, Y + .15, z - 2], [1,0,0], `${i+1} ${t}`, 4.7, tc, 800, 'start', '0');
    });
  }
  body += hullInk([...bodyRing(4), ...bodyRing(H)], 2.8);
  const xk = ease(st.xr || 0);
  if (xk > 0){ const gb = `<g opacity="${f(1 - .8*xk)}">${body}</g>`, mk = `<g opacity="${f(xk)}">${gumMech()}</g>`; s += FRONT ? gb + mk + parts : parts + gb + mk; }
  else s += FRONT ? body + parts : parts + body;

  // ---- neck, globe, collar, lid (all above the top: always in front of the body) ----
  const g0 = s.length;   // in see-through they fade back so the gumball wheel under them shows
  s += cyl(GC[0], GC[1], H, H + 4, 20, MID, tone, 1.4, 32);
  const [gx, gy] = P(...GC), GS = GR * SPH;
  const circ = `cx="${gbF(gx)}" cy="${gbF(gy)}" r="${gbF(GS)}"`;
  s += `<circle ${circ} fill="#e3eef1" opacity=".55"/>`;
  const collar = gbBand(GC[0], GC[1], H + 4, H + 7.5, 21.5, MID, 1.2), collarFront = PITCH < 37;
  if (!collarFront) s += collar;
  const balls = byDepth(st.globe.map(b => ({ at: b.at, svg: gbBall(b.at, b.r, b.col, .7) })));
  s += `<clipPath id="gb-globe"><circle cx="${gbF(gx)}" cy="${gbF(gy)}" r="${gbF(GS - .4)}"/></clipPath><g clip-path="url(#gb-globe)">${balls}</g>`;
  s += `<circle ${circ} fill="#cfe9f0" opacity=".22" pointer-events="none"/>`;
  s += `<path d="M${gbF(gx - GS*.72)} ${gbF(gy - GS*.12)}A${gbF(GS*.8)} ${gbF(GS*.8)} 0 0 1 ${gbF(gx - GS*.1)} ${gbF(gy - GS*.78)}L${gbF(gx - GS*.06)} ${gbF(gy - GS*.66)}A${gbF(GS*.68)} ${gbF(GS*.68)} 0 0 0 ${gbF(gx - GS*.6)} ${gbF(gy - GS*.06)}Z" fill="#fff" opacity=".38" pointer-events="none"/>`;
  s += `<circle ${circ} fill="none" stroke="${INK}" stroke-width="1.8"/>`;
  if (collarFront) s += collar;
  s += cyl(GC[0], GC[1], GC[2] + GR - 6, GC[2] + GR + 1, 15, MID, tone, 1.4, 32) + gbBall([GC[0], GC[1], GC[2] + GR + 5], 4.2, MID.l, 1);
  if (xk > 0) s = s.slice(0, g0) + `<g opacity="${f(1 - .6*xk)}">${s.slice(g0)}</g>`;

  // ---- labels: the working parts behind the window, only while the front faces us ----
  return s;
}

/* pills in a column beside the machine, on the side the front faces, sorted top to bottom so leaders never cross */
function labels(m){
  const XM = W - WIN_D + .2;
  const items = [
    { at:[XM, D - 26, H - 19.6], text:'GUMS',  on: st.phase === 'turn' },
    { at:[XM, D - 38.4, H - 28.5], text:'COIN', on: st.phase === 'coin' || st.phase === 'ready' },
    { at:[XM, D - 26 - 6.5, H - 32 - 6.5], text:'WHEEL', on: st.phase === 'turn' } ];
  const box3 = [];
  for (const x of [-6, W + 14]) for (const y of [-6, D + 6]) for (const z of [0, H]) box3.push(P(x, y, z));
  const side = P(W, D/2, H/2)[0] > P(0, D/2, H/2)[0] ? 1 : -1;
  const xs = box3.map(p => p[0]), k = INK_K, fs = 8.6*k, gap = fs*1.8 + 4*k;
  const colX = side > 0 ? Math.max(...xs) + 16*k : Math.min(...xs) - 16*k;
  const pts = items.map(it => ({ ...it, p: P(...it.at) })).sort((a, b) => a.p[1] - b.p[1]);
  let y = -1e9, s = '';
  if (side > 0){
    // front toward screen right: the crank sits right beside the window. Each leader drops out of the window, runs along
    // the strip of face between the window and the chute, drops again in the gap between the chute and the crank, and
    // runs out flat under the crank. Rightmost point -> highest run and nearest pill, so no two leaders cross; the pills
    // are staggered so a lower run passes just under the pills above it.
    const y0 = P(W + 3, CRK[0], CRK[1] - CRANK_R)[1] + 2.5, dy = 6.5;
    let cx = colX;
    pts.sort((a, b) => b.p[0] - a.p[0]).forEach((it, i) => {
      const zs = 20.6 - i*1.2, ye = 34 + i*3, py = y0 + i*dy;
      const a1 = P(it.at[0], it.at[1], zs), a2 = P(W + .2, ye, zs), a3 = [a2[0], py];
      const w = it.text.length*fs*.62 + fs*1.5, hgt = fs*1.8;
      s += `<g class="tag${it.on ? ' on' : ''}"><path d="M${f(it.p[0])} ${f(it.p[1])}L${f(a1[0])} ${f(a1[1])}L${f(a2[0])} ${f(a2[1])}L${f(a3[0])} ${f(a3[1])}L${f(cx)} ${f(py)}" fill="none" stroke="${INK}" stroke-width="1"/>`
        + `<circle cx="${f(it.p[0])}" cy="${f(it.p[1])}" r="${f(1.3*k)}" fill="${INK}"/>`
        + `<rect x="${f(cx)}" y="${f(py - hgt/2)}" width="${f(w)}" height="${f(hgt)}" rx="${f(hgt/2)}" fill="${it.on ? 'var(--accent,#f4b829)' : '#fff4d6'}" stroke="${INK}" stroke-width="1.2"/>`

/* ---------- motion: one stepper runs while something moves ---------- */
let ui, gbRunning = false;
function tick(ms){
  st.el += ms; st.wig += ms;
  if (st.phase === 'coin' && st.el >= 700){ st.phase = 'ready'; st.el = 0; }
  else if (st.phase === 'turn' && st.el >= 1400){
    st.k = (st.k + 1) % 4; st.coins++;
    // the pocket now at the bottom (angle 180) drops its gum; the one now at the top refills from the globe
    const at = deg => st.pockets.findIndex((_, j) => ((j + st.k) * 90) % 360 === deg);
    const bottom = at(180), top = at(0);
    const col = st.pockets[bottom]; st.pockets[bottom] = null;
    st.pockets[top] = st.nextCol;
    if (st.globe.length){                                   // the level in the globe drops: take a gum off the top
      let best = 0; st.globe.forEach((b, i) => { const sc = b.at[2]*3 + b.at[0] + b.at[1], o = st.globe[best]; if (sc > o.at[2]*3 + o.at[0] + o.at[1]) best = i; });
      st.globe.splice(best, 1);
    }
    st.nextCol = st.globe.length ? st.globe[Math.floor(st.globe.length / 2)].col : null;
    st.el = 0;
    if (col){ st.phase = 'drop'; st.falling = { v: 38, col }; st.tray = col; }
    else { st.phase = 'idle'; ui.flash('that pocket was empty — refill the globe'); }
  }
  else if (st.phase === 'drop'){ const k = Math.min(1, st.el / 380); st.falling.v = 38 + 18*k*k; if (k >= 1){ st.falling = null; st.phase = 'roll'; st.el = 0; } }
  else if (st.phase === 'roll' && st.el >= 500){ st.phase = 'tray'; st.el = 0; }
  return ['coin', 'turn', 'drop', 'roll'].includes(st.phase) || st.wig < 900;
}
function wake(){
  if (gbRunning) return; gbRunning = true;
  let last = performance.now();
  ui.animate(() => { const n = performance.now(), ms = Math.min(50, Math.max(0, n - last)); last = n;
    const go = tick(ms); if (!go) gbRunning = false; return go; });
}

/* ---------- actions ---------- */
function coin(st, ui){
  if (st.phase === 'tray') return ui.flash('take your gumball first');
  if (st.phase !== 'idle') return ui.flash('one coin at a time');
  st.phase = 'coin'; st.el = 0; wake();
}
function turn(st, ui){
  if (st.phase === 'ready'){ st.phase = 'turn'; st.el = 0; return wake(); }
  if (st.phase === 'idle' || st.phase === 'tray'){            // locked: it only wiggles
    st.wig = 0; wake();
    return ui.flash(st.phase === 'tray' ? 'take your gumball first' : 'locked — insert a coin first');
  }
}
function take(st, ui){
  if (st.phase !== 'tray') return ui.flash(st.phase === 'idle' ? 'the tray is empty — insert a coin and turn the crank' : 'wait for the gumball');
  st.tray = null; st.phase = 'idle';
}
function refill(st, ui){
  if (st.phase !== 'idle' && st.phase !== 'tray') return ui.flash('wait for the gumball first');
  st.globe = fillGlobe(); if (!st.nextCol) st.nextCol = st.globe[0].col;
}

/* ---------- see-through: how a real gumball machine works ----------

           lock pawl on a pivot screw, its spring and the dog that drops into the slot . small gear on the shaft's end
   CHASSIS plate behind the front on four standoffs . coin guide from the slot down to the coin wheel
   WHEEL   crown gear (one crank turn = a quarter turn) . vertical shaft . bearing in the deck . deck with the exit hole .
