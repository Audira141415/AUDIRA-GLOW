<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Vending machine</title>
<style>.mcap{display:none!important}@media (max-width:560px){.stat .v{font-size:20px!important}.stats{align-items:flex-end}}@media (min-width:561px){.vset{top:4px!important}#stats{top:var(--vset-h,44px)!important}}</style><style>@media (max-width:560px){body > header{display:none}}</style><script>window.FIG_A = () => innerWidth <= 560 ? 1.1 : .75;</script><script>window.LBL_U = () => { if (innerWidth > 560) return 0; const s = document.getElementById("fig"); return s && s.clientWidth && s.viewBox.baseVal.width ? s.viewBox.baseVal.width / s.clientWidth : 0; };</script></head>
<body>
<script>/* ============================================================
   Colorfigures core: projection, shapes, shading, ink, page shell.
   A figure page loads this file, then calls mountFigure({...}).
   See BRIEF.md for the drawing contract and conventions.
   ============================================================ */

/* ---------- palettes ---------- */
const PALS = {
  mustard: { l:'#f4b829', m:'#d49c1f', d:'#4e4a18' },
  tomato:  { l:'#ef6a4c', m:'#cf5038', d:'#4a2219' },
  mint:    { l:'#93d3b0', m:'#71b693', d:'#1f4034' },
  cobalt:  { l:'#76a0e2', m:'#5a82c6', d:'#1c2948' },
  blush:   { l:'#f3a6bb', m:'#d8869c', d:'#4b2430' },
};
const METAL   = { l:'#eef0f0', m:'#c6ccce', d:'#8f989b' };
const CLEAR   = { l:'#e4f2f4', m:'#c4dfe4', d:'#97b9c0' };
const CERAMIC = { l:'#fbfaf3', m:'#e3e0d2', d:'#bdb8a6' };
const DARK    = { l:'#55504a', m:'#3d3935', d:'#272421' };
const INK = '#231e16';
const SHADOW = '#41538f';

/* ---------- projection (x = depth toward viewer-right, y = toward viewer-left, z = up) ---------- */
const C = Math.cos(Math.PI/6), S = Math.sin(Math.PI/6);
let OX = 0, OY = 0;
/* Free orthographic camera (internal names start with CAM_ / cam so they never clash with a figure's own names). YAW turns the viewer around the vertical axis (45° = the classic front-left view),
   PITCH is how far it looks down (35.26° = true isometric). At the defaults P() is exactly the old isometric
   projection, so every figure drawn for it still lines up. Drag the figure to orbit; double-click to reset.
   rotV(n) maps a world direction into the default view's frame, so vis / tone / any "sum of rotV > 0" test keep
   working at every angle: the viewer is always (1,1,1) and the light stays put relative to the viewer. */
let VIEW = 0, RC = [0, 0], RCZ = 0;
const VIEW_NAMES = ['front', 'left side', 'back', 'right side'];
const TURNS = [0, 2];
const YAW0 = 45, PITCH0 = Math.atan(1/Math.SQRT2) * 180/Math.PI, CAM_K = Math.sqrt(1.5);
let YAW = YAW0, PITCH = PITCH0, CAM_R, CAM_U, CAM_V, CAM_D;                       // right, up, toward viewer, screen-down
const camBasis = (yaw, pitch) => { const t = yaw*Math.PI/180, p = pitch*Math.PI/180, ct = Math.cos(t), st = Math.sin(t), cp = Math.cos(p), sp2 = Math.sin(p);
  return { R:[st,-ct,0], U:[-sp2*ct,-sp2*st,cp], V:[cp*ct,cp*st,sp2] }; };
const CAM_B0 = camBasis(YAW0, PITCH0);
// CAM_LIM: how far (deg) the camera may turn either side of the front view; null = all the way round (set per figure)
let CAM_LIM = null;
function setCam(yaw, pitch){ YAW = CAM_LIM == null ? yaw : Math.max(YAW0 - CAM_LIM, Math.min(YAW0 + CAM_LIM, yaw));
  PITCH = CAM_LIM == null ? Math.max(6, Math.min(78, pitch)) : Math.max(15, Math.min(62, pitch)); const b = camBasis(YAW, PITCH); CAM_R = b.R; CAM_U = b.U; CAM_V = b.V; CAM_D = CAM_U.map(v => -v); }
setCam(YAW0, PITCH0);
const camDot = (a,b) => a[0]*b[0]+a[1]*b[1]+a[2]*b[2];
const rotV = n => { const r = camDot(n,CAM_R), u = camDot(n,CAM_U), v = camDot(n,CAM_V); return [0,1,2].map(i => CAM_B0.R[i]*r + CAM_B0.U[i]*u + CAM_B0.V[i]*v); };
// the light's ground direction turns with the viewer's yaw only (shadows always fall toward the lower left of the screen)
const yawTurn = ([x,y]) => { const t = (YAW - YAW0)*Math.PI/180, c = Math.cos(t), s = Math.sin(t); return [x*c - y*s, x*s + y*c]; };
const rotXY = (x,y) => [x, y];                                                // kept for old callers
const P0 = (x,y,z) => [(x-y)*C + OX, (x+y)*S - z + OY];                       // raw iso
const P  = (x,y,z) => { const q = [x-RC[0], y-RC[1], z-RCZ];
  return [CAM_K*camDot(q,CAM_R) + (RC[0]-RC[1])*C + OX, CAM_K*camDot(q,CAM_D) + (RC[0]+RC[1])*S - RCZ + OY]; };
const Dv = (x,y,z) => [CAM_K*camDot([x,y,z],CAM_R), CAM_K*camDot([x,y,z],CAM_D)];
// distance toward the viewer: draw parts with smaller depth first
const depthOf = p => camDot(p, CAM_V);
// sort [{at:[x,y,z], svg}] back-to-front for the current camera. A part may also give box:[[x0,y0,z0],[x1,y1,z1]]:
// when two boxes are separated along x, y or z, the one on the viewer's side goes last (a centre point alone gets long
// or wrapping parts wrong: a pole beside a row of keys, a spout reaching past a cup).
const boxMid = b => [0,1,2].map(k => (b[0][k] + b[1][k]) / 2);
const sepOrder = (p, q) => { if (!p.box || !q.box) return 0;
  for (let k = 0; k < 3; k++){ if (p.box[1][k] <= q.box[0][k] + 1e-6) return CAM_V[k] >= 0 ? -1 : 1; if (q.box[1][k] <= p.box[0][k] + 1e-6) return CAM_V[k] >= 0 ? 1 : -1; }
  return 0; };
const byDepth = parts => parts.filter(Boolean).sort((p,q) => sepOrder(p,q) || (depthOf(p.at || boxMid(p.box)) - depthOf(q.at || boxMid(q.box)))).map(p => p.svg).join('');
// the half of a vertical ring that faces the viewer / is turned away, as [from, to] angles in degrees (0 = +x, 90 = +y)
const nearHalf = () => [YAW - 90, YAW + 90], farHalf = () => [YAW + 90, YAW + 270];
// an open container (cup, bin, cone, drum) between two rings: far inner wall, then its contents, then the near outer wall
const openShell = (A, B, colour, contents = '') => loft(A, B, colour, true) + contents + loft(A, B, colour);
const f  = v => v.toFixed(1);
const pd = (pts, close=true) => 'M' + pts.map(p => { const q = P(p[0],p[1],p[2]); return f(q[0])+' '+f(q[1]); }).join('L') + (close ? 'Z' : '');
const sp = pts => 'M' + pts.map(q => f(q[0])+' '+f(q[1])).join('L') + 'Z';

/* ---------- 2D shapes in a plane's (u,v) coords (v up), mapped to 3D by a plane ---------- */
const arcUV  = (cu,cv,r,a0,a1,n=7) => { const o=[]; for (let i=0;i<=n;i++){ const a=(a0+(a1-a0)*i/n)*Math.PI/180; o.push([cu+r*Math.cos(a), cv+r*Math.sin(a)]); } return o; };
const rrUV   = (u0,v0,u1,v1,r,n=7) => r <= 0 ? rectUV(u0,v0,u1,v1) : [...arcUV(u1-r,v0+r,r,-90,0,n), ...arcUV(u1-r,v1-r,r,0,90,n), ...arcUV(u0+r,v1-r,r,90,180,n), ...arcUV(u0+r,v0+r,r,180,270,n)];
const rectUV = (u0,v0,u1,v1) => [[u0,v0],[u1,v0],[u1,v1],[u0,v1]];
const ellUV  = (cu,cv,ru,rv,n=24) => Array.from({length:n}, (_,i) => { const a=i/n*2*Math.PI; return [cu+ru*Math.cos(a), cv+rv*Math.sin(a)]; });
const PX = x => ([u,v]) => [x,u,v];      // front-facing plane x = const   (u = y, v = z)
const PY = y => ([u,v]) => [u,y,v];      // side plane y = const           (u = x, v = z)
const PZ = z => ([u,v]) => [u,v,z];      // horizontal plane z = const     (u = x, v = y)
const on = (plane, uv) => uv.map(plane);

/* ---------- vectors + shading ---------- */
const sub=(a,b)=>[a[0]-b[0],a[1]-b[1],a[2]-b[2]], dot=(a,b)=>a[0]*b[0]+a[1]*b[1]+a[2]*b[2];
const cross=(a,b)=>[a[1]*b[2]-a[2]*b[1], a[2]*b[0]-a[0]*b[2], a[0]*b[1]-a[1]*b[0]];
const norm=a=>{ const l=Math.hypot(...a)||1; return a.map(v=>v/l); };
const avg=ps=>ps.reduce((s,p)=>[s[0]+p[0]/ps.length,s[1]+p[1]/ps.length,s[2]+p[2]/ps.length],[0,0,0]);
const vis = n => { const r = rotV(n); return r[0]+r[1]+r[2] > 1e-6; };   // viewer looks from (+1,+1,+1) after the turn
const facing = vis;                                                       // readable alias: is this face toward the viewer?
const SHADOW_K = 0.85, AZ_MIN = 20, AZ_MAX = 160;
let L = [0,0,1], SH = [0,0];
function setLight(deg){ const a=deg*Math.PI/180; SH=[SHADOW_K*Math.cos(a), SHADOW_K*Math.sin(a)]; L=norm([-SH[0],-SH[1],1]); }
const LIN = norm([.6,.2,1]);                       // fixed light for interiors / small props
// Three flat tones, but blended across a narrow band at each step, so a face that turns past a threshold while the
// figure rotates fades between tones instead of snapping (at rest almost every face still sits on a pure tone).
const SOFT = .18;
const step3 = (d, hi, lo, m) => { const ss = (a, b, x) => { const k = Math.min(1, Math.max(0, (x - a)/(b - a))); return k*k*(3 - 2*k); };
  const a = ss(hi - SOFT, hi + SOFT, d), b = ss(lo - SOFT, lo + SOFT, d);
  return a >= 1 ? m.l : b <= 0 ? m.d : a > 0 ? mix(m.m, m.l, a) : b < 1 ? mix(m.d, m.m, b) : m.m; };
const tone  = (n,m) => step3(dot(rotV(n),L),   -.15, -.45, m);   // exterior, follows the sun
const toneI = (n,m) => step3(dot(rotV(n),LIN),  .6,   .05, m);   // interior / props
const mix = (a,b,t) => '#' + [1,3,5].map(i => Math.round(parseInt(a.substr(i,2),16)*(1-t) + parseInt(b.substr(i,2),16)*t).toString(16).padStart(2,'0')).join('');
const matOf = hex => ({ l:hex, m:mix(hex,'#000000',.16), d:mix(hex,'#000000',.42) });
const ease = t => t<.5 ? 2*t*t : 1-Math.pow(-2*t+2,2)/2;

/* ---------- drawing primitives (all return SVG strings) ---------- */
const ink   = (d,w=1.4) => `<path d="${d}" fill="none" stroke="${INK}" stroke-width="${w}" stroke-linejoin="round" stroke-linecap="round"/>`;
const fill  = (d,c,extra='') => `<path d="${d}" fill="${c}" ${extra}/>`;
const face  = (d,c) => `<path d="${d}" fill="${c}" stroke="${c}" stroke-width=".7" stroke-linejoin="round"/>`;
const shape = (pts,c,w=1.2) => fill(pd(pts),c) + (w ? ink(pd(pts),w) : '');
const line  = (pts,w=1.2) => ink(pd(pts,false),w);
// Loft between two rings of equal length (closed). colour(n) picks each strip's fill; flip = seen from inside.
function loft(A, B, colour, flip=false){
  const n=A.length, cen=avg(A.concat(B)); let s='';
  for (let i=0;i<n;i++){
    const a0=A[i], a1=A[(i+1)%n], b1=B[(i+1)%n], b0=B[i];
    let nr = norm(cross(sub(a1,a0), sub(b0,a0)));
    if (!isFinite(nr[0])) continue;
    if (dot(nr, sub(avg([a0,a1,b1,b0]), cen)) < 0) nr = nr.map(v=>-v);
    if (flip) nr = nr.map(v=>-v);
    if (vis(nr)) s += face(pd([a0,a1,b1,b0]), colour(nr));
  }
  return s;
}
function hull(pts){
  pts = pts.slice().sort((a,b)=>a[0]-b[0]||a[1]-b[1]);
  const cr=(o,a,b)=>(a[0]-o[0])*(b[1]-o[1])-(a[1]-o[1])*(b[0]-o[0]); const lo=[], up=[];
  for (const p of pts){ while(lo.length>=2 && cr(lo[lo.length-2],lo[lo.length-1],p)<=0) lo.pop(); lo.push(p); }
  for (const p of pts.reverse()){ while(up.length>=2 && cr(up[up.length-2],up[up.length-1],p)<=0) up.pop(); up.push(p); }
  lo.pop(); up.pop(); return lo.concat(up);
}
const hullInk = (pts3,w=1.4) => ink(sp(hull(pts3.map(p=>P(...p)))), w);
// Axis-aligned box: three visible faces, shaded, each outlined. shade = tone (sunlit) or toneI (interior).
function box(x0,y0,z0,x1,y1,z1,m,shade=toneI,w=1){
  // all six faces, drawn only when they face the viewer (sides first, then top) — correct in every VIEW
  const F = [
    [[0,1,0],  [[x0,y1,z0],[x1,y1,z0],[x1,y1,z1],[x0,y1,z1]]],
    [[1,0,0],  [[x1,y0,z0],[x1,y1,z0],[x1,y1,z1],[x1,y0,z1]]],
    [[0,-1,0], [[x0,y0,z0],[x1,y0,z0],[x1,y0,z1],[x0,y0,z1]]],
    [[-1,0,0], [[x0,y0,z0],[x0,y1,z0],[x0,y1,z1],[x0,y0,z1]]],
    [[0,0,1],  [[x0,y0,z1],[x1,y0,z1],[x1,y1,z1],[x0,y1,z1]]] ];
  return F.filter(([n]) => vis(n)).map(([n,q]) => shape(q, shade(n,m), w)).join('');
}
// Rounded-profile extrusion: profile (u=y, v=z) swept along x from x0 to x1. Body of most machines.
function extrude(profileUV, x0, x1, m, shade=tone){ return loft(on(PX(x0),profileUV), on(PX(x1),profileUV), n=>shade(n,m)); }
// Vertical cylinder (axis z) centred (x,y), radius r from z0 to z1, with top cap.
function cyl(x,y,z0,z1,r,m,shade=toneI,w=1.2,n=24){
  const A=on(PZ(z0),ellUV(x,y,r,r,n)), B=on(PZ(z1),ellUV(x,y,r,r,n));
  return loft(A,B,nr=>shade(nr,m)) + fill(pd(B),shade([0,0,1],m)) + hullInk([...A,...B],w) + ink(pd(B),w*.8);
}
// Cylinder lying along x (e.g. a knob or dial sticking out of a front face): centred (y,z), from x0 to x1.
function cylX(x0,x1,y,z,r,m,shade=toneI,w=1.1,n=20){
  const A=on(PX(x0),ellUV(y,z,r,r,n)), B=on(PX(x1),ellUV(y,z,r,r,n));
  // cap on whichever end faces the viewer (the +x end in VIEW 0)
  const capB = vis([1,0,0]), cap = capB ? B : A, cn = capB ? [1,0,0] : [-1,0,0];
  return loft(A,B,nr=>shade(nr,m)) + (vis(cn) ? fill(pd(cap),shade(cn,m)) : '') + hullInk([...A,...B],w) + (vis(cn) ? ink(pd(cap),w*.8) : '');
}
// Cylinder between any two 3D points a and b (a lamp arm, a rod, a pipe at an angle, a handle bar), radius r.
// The end facing the viewer gets a cap. For a tapered part (a cone, a lamp shade) pass r1 for the radius at b.
function rod(a, b, r, m, shade=toneI, w=1, r1=r, n=16){
  const d = norm(sub(b, a)), u = norm(cross(d, Math.abs(d[2]) < .9 ? [0,0,1] : [1,0,0])), v = cross(d, u);
  const ring = (p, rr) => Array.from({length:n}, (_,i) => { const t = i/n*2*Math.PI, c = Math.cos(t)*rr, s2 = Math.sin(t)*rr;
    return [p[0] + u[0]*c + v[0]*s2, p[1] + u[1]*c + v[1]*s2, p[2] + u[2]*c + v[2]*s2]; });
  const A = ring(a, r), B = ring(b, r1), capB = vis(d), cap = capB ? B : A, cn = capB ? d : d.map(x => -x);
  return loft(A, B, nr => shade(nr, m)) + (Math.max(r, r1) > 0 ? fill(pd(cap), shade(cn, m)) + ink(pd(cap), w*.8) : '') + hullInk([...A, ...B], w);
}
// Text lying flat on a front plane x = const, centred at (y,z) baseline; reads left-to-right on screen.
// text sits on a face: if its reading direction comes out mirrored (or edge-on), that face is turned away, so the text is hidden
const txM = (o, U, V) => (U[0]*V[1] - U[1]*V[0]) <= .02 * Math.hypot(...U) * Math.hypot(...V) ? `matrix(0 0 0 0 ${f(o[0])} ${f(o[1])})` : `matrix(${U[0].toFixed(4)} ${U[1].toFixed(4)} ${V[0].toFixed(4)} ${V[1].toFixed(4)} ${f(o[0])} ${f(o[1])})`;
const tx = (x,y,z,str,size,col=INK,weight=700) => { const o=P(x,y,z);
  return `<text transform="${txM(o, Dv(0,-1,0), Dv(0,0,-1))}" font-size="${size}" fill="${col}" text-anchor="middle" font-family="ui-monospace,Menlo,monospace" font-weight="${weight}" letter-spacing=".04em">${str}</text>`; };
// Text on a side plane y = const, centred at (x,z).
const txY = (x,y,z,str,size,col=INK,weight=700) => { const o=P(x,y,z);
  return `<text transform="${txM(o, Dv(1,0,0), Dv(0,0,-1))}" font-size="${size}" fill="${col}" text-anchor="middle" font-family="ui-monospace,Menlo,monospace" font-weight="${weight}" letter-spacing=".04em">${str}</text>`; };
// Cast shadow of a set of 3D points (any outline of the object), pushed along the light onto z = 0.
// the light stays put relative to the viewer, so the shadow is cast in turned coordinates
const castShadow = pts3 => { const [sx, sy] = yawTurn(SH); return fill(sp(hull(pts3.map(([x,y,z]) => P(x+z*sx, y+z*sy, 0)))), SHADOW); };   // the light stays with the viewer
// Group helpers: clickable target, clip to an opening.
const act  = (name, inner, data='') => `<g data-act="${name}" ${data}>${inner}</g>`;
let _clipN = 0;
const clipTo = (pts3, inner) => { const id = 'k' + (++_clipN); return `<clipPath id="${id}"><path d="${pd(pts3)}"/></clipPath><g clip-path="url(#${id})">${inner}</g>`; };

/* ---------- constant on-screen line weight ----------
   Stroke widths are written in model units, and each figure is zoomed to fill the frame, so a small
   object would get fat lines. INK_K rescales every stroke-width (and the wobble/grain filter) so all
   figures match the reference zoom of the booth / vending machine (viewBox ≈ 585 units wide). */
const INK_REF_VB = 585;
let INK_K = 1;
const inkScale = svg => INK_K === 1 ? svg : svg.replace(/stroke-width="([\d.]+)"/g, (_, w) => `stroke-width="${(+w * INK_K).toFixed(2)}"`);

/* ---------- page shell ---------- */
const CORE_CSS = `
  :root{--paper:#f2efe7;--ink:#231e16;--muted:#857d6e;--rule:#ddd6c8}
  *{box-sizing:border-box} html,body{margin:0;height:100%}
  body{background-color:var(--paper);
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='320' height='320'><filter id='p'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='3' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .42  0 0 0 0 .39  0 0 0 0 .33  .16 0 0 0 0'/></filter><rect width='100%' height='100%' filter='url(%23p)'/></svg>");
    overflow-x:hidden;color:var(--ink);font:13px/1.4 ui-monospace,SFMono-Regular,Menlo,monospace;display:flex;flex-direction:column;align-items:center;padding:24px 16px 32px}
  header{width:100%;max-width:760px;display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap}
  header h1{font-size:13px;font-weight:600;margin:0;letter-spacing:.02em} header span{color:var(--muted)}
  #fig{width:100%;max-width:760px;height:auto;display:block;margin:4px 0 8px;user-select:none;overflow:visible}
  #fig{cursor:grab;touch-action:pan-y} #fig.drag{cursor:grabbing} #fig [data-act]{cursor:pointer}
  #readout, .idea{display:none}   /* status line + big idea are off: the buttons and motion tell the story */
  .idea{width:100%;max-width:760px;margin:-6px 0 16px;font-size:12.5px;line-height:1.5;text-align:center;color:var(--ink)}
  .idea strong{letter-spacing:.12em;text-transform:uppercase;font-size:11px;margin-right:8px}
  #readout{position:relative;min-height:1.4em;letter-spacing:.08em;text-transform:uppercase;margin-bottom:14px;text-align:center;text-shadow:0 0 3px var(--paper),0 0 6px var(--paper),0 0 10px var(--paper)}
  .stage{position:relative;width:100%;max-width:760px}
  .actions{position:absolute;top:4px;left:0;display:flex;flex-direction:column;align-items:flex-start;gap:8px;z-index:2;max-width:220px}
  .actions .cap{color:var(--muted);font-size:11px;letter-spacing:.08em;text-transform:uppercase;margin:0 0 2px}
  .turn{position:absolute;right:0;bottom:2%;display:flex;align-items:center;gap:8px;z-index:2;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
  .turn span{min-width:7.5em;text-align:center}
  .tb{font:inherit;font-size:17px;line-height:1;color:var(--ink);background:transparent;border:1.5px solid var(--ink);border-radius:999px;width:34px;height:34px;cursor:pointer;display:grid;place-items:center;padding:0}
  .tb:hover{background:#0000000d}
  #fig{transition:transform .14s ease-in}
  #fig.flip{transform:scaleX(.04)}
  #fig.dragging{cursor:grabbing}
  .stats{position:absolute;top:4px;right:0;display:flex;flex-direction:column;align-items:flex-end;gap:10px;z-index:2;text-align:right}
  .stat .k{font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
  .stat .v{font-size:34px;font-weight:800;line-height:1.05;letter-spacing:-.01em;font-variant-numeric:tabular-nums;color:var(--ink)}
  .stat.small .v{font-size:20px}
  .stat .v.bump{animation:bump .35s ease-out}
  @keyframes bump{0%{transform:scale(1.18)}100%{transform:none}}
  .stepwrap{position:relative;display:flex;align-items:center;gap:8px}

  // ---- control: board, display and keypad modules, power supply
  put([[54, 8, 130], [56.8, 34, 192]], box(54, 8, 130, 56, 34, 192, PCB, toneI, .9)
    + (facing([1,0,0]) ? [[12, 140, 20, 150], [22, 140, 30, 146], [12, 158, 24, 170], [26, 160, 32, 168], [14, 176, 28, 186]].map(([y0, z0, y1, z1]) => box(56, y0, z0, 56.8, y1, z1, DARK, toneI, .5)).join('')

  if (facing([1,0,0])) put([[82, 12, 8], [82.2, 30, 18]], [...Array(5)].map((_, i) => shape(on(PX(82.05), rrUV(13 + i*3.4, 9, 14.6 + i*3.4, 17, .5)), mix(METAL.d, '#000000', .3), .4)).join(''));
  // harness: a trunk down the back corner by the partition, a branch along each motor tray, over to the board
  const TX = T + 2, TY = PART_Y + 3.5;

  parts.push(...vLine([[TX, TY, ROWS[ROWS.length - 1].s + 15], [TX, TY, H - 14], [55, TY - 2, H - 14], [55, 30, 193]], vending ? ON : H_, .8));
  parts.push(...vLine([[56.8, 30, 140], [60, 30, 128], [66, 28, 120]], coinOn ? ON : H_, .55));         // board -> coin mech
  parts.push(...vLine([[56.8, 14, 178], [86, 14, 178]], H_, .5));                                        // board -> display

  parts.push(...vLine([[72, 31, 20], [72, 33, 70], [55, 33, 128]], '#c2300a', .6));                        // power supply -> board
  parts.push(...vLine([[SHELF_X + 3, PART_Y + 3, 45.5], [SHELF_X + 3, PART_Y - 1, 52], [55, 33, 129]], tripped ? ON : H_, .5));   // drop sensor
  // ---- cold: compressor, condenser coil and fan, copper lines up the back corner, evaporator and its fan, thermostat
  put([[12, 78, 4], [30, 96, 22]], cyl(21, 87, 4, 18, 8, DARK, toneI, 1.2, 22) + cyl(21, 87, 18, 21, 5, DARK, toneI, 1, 18));
  let cz = ''; for (let z = 10; z <= 42; z += 4) cz += pd([[T + 1, 40, z], [T + 1, 120, z]], false);
  for (const y of [40, 120]) cz += pd([[T + 1, y, 10], [T + 1, y, 42]], false);
  put([[T, 38, 8], [T + 2, 122, 44]], `<path d="${cz}" fill="none" stroke="${INK}" stroke-width="2.4"/><path d="${cz}" fill="none" stroke="${VCOP.m}" stroke-width="1.2"/>`);
  const fa = t*14;
  let fan = cylX(34, 37, 58, 28, 10, STEELD, toneI, 1, 24);
  for (let i = 0; i < 4; i++){ const a = fa + i*Math.PI/2; fan += ink(pd([[37.1, 58, 28], [37.1, 58 + 8*Math.cos(a), 28 + 8*Math.sin(a)]], false), 1.4); }
  put([[34, 48, 18], [37, 68, 38]], fan);
  parts.push(...vLine([[21, 92, 21], [21, 104, 30], [T + 1, 112, 42]], VCOP.m, .8));                    // compressor -> condenser

  parts.push(...vLine([[T + 8, 116, 206], [T + 7, D - T - 4, 196], [T + 7, D - T - 4, 60], [16, 96, 21]], VCOP.l, 1.1));     // suction line back down
  let ev = box(T + 1, 40, 200, T + 9, 120, 222, STEELD, toneI, .9);
  if (facing([1,0,0])) for (let y = 43; y < 120; y += 3) ev += line([[T + 9.05, y, 201], [T + 9.05, y, 221]], .35);
  put([[T + 1, 40, 200], [T + 9, 120, 222]], ev);
  let ef = cylX(T + 9, T + 12, 80, 211, 8, STEELD, toneI, .9, 22);

  put([[T + 9, 72, 203], [T + 12, 88, 219]], ef);
  bx(T + 9, 100, 196, T + 12, 104, 199, matOf('#d8d2c2'), .5);                                           // thermostat probe

  const s = byDepth(parts);
  MECH_LABELS = k <= .6 ? '' : xrCallouts([

}
function vendSurface(FF, BF){
  const L = [];
  if (FF) L.push({ at:[W+.4, 21, 175], text:'SCREEN', on: !!st.credit }, { at:[W+.5, 21, 136], text:'KEYPAD', on: !!st.press },
                 { at:[W+.5, 21, 106], text:'COIN SLOT', on: false }, { at:[W+.5, 21, 92], text:'RETURN', on: false },
                 { at:[W, 81, 29], text:'PICKUP DOOR', on: !!st.tray }, { at:[W, 81, 130], text:'WINDOW', on: false });
  if (BF) L.push({ at:[0, 30, 30], text:'POWER CORD', on: false });
  return L;

const vendCaption = st => st.drop ? 'Vend: the gearmotor behind that column turns its spiral one turn, until its home switch clicks, and the front item is pushed off the shelf. It falls through the drop sensor’s beams, which tells the board it really came out.'
  : st.credit > 0 ? 'Credit: the coin mechanism checked the coin and dropped it into a change tube (full tubes overflow into the cash box). Press a letter and a number to choose.'
  : 'Cooling: the compressor pumps refrigerant through the condenser on the back wall (its fan carries the heat away) and up to the evaporator at the top, which chills the air its fan blows over the drinks. Insert a coin to start.';

/* ---------- coins in the return cup ---------- */
const COIN = { l:'#f0d27a', m:'#d2ad4a', d:'#9a7a2a' };
const COIN_SPOTS = [[-3.4,21],[-4.6,16.5],[-4.2,25.6],[-2.2,17.8],[-2.4,24.4],[-5.6,20.8]];
function coins(n){
  const pts = [];
  for (let i=0; i<Math.min(n,18); i++){ const [dx,y] = COIN_SPOTS[i % 6]; pts.push([W+dx, y, CUP[1] + .1 + Math.floor(i/6)*1.1]); }
  pts.sort((a,b) => (a[2]-b[2]) || (depthOf([a[0],a[1],0])-depthOf([b[0],b[1],0])));
  let s = '';
  for (const [x,y,z] of pts){
    const A = on(PZ(z), ellUV(x,y,2.6,2.6,16)), B = on(PZ(z+.9), ellUV(x,y,2.6,2.6,16));
    s += loft(A,B,n=>toneI(n,COIN)) + fill(pd(B),COIN.l) + ink(sp(hull([...A,...B].map(p=>P(...p)))),.7) + ink(pd(on(PZ(z+.95),ellUV(x,y,1.5,1.5,12))),.4);
  }
  return s;
}

/* ---------- pickup door: a slab hinged along its bottom edge, drops open toward the viewer ---------- */
const DOOR_MAT = { l:'#55504a', m:'#3d3935', d:'#272421' };   // smoked acrylic: faces see-through, edges solid
const DOOR_MAX = 84;                           // degrees when fully open (almost flat)
function pickupDoor(){
  const th = ease(st.flap) * DOOR_MAX * Math.PI/180;
  const y0 = TRAY[0]+1, y1 = TRAY[2]-1, len = TRAY[3]-TRAY[1]-1.5, t = 2, hx = W-.5, hz = TRAY[1];
  const up = [Math.sin(th),0,Math.cos(th)], out = [Math.cos(th),0,-Math.sin(th)];   // along the door (hinge -> top edge), outward normal
  const Q = (sAlong, w, y) => [hx + sAlong*up[0] - w*out[0], y, hz + sAlong*up[2] - w*out[2]];
  const faces = [
    { n: out,            p: [Q(0,0,y0),Q(0,0,y1),Q(len,0,y1),Q(len,0,y0)], clear: true },
    { n: out.map(v=>-v), p: [Q(0,t,y0),Q(0,t,y1),Q(len,t,y1),Q(len,t,y0)], clear: true },
    { n: up,             p: [Q(len,0,y0),Q(len,0,y1),Q(len,t,y1),Q(len,t,y0)] },
    { n: up.map(v=>-v),  p: [Q(0,0,y0),Q(0,0,y1),Q(0,t,y1),Q(0,t,y0)] },
    { n: [0,1,0],        p: [Q(0,0,y1),Q(len,0,y1),Q(len,t,y1),Q(0,t,y1)] },
    { n: [0,-1,0],       p: [Q(0,0,y0),Q(len,0,y0),Q(len,t,y0),Q(0,t,y0)] },   // the other end edge (seen from the right side)
  ];
  let s = '';
  for (const fc of faces) if (vis(fc.n))
    s += fc.clear ? fill(pd(fc.p), tone(fc.n, DOOR_MAT), 'fill-opacity=".34"') + ink(pd(fc.p),1.1) : shape(fc.p, tone(fc.n, DOOR_MAT), 1.1);
  if (vis(out)){
    s += fill(pd([Q(len*.15,-.1,y0+10),Q(len*.15,-.1,y0+18),Q(len*.85,-.1,y0+34),Q(len*.85,-.1,y0+26)]), '#ffffff', 'opacity=".28"');   // glint
    const yc = (y0+y1)/2;
    s += shape([Q(len-3.2,-.1,yc-16),Q(len-3.2,-.1,yc+16),Q(len-1.3,-.1,yc+16),Q(len-1.3,-.1,yc-16)], DOOR_MAT.d, .9);   // finger grip
    const o = P(...Q(len*.66,-.15,yc));
    s += `<text transform="${txM(o, Dv(0,-1,0), Dv(-up[0],0,-up[2]))}" font-size="4.6" fill="#e9e3d3" text-anchor="middle" dominant-baseline="middle" font-family="ui-monospace,Menlo,monospace" font-weight="800" letter-spacing=".25em">PULL</text>`;
  }
  s += ink(pd([[hx,y0-1,hz],[hx,y1+1,hz]],false),1.8);   // hinge
  return `<g data-act="flap">${s}</g>`;
}

/* ---------- scene ---------- */
const OUT = rrUV(0,0,D,H,R), IN = rrUV(T,T,D-T,H-T,R-T);
const money = v => '$' + v.toFixed(2);

function screenLines(){
  if (st.msg) return st.msg.split('|');
  if (st.drop) return st.drop.hang ? ['NO DROP', st.drop.code] : ['VENDING', st.drop.code];
  if (st.tray) return ['TAKE', 'ITEM'];
  if (st.sel) return ['SELECT', st.sel + '_'];
  return st.credit > 0 ? ['CREDIT', money(st.credit)] : ['INSERT', 'COIN'];
}

function scene(){
  const m = PALS[st.pal];
  // which faces of the cabinet are toward the viewer in the current turn
  const FF = facing([1,0,0]), BF = facing([-1,0,0]), LF = facing([0,1,0]), RF = facing([0,-1,0]);
  let s = '';

  // cast shadow
  s += castShadow([...on(PX(0),OUT), ...on(PX(W),OUT)]);

  // parts on hidden faces that stick out past the body go first, so the body covers them
  if (!FF) s += pickupDoor();
  if (!BF) s += powerCord();

  // front: openings, front face, everything mounted on it (only when the front is toward the viewer)
  let body = FF ? frontAssembly(m) : '';

  // outer shell + side details
  body += loft(on(PX(0),OUT), on(PX(W),OUT), n=>tone(n,m));
  if (LF) body += leftSide(m);
  if (RF) body += rightSide(m);
  if (BF) body += backPanel(m);

  // silhouette
  if (FF) body += ink(pd(on(PX(W),OUT)),2.2);
  if (BF) body += ink(pd(on(PX(0),OUT)),2.2);
  body += hullInk([...on(PX(0),OUT), ...on(PX(W),OUT)], 2.8);
  // see-through: the working parts inside, behind a ghost of the case
  const k = ease(st.xr || 0);
  s += k > 0 ? xrGhost(body, vendMech(k), k, OUT, 0, W, m) : body;
  if (BF) s += powerCord();            // the cord lies on the viewer's side of the back panel
  s += k > .6 ? MECH_LABELS : xrCallouts(vendSurface(FF, BF), [0, W, 0, D, 0, H]);
  return s;
}

function frontAssembly(m){
  let s = '';
  const LW = facing([0,1,0]);          // which side wall of an opening we look at: y0-wall (view 0) or y1-wall (view 3)
  const win = rectUV(WIN[0],WIN[1],WIN[2],WIN[3]), tray = rectUV(TRAY[0],TRAY[1],TRAY[2],TRAY[3]);
  s += `<clipPath id="cWin"><path d="${pd(on(PX(W),win))}"/></clipPath><clipPath id="cTray"><path d="${pd(on(PX(W),tray))}"/></clipPath>`;

  // interior behind the glass: lit cabinet, shelves bottom-up, products back-to-front
  let it = fill(pd(on(PX(T),IN)), '#e8eef0');
  it += loft(on(PX(T),IN), on(PX(W-3),IN), n => n[2]>.7 ? '#d3dbde' : '#dfe7e9', true);
  it += fill(pd(on(PY(LW ? T+.2 : D-T-.2),rectUV(T+10,60,W-10,206))), '#ffffff', 'opacity=".8"');   // light strip on the visible side wall
  for (let r = ROWS.length-1; r >= 0; r--){
    const row = ROWS[r], z = row.s;
    it += shape([[T,T,z],[SHELF_X,T,z],[SHELF_X,D-T,z],[T,D-T,z]], '#cfd6d8', 0);
    const items = [];
    COL_Y.forEach((y,c) => { for (let k = st.stock[r][c]-1; k >= 0; k--) items.push({ x:ITEM_X-k*ITEM_STEP, y, c }); });
    items.sort((a,b) => depthOf([a.x,a.y,0]) - depthOf([b.x,b.y,0]));
    for (const o of items) it += `<g data-act="item" data-r="${r}" data-c="${o.c}">${ITEM[row.kind](o.x,o.y,z,row.cols[o.c])}</g>`;
    it += shape([[SHELF_X,T,z-3],[SHELF_X,D-T,z-3],[SHELF_X,D-T,z],[SHELF_X,T,z]], '#a9b1b4', 1);
    COL_Y.forEach((y,c) => {
      it += shape(on(PX(SHELF_X+.2),rectUV(y-5,z-2.7,y+5,z-.3)), st.stock[r][c] ? '#fffdf5' : '#f3c6bd', .6);
      it += tx(SHELF_X+.3, y, z-.9, row.code+(c+1), 2.1, INK);
    });
  }
  if (st.drop){
    const { r, c } = st.drop, t = st.drop.t, row = ROWS[r];
    const slide = Math.min(1, t/.25) * 10, fall = (t > .25 ? 260*Math.pow((t-.25)/.75, 2) : 0) ;
    it += vendHang(ITEM[row.kind](ITEM_X+slide, COL_Y[c], row.s-fall, row.cols[c]), COL_Y[c], row.s);
  }
  s += `<g clip-path="url(#cWin)">${it}</g>`;

  // glass: tint, streaks, window reveal
  const GX = PX(W-2.9), wy = LW ? WIN[0] : WIN[2];
  s += `<g pointer-events="none">${fill(pd(on(GX,win)),'#cfe9f0','opacity=".2"')}`
     + fill(pd(on(GX,[[52,62],[66,62],[102,196],[88,196]])),'#ffffff','opacity=".38"')
     + fill(pd(on(GX,[[72,62],[77,62],[113,196],[108,196]])),'#ffffff','opacity=".38"') + `</g>`;
  s += face(pd([[W-3,wy,WIN[1]],[W,wy,WIN[1]],[W,wy,WIN[3]],[W-3,wy,WIN[3]]]), tone([0,LW?1:-1,0],m));
  s += face(pd([[W-3,WIN[0],WIN[1]],[W,WIN[0],WIN[1]],[W,WIN[2],WIN[1]],[W-3,WIN[2],WIN[1]]]), tone([0,0,1],m));

  // pickup tray: dark cavity + product (the door is drawn after the front face)
  const tb = W-18, ty = LW ? TRAY[0] : TRAY[2];
  let tr = shape(on(PX(tb),rectUV(TRAY[0],14,TRAY[2],TRAY[3])), m.d, 0);
  tr += face(pd([[tb,ty,14],[W,ty,14],[W,ty,TRAY[3]],[tb,ty,TRAY[3]]]), mix(m.d,'#000000',.25));
  tr += face(pd([[tb,TRAY[0],14],[W,TRAY[0],14],[W,TRAY[2],14],[tb,TRAY[2],14]]), mix(m.d,'#ffffff',.12));
  if (st.tray) tr += lying(st.tray.kind, st.tray.col);
  s += `<g clip-path="url(#cTray)" data-act="tray">${fill(pd(on(PX(W),tray)),'transparent')}${tr}</g>`;

  // coin-return cup: small cavity with the refunded coins lying in it
  const cup = rectUV(CUP[0],CUP[1],CUP[2],CUP[3]), cb = W-8, cy = LW ? CUP[0] : CUP[2];
  s += `<clipPath id="cCup"><path d="${pd(on(PX(W),cup))}"/></clipPath>`;
  let cp = shape(on(PX(cb),cup), mix(METAL.d,'#000000',.45), 0);
  cp += face(pd([[cb,cy,CUP[1]],[W,cy,CUP[1]],[W,cy,CUP[3]],[cb,cy,CUP[3]]]), mix(METAL.d,'#000000',.3));
  cp += face(pd([[cb,CUP[0],CUP[1]],[W,CUP[0],CUP[1]],[W,CUP[2],CUP[1]],[cb,CUP[2],CUP[1]]]), METAL.m);
  cp += coins(Math.round(st.returned / .5));
  s += `<g clip-path="url(#cCup)" data-act="cup">${fill(pd(on(PX(W),cup)),'transparent')}${cp}</g>`;

  // front face with its openings
  const X = PX(W);
  s += `<path d="${pd(on(X,OUT))}${pd(on(X,win))}${pd(on(X,tray))}${pd(on(X,cup))}" fill="${tone([1,0,0],m)}" fill-rule="evenodd"/>`;
  s += ink(pd(on(X,win)),1.8) + ink(pd(on(X,tray)),1.6) + ink(pd(on(X,cup)),1.4);
  s += shape(on(PX(W+.3),rrUV(10,62,32,82,3)), 'none', 1);   // metal bezel line
  s += ink(pd([[W,36,8],[W,36,200]],false),1) + ink(pd([[W,36,200],[W,124,200]],false),1);
  s += pickupDoor();

  // header sign
  const F = PX(W+.3);
  s += shape(on(F,rrUV(8,204,122,224,4)), '#fff4d6', 1.4);
  s += tx(W+.4, 65, 211, 'DRINKS · SNACKS', 8.4, m.d, 800);

  // control column: screen, keypad, coin slot, return
  s += shape(on(F,rrUV(9,164,33,186,2.5)), '#1d2a26', 1.3);
  const [l1,l2] = screenLines();
  s += tx(W+.4, 21, 177.5, l1, 3.9, '#8af0ae', 700) + tx(W+.4, 21, 169.5, l2, 3.9, '#8af0ae', 700);
  const keys = [];
  ['A','B','C','D'].forEach((k,i) => keys.push({ k, y:26.5, z:152-i*11 }));
  ['1','2','3','4'].forEach((k,i) => keys.push({ k, y:15.5, z:152-i*11 }));
  for (const key of keys){
    const down = st.press === key.k;
    let b = shape(on(F,rrUV(key.y-4.6,key.z,key.y+4.6,key.z+8,2)), down ? METAL.d : METAL.l, 1.1);
    b += tx(W+.5, key.y, key.z+2.4, key.k, 4.4, INK, 700);
    s += `<g data-act="key" data-k="${key.k}">${b}</g>`;
  }
  s += `<g data-act="coin">${shape(on(F,rrUV(11,100,31,112,2.5)), METAL.m, 1.2)}${shape(on(PX(W+.5),rrUV(20,102,22.4,110,1)), '#26231f', .6)}${tx(W+.5, 26.5, 103.5, '¢', 4, INK)}</g>`;
  s += `<g data-act="ret">${shape(on(F,ellUV(21,92,3.6,3.6)), METAL.l, 1.1)}${tx(W+.5, 21, 90.6, '↩', 3.6, INK)}</g>`;
  return s;
}

// a lighter take on the body palette for the side decals
const decalPal = m => ({ l:mix(m.l,'#ffffff',.15), m:mix(m.m,'#ffffff',.12), d:mix(m.d,'#ffffff',.1) });
// decal lettering takes the face colour; on a sunlit face that would vanish into the lighter panel, so go a step darker
const decalInk = (n,m) => { const c = tone(n,m); return c === m.l ? mix(m.m,'#000000',.12) : c; };

// +y side (viewer-left in the front view): low vents and the COLD decal
function leftSide(m){
  let s = '', v = '';
  for (const z of [14,19,24,29]) v += pd([[18,D+.2,z],[W-18,D+.2,z]],false);
  s += `<path d="${v}" fill="none" stroke="${INK}" stroke-width="1.6" stroke-linecap="round" opacity=".75"/>`;
  s += shape(on(PY(D+.2),rrUV(20,150,W-20,200,6)), tone([0,1,0],decalPal(m)), 1.2);

/* ---------- behaviour ---------- */
let ui;
const render = () => ui.render();

function vend(r, c){

    if (st.drop.t >= 1){ st.tray = { kind:row.kind, col:row.cols[c], code }; st.drop = null; render(); return; }

function key(k){
  press(k);

const coin = () => { if (st.credit >= 5) return flash('MAX|$5.00'); st.credit += .5; st.coinFx = performance.now(); render(); setTimeout(render, 950); };
const refund = () => {

// shake: the cabinet rocks on its front-bottom edge for a moment; an item caught on its coil shakes loose halfway and
// carries on falling (through the drop sensor, into the bin)
let shaking = false;
function shake(){
  if (shaking) return; shaking = true;

  if (!loose) ui.flash(st.drop ? 'Shaking…' : 'Nothing is stuck');
  const step = now => { const t = (now - t0)/900, [px, py] = P(W, D/2, 0);
    if (t >= 1){ art.removeAttribute('transform'); shaking = false; return; }
    art.setAttribute('transform', `rotate(${f(3.2*Math.sin(t*Math.PI*7)*(1 - t))} ${f(px)} ${f(py)})`);
    if (loose && t > .45 && d.hang){ d.hang = false; ui.flash('Shaken loose!'); }
    requestAnimationFrame(step); };

}
const collect = () => {
  if (!st.tray || st.flap < 1) return;

  flapTimer = setTimeout(() => swing(0), 900);          // door falls shut on its own
};


ui = mountFigure({
  fig:'03', title:'Vending machine', hint:'insert a coin, punch a code or tap a product',
  idea:"The machine counts your coins; when there is enough, it pushes your drink off the shelf and it drops into the tray.",

  buttonsLabel:'Machine',

    { label:'Choose a drink', choices: st => ROWS.flatMap((row,r) => COL_Y.map((_,c) => ({
        label:`${row.code}${c+1} ${money(row.price)}`, disabled: !st.stock[r][c] || st.credit < row.price - 1e-9, onClick: () => vend(r,c) }))) },
    { label:'Open pickup door', onClick: () => { if (st.flapTarget) return ui.flash('The door is already open'); swing(1); } },
    { label:'Take your drink', onClick: () => st.tray ? (st.flap < 1 ? ui.flash('Open the pickup door first') : collect()) : ui.flash('Nothing in the tray yet') },
    { label:'Return change', onClick: refund },

  params:(st,q) => {

});

      gs.map(g => [g.dataset.t, ...at(g)]).sort((a, b) => ((a[1] > cx) - (b[1] > cx)) || a[2] - b[2]).forEach(([t]) => { if (!num.has(t)) num.set(t, num.size + 1); }); }
    for (const g of gs){ const n = String(num.get(g.dataset.t)); if (g.dataset.n !== n){ g.dataset.n = n; const t = g.querySelector("text"); if (t) t.textContent = n; } } };
  const mark = () => { hs.textContent = sel ? `#fig .tag[data-n="${sel}"] rect{fill:#231e16!important}#fig .tag[data-n="${sel}"] text{fill:#fff4d6}#fig .tag[data-n="${sel}"] path{stroke-width:2.4}` : "";

  lg.addEventListener("click", e => { const b = e.target.closest("button"); if (!b) return; sel = sel === +b.dataset.n ? 0 : +b.dataset.n; mark(); });
